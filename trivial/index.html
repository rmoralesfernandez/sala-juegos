<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quesito Show</title>
<meta name="theme-color" content="#141821">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap">
<script>window.APP_KEY="trivial"</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../shared/claude-shim.js"></script>
<script src="../shared/turno.js"></script>
<script src="preguntas.js"></script>
<style>
/* Layout: plató de concurso a una columna — cabecera con marcador, escenario central con la pregunta, mandos grandes abajo */
:root{
  --stage:#17123A; --stage-2:#241C5C; --panel:#2E2672; --line:#463C9E;
  --ink:#FFFFFF; --muted:#B9B2F0; --gold:#FFC93C; --ok:#36D27A; --bad:#FF5C6C;
  --geo:#2D8CFF; --ocio:#F1489D; --hist:#F7B500; --arte:#B0743F; --cien:#2FB457; --dep:#FF7A1A;
  --a1:#E8364F; --a2:#2D8CFF; --a3:#F7B500; --a4:#2FB457;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--stage-2),var(--stage) 70%) fixed;background-color:var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* botones */
.btn{appearance:none;border:0;border-radius:16px;min-height:52px;padding:0 20px;background:var(--panel);color:var(--ink);font-family:var(--display);font-size:20px;letter-spacing:.02em;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:#2B1B00}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
input.text{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--stage);padding:0 14px;font-size:18px;font-weight:600}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:24px;text-align:center}
label.lbl{display:grid;gap:6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* portada */
.hero{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:18px 6px}
.logo{font-family:var(--display);font-size:clamp(46px,14vw,72px);line-height:.9;color:var(--gold);text-shadow:0 5px 0 #B3471E,0 10px 24px rgba(0,0,0,.4);transform:rotate(-3deg)}
.logo small{display:block;font-size:.42em;color:var(--ink);text-shadow:0 3px 0 #3A2C8F;transform:rotate(2deg)}
.pie{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--geo) 0 60deg,var(--ocio) 0 120deg,var(--hist) 0 180deg,var(--arte) 0 240deg,var(--cien) 0 300deg,var(--dep) 0 360deg);box-shadow:0 0 0 6px var(--ink),0 10px 30px rgba(0,0,0,.45);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--panel);border-radius:20px;padding:16px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card h2{font-size:22px}
.how{display:grid;gap:8px;font-size:15px}
.how b{color:var(--gold)}
.msg{min-height:1.4em;color:var(--gold);text-align:center;font-weight:600}
.msg.err{color:var(--bad)}

/* barra superior de partida */
.top{display:flex;align-items:center;gap:10px}
.chip{font-family:var(--display);font-size:15px;letter-spacing:.12em;background:var(--panel);padding:6px 12px;border-radius:999px}
.top .sp{flex:1}
.mini{display:flex;gap:6px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}

/* lobby */
.big-code{font-family:var(--display);font-size:56px;letter-spacing:.18em;line-height:1;text-align:center;color:var(--gold)}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--stage);border-radius:14px;padding:8px 10px;font-weight:600;min-width:0}
.plist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#1A1240;background:var(--c,#fff)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 60px;appearance:none;border:0;border-radius:12px;min-height:44px;background:var(--stage);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2B1B00}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--gold)}

/* escenario */
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.cat-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--cc);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#14102E}
.cat-tag i{width:16px;height:16px;border-radius:50%;background:#fff;opacity:.85}
.qbox{background:var(--ink);color:#14102E;border-radius:22px;padding:20px 18px;box-shadow:0 8px 0 rgba(0,0,0,.3);position:relative}
.qbox .kind{font-family:var(--display);font-size:14px;letter-spacing:.08em;color:var(--cc);text-transform:uppercase}
.qbox h2{font-family:var(--body);font-weight:800;font-size:clamp(20px,5.6vw,26px);line-height:1.2;margin-top:4px}
.qbox .sub{margin-top:6px;color:#5A5390;font-weight:600;font-size:14px}
.timer{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .2s linear}
.timer.hot i{background:var(--bad)}
.opts{display:grid;gap:10px}
.opt{appearance:none;border:0;border-radius:18px;min-height:62px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--oc);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s,opacity .2s}
.opt .k{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.opt:active{transform:translateY(3px)}
.opt.dim{opacity:.35}
.opt.pick{box-shadow:0 0 0 4px var(--ink),0 5px 0 rgba(0,0,0,.3)}
.opt.right{box-shadow:0 0 0 4px var(--ok),0 5px 0 rgba(0,0,0,.3);opacity:1}
.opt .who{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.opt .who .av{width:24px;height:24px;font-size:12px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-family:var(--display);font-size:24px;min-height:84px}
.numin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.numin input{font-family:var(--display);font-size:28px;text-align:center}
.ord-slots{display:grid;gap:8px}
.slot{min-height:52px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;gap:10px;padding:6px 12px;font-weight:800}
.slot b{font-family:var(--display);color:var(--gold);width:22px}
.slot.full{border-style:solid;background:var(--panel);cursor:pointer}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.ord-pool button{appearance:none;border:0;border-radius:14px;min-height:48px;padding:0 14px;background:var(--ink);color:#14102E;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.wait{display:grid;place-items:center;gap:8px;text-align:center;padding:18px;background:var(--panel);border-radius:18px}
.wait .dots{font-family:var(--display);font-size:28px;letter-spacing:.2em;color:var(--gold)}
.host{display:flex;gap:12px;align-items:flex-start}
.host .face{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 #B3471E}
.host .bubble{background:var(--ink);color:#14102E;border-radius:4px 18px 18px 18px;padding:10px 14px;font-weight:600;flex:1;min-width:0}
.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:8px 12px;min-width:0}
.res li .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res li .ans{color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.res li .pts{margin-left:auto;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.res li .pts.z{color:var(--muted)}
.res li .pts.p{color:var(--ok)}
.res li .pts.n{color:var(--bad)}
.answer{font-family:var(--display);font-size:26px;color:var(--ok);text-align:center}
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:10px 12px;position:relative;overflow:hidden}
.board li .bar{position:absolute;inset:0 auto 0 0;background:rgba(255,201,60,.14);z-index:0}
.board li>*{position:relative;z-index:1}
.board .pos{font-family:var(--display);font-size:22px;color:var(--gold);text-align:center}
.board .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.wedges{display:flex;gap:3px;margin-top:3px}
.wedges i{width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--wc)}
.wheel-wrap{display:grid;place-items:center;gap:14px;padding-block:10px}
.wheel{position:relative;width:min(70vw,280px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--geo) 0 60deg,var(--ocio) 0 120deg,var(--hist) 0 180deg,var(--arte) 0 240deg,var(--cien) 0 300deg,var(--dep) 0 360deg);box-shadow:0 0 0 8px var(--ink),0 14px 40px rgba(0,0,0,.5);transition:transform 3s cubic-bezier(.17,.67,.2,1)}
.wheel::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 6px var(--stage)}
.pointer{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--ink);margin-bottom:-22px;position:relative;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.intro{display:grid;gap:12px;text-align:center;justify-items:center;padding-block:10px}
.intro .type{font-family:var(--display);font-size:clamp(36px,11vw,54px);line-height:.95;color:var(--gold);text-shadow:0 4px 0 #B3471E;transform:rotate(-2deg)}
.intro .rules{max-width:34ch;font-weight:600}
.bets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bets button{appearance:none;border:0;border-radius:14px;min-height:56px;background:var(--panel);font-family:var(--display);font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.bets button[aria-pressed="true"]{background:var(--gold);color:#2B1B00}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;text-align:center}
.podium div{border-radius:14px 14px 0 0;background:var(--panel);padding:10px 6px;display:grid;gap:4px;justify-items:center;min-width:0}
.podium div .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.podium .p1{min-height:150px;background:var(--gold);color:#2B1B00}
.podium .p2{min-height:115px}
.podium .p3{min-height:90px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pop{animation:pop .35s cubic-bezier(.2,.8,.3,1.3)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.turnbar .st-franja{margin:0;font-family:var(--body)}
.turnbar .st-quien{font-family:var(--display);font-weight:400;letter-spacing:.02em}
.turnbar.light .st-franja.st-tuyo{color:#1A1240}
.turnbar.light .st-franja.st-tuyo .st-punto{background:#1A1240;box-shadow:0 0 0 3px rgba(26,18,64,.25)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#14102E;padding:10px 16px;border-radius:12px;font-weight:800;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.pie,.wheel,.pop,.confetti i{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="logo">Quesito<small>Show</small></div><p class="muted">Conectando con el plató…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" class="confetti" aria-hidden="true"></div>

<script>
(() => {
"use strict";
/* ================= datos fijos ================= */
const CATS = {
  geo: { n: "Geografía", c: "var(--geo)" }, ocio: { n: "Entretenimiento", c: "var(--ocio)" },
  hist: { n: "Historia", c: "var(--hist)" }, arte: { n: "Arte y Literatura", c: "var(--arte)" },
  cien: { n: "Ciencia y Naturaleza", c: "var(--cien)" }, dep: { n: "Deportes", c: "var(--dep)" }
};
const CAT_KEYS = Object.keys(CATS);
const TYPES = {
  mc: { n: "Respuesta rápida", rules: "Tres preguntas tipo test. Cuanto antes aciertes, más puntos.", count: 3, dur: 15 },
  tf: { n: "¿Verdad o trola?", rules: "Cinco frases a toda velocidad. ¿Es verdad o es una trola?", count: 5, dur: 7 },
  num: { n: "Calcula", rules: "Nadie lo sabe exacto. Gana quien más se acerque. Si clavas el número, premio gordo.", count: 2, dur: 20 },
  ord: { n: "Ordena", rules: "Toca las opciones en el orden correcto. Puntos por cada posición acertada.", count: 2, dur: 25 }
};
const COLORS = ["#FFC93C", "#5EE6A8", "#7FB8FF", "#FF8FB8", "#C9A2FF", "#FF9F5A", "#9BE15D", "#5FE0E6"];
const OPT_COLORS = ["var(--a1)", "var(--a2)", "var(--a3)", "var(--a4)"];
const LINES = {
  allRight: ["¡Pleno! Esto ya no es un concurso, es una reunión de catedráticos.", "Todos bien. Me vais a dejar sin trabajo.", "Acierto general. Os habéis copiado, lo sé."],
  noneRight: ["Silencio en el plató. Nadie. Absolutamente nadie.", "Cero aciertos. Voy a pedir que revisen el agua de este estudio.", "Ni uno. Lo apunto para el blooper de fin de año."],
  oneRight: ["Solo {n} lo sabía. Aplausos… o sospechas.", "{n} contra el mundo, y gana {n}.", "Únicamente {n}. Los demás, a repasar."],
  fast: ["{n} ha contestado más rápido que el WiFi del bar.", "{n} pulsa antes de que termine de leer. Así no se puede.", "Récord de velocidad para {n}."],
  num: ["{n} es el que más se arrima. Ojo de halcón.", "La calculadora humana de hoy: {n}.", "{n} lo ha clavado más que nadie."],
  numExact: ["¡{n} lo ha clavado EXACTO! Que alguien revise sus bolsillos."],
  ord: ["{n} lo tiene todo ordenado, hasta el cajón de los calcetines.", "Orden perfecto para {n}. Marie Kondo estaría orgullosa."],
  wedge: ["¡{n} se lleva el quesito de {c}!", "Quesito de {c} para {n}. Que no se lo coma todavía."],
  wedgeNone: ["Nadie puntúa en {c}. El quesito se queda en el plató."],
  bet: ["Llega el Doble o nada. Apostad sin miedo… o con mucho miedo."],
  end: ["Y el campeón del Quesito Show es… ¡{n}!", "¡{n} gana el Quesito Show! Que alguien le traiga un trofeo de verdad."]
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const fill = (t, o) => t.replace(/\{(\w)\}/g, (_, k) => o[k] ?? "");
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const fmt = n => Number(n).toLocaleString("es-ES", { maximumFractionDigits: 3 });
const $app = document.getElementById("app");
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

/* ================= estado ================= */
const S = {
  db: null, uid: null, sample: null, ready: false, offline: false,
  name: (localStorage.getItem("sala.nick") || "").slice(0, 16),
  code: null, g: null, players: [], answers: {}, unsubs: [],
  my: {}, viewKey: "", t0: 0, ordPick: [], betPick: null, numVal: "",
  homeMsg: "", homeErr: false, busy: false, cfg: { rounds: 6, ai: false }
};
const me = () => S.uid;
const isHost = () => S.g && S.g.host === S.uid;

/* ================= arranque ================= */
async function boot() {
  try {
    const [db, user, sample] = await Promise.all(["db", "user", "sample"].map(n => window.claude ? claude.use(n).catch(() => null) : null));
    S.db = db; S.sample = sample;
    if (user) S.uid = await user.id();
  } catch {}
  if (!S.db || !S.uid) S.offline = true;
  S.ready = true;
  const h = (location.hash || "").replace("#", "").toUpperCase();
  const last = ls.get("qs.last");
  if (!S.offline && /^[A-Z]{4}$/.test(h)) S.prefill = h;
  else if (!S.offline && last && last.code && Date.now() - last.t < 3 * 3600e3) S.rejoin = last.code;
  render();
}

/* ================= sala ================= */
function watch(code) {
  unwatch(); S.code = code; ls.set("qs.last", { code, t: Date.now() });
  const base = "games/" + code;
  S.unsubs.push(S.db.doc(base).onSnapshot(snap => {
    if (!snap.exists) { leave("Esa partida ya no existe."); return; }
    const prev = S.g; S.g = snap.data();
    onGame(prev); render();
  }, () => leave("Se ha perdido la conexión con la partida.")));
  S.unsubs.push(S.db.collection(base + "/players").orderBy("joinedAt").onSnapshot(q => {
    S.players = q.docs.map(d => ({ id: d.id, ...d.data() })); render(); hostCheckAll();
  }, () => {}));
  S.unsubs.push(S.db.collection(base + "/answers").onSnapshot(q => {
    const a = {}; q.docs.forEach(d => { a[d.id] = d.data(); }); S.answers = a; hostCheckAll(); render();
  }, () => {}));
}
function unwatch() { S.unsubs.forEach(u => { try { u(); } catch {} }); S.unsubs = []; S.g = null; S.players = []; S.answers = {}; clearTimeout(H.timer); }
function leave(msg) { unwatch(); S.code = null; S.homeMsg = msg || ""; S.homeErr = !!msg; history.replaceState(null, "", location.pathname); render(); }
function saveName() {
  const el = document.getElementById("nm"); const v = ((el && el.value) || S.name || "").trim().slice(0, 16);
  if (!v) { S.homeMsg = "Escribe tu nombre para salir en pantalla."; S.homeErr = true; render(); return false; }
  S.name = v; try { localStorage.setItem("sala.nick", v); } catch {} return true;
}

/* ================= presentador (solo el anfitrión) ================= */
const H = { timer: null, plan: null, writing: false };
const planKey = () => "qs.plan." + S.code;
function usedSet() { return new Set(ls.get("qs.used") || []); }
function markUsed(ids) { const u = [...usedSet(), ...ids].slice(-400); ls.set("qs.used", u); }
function bankPick(cat, type, n) {
  const pool = (window.BANCO[cat] && window.BANCO[cat][type]) || [];
  const used = usedSet();
  const withId = pool.map((q, i) => ({ ...q, id: `${cat}.${type}.${i}` }));
  let fresh = shuffle(withId.filter(q => !used.has(q.id)));
  if (fresh.length < n) fresh = fresh.concat(shuffle(withId.filter(q => used.has(q.id))));
  const out = fresh.slice(0, n); markUsed(out.map(q => q.id)); return out;
}
function buildPlan(rounds) {
  const cats = []; while (cats.length < rounds) cats.push(...shuffle(CAT_KEYS));
  const types = []; while (types.length < rounds) types.push(...shuffle(Object.keys(TYPES)));
  for (let i = 1; i < types.length; i++) if (types[i] === types[i - 1]) { const j = (i + 1) % types.length; [types[i], types[j]] = [types[j], types[i]]; }
  const plan = { rounds: [] };
  for (let r = 0; r < rounds; r++) plan.rounds.push({ cat: cats[r], type: types[r], qs: bankPick(cats[r], types[r], TYPES[types[r]].count) });
  plan.final = { cat: pick(CAT_KEYS) }; plan.final.qs = bankPick(plan.final.cat, "mc", 1);
  return plan;
}
/* preguntas nuevas con Gemini, si está activado; si falla, se queda la del banco */
async function aiRound(round) {
  if (!S.sample || !(S.g && S.g.cfg && S.g.cfg.ai)) return;
  const t = round.type, n = TYPES[t].count, cat = CATS[round.cat].n;
  const shape = {
    mc: '{"qs":[{"q":"pregunta","o":["correcta","incorrecta","incorrecta","incorrecta"]}]} (la correcta SIEMPRE la primera)',
    tf: '{"qs":[{"q":"afirmación","a":true}]} (mezcla verdaderas y falsas)',
    num: '{"qs":[{"q":"pregunta cuya respuesta es un número","a":1234,"u":"unidad"}]}',
    ord: '{"qs":[{"q":"Ordena de ... a ...","i":["primero","segundo","tercero","cuarto"]}]} (i ya en el orden correcto)'
  }[t];
  const prompt = `Eres guionista de un concurso de preguntas para amigos en España, con tono divertido pero datos rigurosos.
Crea ${n} preguntas NUEVAS de la categoría «${cat}» en español de España. Nivel medio: que se puedan acertar sin ser experto.
Solo hechos verificables y sin ambigüedad; nada de actualidad que cambie con el tiempo. Textos cortos (máximo 110 caracteres por pregunta, 30 por opción).
Responde SOLO con JSON con esta forma: ${shape}`;
  try {
    const data = await Promise.race([S.sample.json(prompt, { modelTier: "quick" }), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 9000))]);
    const qs = (data && data.qs || []).slice(0, n).map(x => {
      if (t === "mc" && x.q && Array.isArray(x.o) && x.o.length === 4) return { q: String(x.q), o: x.o.map(String), a: 0 };
      if (t === "tf" && x.q && typeof x.a === "boolean") return { q: String(x.q), a: x.a };
      if (t === "num" && x.q && isFinite(Number(x.a))) return { q: String(x.q), a: Number(x.a), u: String(x.u || "") };
      if (t === "ord" && x.q && Array.isArray(x.i) && x.i.length === 4) return { q: String(x.q), i: x.i.map(String) };
      return null;
    }).filter(Boolean);
    if (qs.length === n) { round.qs = qs; round.ai = true; }
  } catch {}
}
function savePlan() { ls.set(planKey(), H.plan); }
async function put(patch) {
  const g = { ...S.g, ...patch, seq: (S.g.seq || 0) + 1 };
  S.g = g; render();
  try { await S.db.doc("games/" + S.code).set(g); } catch { toast("No se pudo guardar. Reintentando…"); setTimeout(() => S.db.doc("games/" + S.code).set(S.g).catch(() => {}), 1200); }
}
const after = (ms, fn) => { clearTimeout(H.timer); H.timer = setTimeout(fn, ms); };
const seatIds = () => Object.keys((S.g && S.g.scores) || {});
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || "Alguien";
const colorOf = id => (S.players.find(p => p.id === id) || {}).color || "#fff";

async function hostStart() {

  const scores = {}, wedges = {}; S.players.forEach(p => { scores[p.id] = 0; wedges[p.id] = []; });

async function hostNextRound() {
  const r = (S.g.round ?? -1) + 1;

  const R = H.plan.rounds[r], idx = CAT_KEYS.indexOf(R.cat);

  const ai = aiRound(R).then(savePlan);
  await put({ phase: "spin", round: r, cat: R.cat, type: R.type, spinDeg: turns, roundPts: {}, q: null, reveal: null, line: "" });
  after(3600, async () => { await ai; await put({ phase: "intro", line: R.ai ? "Preguntas recién salidas del horno, escritas por la IA." : "" }); after(3800, () => hostAsk(0)); });
}
function publicQ(R, qi) {
  const x = R.qs[qi], base = { kind: R.type, text: x.q };
  if (R.type === "mc") { const order = shuffle([0, 1, 2, 3]); return { pub: { ...base, opts: order.map(i => x.o[i]) }, right: order.indexOf(x.a) }; }
  if (R.type === "tf") return { pub: base, right: x.a };
  if (R.type === "num") return { pub: { ...base, unit: x.u || "" }, right: x.a };
  if (R.type === "ord") return { pub: { ...base, items: shuffle(x.i) }, right: x.i };
}
async function hostAsk(qi, final) {

  const type = final ? "mc" : R.type;
  const { pub, right } = publicQ({ ...R, type }, qi);

  const key = final ? "final" : `${S.g.round}.${qi}`;
  const dur = final ? 20 : TYPES[type].dur;
  await put({ phase: "q", qi, qn: final ? 1 : R.qs.length, key, q: pub, dur, startedAt: Date.now(), reveal: null, final: !!final, cat: final ? R.cat : S.g.cat, line: "" });

}
function hostCheckAll() {
  if (!isHost() || !S.g || !["q", "bet"].includes(S.g.phase)) return;
  const ids = seatIds(), key = S.g.phase === "bet" ? "bet" : S.g.key;
  if (ids.length && ids.every(id => S.answers[id] && S.answers[id].k === key)) {

}
function score(kind, right, ans, durMs) {
  const per = {}, ids = seatIds();
  if (kind === "num") {
    const got = ids.filter(id => ans[id] && isFinite(ans[id].a)).map(id => ({ id, d: Math.abs(Number(ans[id].a) - right) })).sort((a, b) => a.d - b.d);
    const prizes = [1000, 600, 300]; let rank = 0;
    got.forEach((x, i) => { if (i > 0 && x.d > got[i - 1].d) rank = i; per[x.id] = { a: ans[x.id].a, pts: (prizes[rank] || 0) + (x.d === 0 ? 500 : 0), ok: x.d === 0, d: x.d }; });
  } else {
    ids.forEach(id => {
      const x = ans[id]; if (!x) return;
      const speed = Math.max(0, 1 - (x.ms || durMs) / durMs);
      if (kind === "mc") { const ok = x.a === right; per[id] = { a: x.a, ok, pts: ok ? 500 + Math.round(500 * speed / 10) * 10 : 0 }; }
      if (kind === "tf") { const ok = x.a === right; per[id] = { a: x.a, ok, pts: ok ? 200 + Math.round(100 * speed / 10) * 10 : 0 }; }
      if (kind === "ord") { const n = (x.a || []).filter((v, i) => v === right[i]).length; per[id] = { a: x.a, n, ok: n === 4, pts: n * 250 + (n === 4 ? 250 : 0) }; }
    });
  }
  return per;
}
async function hostReveal() {
  if (S.g.phase !== "q") return;
  const key = S.g.key, ans = {};
  seatIds().forEach(id => { const a = S.answers[id]; if (a && a.k === key) ans[id] = a; });
  const kind = H.kind || S.g.q.kind, right = H.right;
  if (right === undefined) { after(500, () => hostNextAfterReveal()); return; }
  let per = score(kind, right, ans, S.g.dur * 1000);
  const scores = { ...S.g.scores }, roundPts = { ...(S.g.roundPts || {}) };
  if (S.g.final) {
    const bets = S.g.bets || {}; per = {};
    seatIds().forEach(id => { const b = bets[id] || 0, x = ans[id], ok = !!x && x.a === right; per[id] = { a: x ? x.a : null, ok, pts: ok ? b : -b }; });
  }
  Object.entries(per).forEach(([id, r]) => { scores[id] = (scores[id] || 0) + r.pts; roundPts[id] = (roundPts[id] || 0) + r.pts; });
  const ok = Object.entries(per).filter(([, r]) => r.ok).map(([id]) => id), n = seatIds().length;
  let line;
  if (kind === "num") { const best = Object.entries(per).sort((a, b) => a[1].d - b[1].d)[0]; line = best ? fill(pick(best[1].d === 0 ? LINES.numExact : LINES.num), { n: nameOf(best[0]) }) : pick(LINES.noneRight); }

  else if (!ok.length) line = pick(LINES.noneRight);
  else if (ok.length === n && n > 1) line = pick(LINES.allRight);

  else { const f = ok.slice().sort((a, b) => (ans[a].ms || 9e9) - (ans[b].ms || 9e9))[0]; line = fill(pick(LINES.fast), { n: nameOf(f) }); }

const listNames = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
async function hostNextAfterReveal() {

  const wedges = { ...S.g.wedges }; winners.forEach(id => { const w = new Set(wedges[id] || []); w.add(R.cat); wedges[id] = [...w]; });
  const c = CATS[R.cat].n;
  const line = winners.length ? fill(pick(LINES.wedge), { n: listNames(winners.map(nameOf)), c }) : fill(pick(LINES.wedgeNone), { c });

function share() {
  const url = location.origin + location.pathname + "#" + S.code;
  if (navigator.share) { navigator.share({ title: "Quesito Show", text: "Entra al Quesito Show con el código " + S.code, url }).catch(() => {}); return; }
  navigator.clipboard?.writeText(url).then(() => toast("Enlace copiado"), () => toast(url));
}
function hostLine(line) { return line ? `<div class="host pop"><div class="face" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B1B00" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></div><p class="bubble">${esc(line)}</p></div>` : ""; }
function catTag(cat) { const c = CATS[cat] || { n: "", c: "#fff" }; return `<span class="cat-tag" style="--cc:${c.c}"><i></i>${esc(c.n)}</span>`; }
function top() {
  const g = S.g, mine = (g.scores || {})[me()];
  const rnd = g.final ? "Final" : g.round >= 0 ? `Ronda ${g.round + 1}/${(g.cfg || {}).rounds || ""}` : "";
  return `<div class="top"><button class="btn ghost" id="out" style="min-height:40px;font-size:16px">Salir</button><span class="chip">${esc(rnd)}</span><span class="sp"></span>${mine !== undefined ? `<span class="mini">${avatar(me())} ${fmt(mine)}</span>` : `<span class="chip">Público</span>`}</div>`;
}
function renderGame() {
  const g = S.g, key = [g.phase, g.key, g.round, g.seq, !!myAns(), S.ordPick.join(","), S.betPick, myAns() ? pendingIds().join(",") : ""].join("|");
  let body = "";
  const p = g.phase;
  if (p === "spin") body = `<div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${(g.spinDeg || 0) - 1440}deg)"></div><h2>¡Gira la ruleta!</h2></div>`;
  else if (p === "intro") { const t = TYPES[g.type]; body = `<div class="intro pop">${catTag(g.cat)}<div class="type">${esc(t.n)}</div><p class="rules">${esc(t.rules)}</p></div>${hostLine(g.line)}`; }
  else if (p === "q") body = questionView();
  else if (p === "reveal") body = revealView();
  else if (p === "round") body = `${hostLine(g.line)}${boardView(true)}`;
  else if (p === "bet") body = betView();
  else if (p === "end") body = endView();
  const turn = turnState();
  const changed = view(top() + (turn ? `<div class="turnbar${turn.tuyo ? " light" : ""}">${window.SalaTurno.html(turn)}</div>` : "") + `<section class="stage">${body}</section>`, key);
  if (turn) window.SalaTurno.marcar(turn); else window.SalaTurno?.limpiar();
  if (!changed) return;
  on("#out", "click", () => leave(""));
  if (p === "spin") requestAnimationFrame(() => requestAnimationFrame(() => { const w = document.getElementById("wheel"); if (w) w.style.transform = `rotate(${g.spinDeg}deg)`; }));
  bindQuestion();
  on("#again", "click", async () => { await put({ status: "lobby", phase: "lobby", round: -1, scores: null, wedges: null, q: null, reveal: null, line: "" }); });
  on("#home", "click", () => leave(""));
  tick();
}
/* Indicador de turno (shared/turno.js). Aquí todos responden a la vez: no hay turnos,
   así que la franja dice si te falta responder a ti o quién falta por responder. */
const pendingIds = () => { const g = S.g, key = g.phase === "bet" ? "bet" : g.key; return seatIds().filter(id => !(S.answers[id] && S.answers[id].k === key)); };
function turnState() {
  const g = S.g;
  if (!window.SalaTurno || !g || !["q", "bet"].includes(g.phase) || !seatIds().includes(me())) return null;
  const bet = g.phase === "bet";
  if (!myAns()) return { quien: nameOf(me()), color: colorOf(me()), tuyo: true, compacta: true, aviso: false, clave: g.key,
    accion: bet ? "Elige cuánto te juegas" : "Responde antes de que acabe el tiempo" };
  const left = pendingIds();
  if (!left.length) return null;
  return { quien: listNames(left.map(nameOf)), color: left.length === 1 ? colorOf(left[0]) : "#6d5dfc", tuyo: false, compacta: true, clave: g.key,
    accion: `${left.length === 1 ? "Falta por" : "Faltan por"} ${bet ? "apostar" : "responder"}` };
}
function qHead() {
  const g = S.g, t = g.final ? { n: "Doble o nada" } : TYPES[g.q.kind], c = CATS[g.cat] || {};
  const sub = g.q.kind === "num" && g.q.unit ? `Respuesta en ${esc(g.q.unit)}` : g.qn > 1 ? `Pregunta ${g.qi + 1} de ${g.qn}` : "";
  return `${catTag(g.cat)}<div class="qbox pop" style="--cc:${c.c}"><div class="kind">${esc(t.n)}</div><h2>${esc(g.q.text)}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}</div>`;
}
function questionView() {
  const g = S.g, q = g.q, mine = myAns(), seat = seatIds().includes(me());
  const timer = `<div class="timer" id="timer"><i></i></div>`;
  let ctl = "";
  if (!seat) ctl = `<div class="wait"><p>Estás viendo la partida como público.</p></div>`;
  else if (q.kind === "mc") ctl = `<div class="opts">${q.opts.map((o, i) => `<button class="opt${mine ? (mine.a === i ? " pick" : " dim") : ""}" data-mc="${i}" style="--oc:${OPT_COLORS[i]}"${mine ? " disabled" : ""}><span class="k">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`;
  else if (q.kind === "tf") ctl = `<div class="tf"><button class="opt${mine ? (mine.a === true ? " pick" : " dim") : ""}" data-tf="1" style="--oc:var(--a4)"${mine ? " disabled" : ""}>Verdad</button><button class="opt${mine ? (mine.a === false ? " pick" : " dim") : ""}" data-tf="0" style="--oc:var(--a1)"${mine ? " disabled" : ""}>Trola</button></div>`;
  else if (q.kind === "num") ctl = mine ? `<div class="wait"><p>Has dicho <b>${fmt(mine.a)}</b>${q.unit ? " " + esc(q.unit) : ""}.</p></div>` : `<form class="numin" id="numf"><input id="numv" class="text" inputmode="decimal" autocomplete="off" placeholder="Tu número" value="${esc(S.numVal)}" aria-label="Tu respuesta"><button class="btn gold" type="submit">Enviar</button></form>`;
  else if (q.kind === "ord") {
    const picked = mine ? mine.a : S.ordPick;
    ctl = `<div class="ord-slots">${[0, 1, 2, 3].map(i => `<div class="slot${picked[i] ? " full" : ""}" ${!mine && picked[i] ? `data-unpick="${i}" role="button" tabindex="0"` : ""}><b>${i + 1}</b>${esc(picked[i] || "")}</div>`).join("")}</div>
      ${mine ? "" : `<div class="ord-pool">${q.items.filter(x => !S.ordPick.includes(x)).map(x => `<button data-ord="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="btn gold wide" id="ordgo"${S.ordPick.length === 4 ? "" : " disabled"}>Enviar orden</button>`}`;
  }
  const foot = mine && !pendingIds().length ? `<p class="muted small" style="text-align:center">¡Todos han respondido!</p>` : "";
  return qHead() + timer + ctl + foot;
}
function bindQuestion() {
  $app.querySelectorAll("[data-mc]").forEach(b => b.addEventListener("click", () => answer(+b.dataset.mc)));
  $app.querySelectorAll("[data-tf]").forEach(b => b.addEventListener("click", () => answer(b.dataset.tf === "1")));
  const nf = document.getElementById("numf");
  if (nf) {
    const inp = document.getElementById("numv"); inp.addEventListener("input", () => { S.numVal = inp.value; });
    nf.addEventListener("submit", e => { e.preventDefault(); const v = Number(String(inp.value).replace(/\./g, "").replace(",", ".")); if (!inp.value.trim() || !isFinite(v)) { toast("Escribe un número"); return; } answer(v); });
    if (!matchMedia("(pointer:coarse)").matches) inp.focus();
  }
  $app.querySelectorAll("[data-ord]").forEach(b => b.addEventListener("click", () => { if (S.ordPick.length < 4) { S.ordPick = [...S.ordPick, b.dataset.ord]; render(); } }));
  $app.querySelectorAll("[data-unpick]").forEach(b => b.addEventListener("click", () => { S.ordPick = S.ordPick.filter((_, i) => i !== +b.dataset.unpick); render(); }));
  on("#ordgo", "click", () => { if (S.ordPick.length === 4) answer(S.ordPick); });
  $app.querySelectorAll("[data-bet]").forEach(b => b.addEventListener("click", () => placeBet(+b.dataset.bet)));
}
function tick() {
  cancelAnimationFrame(S.raf);
  const el = document.getElementById("timer"); if (!el || !S.g) return;
  const total = (S.g.dur || 10) * 1000;
  const loop = () => {
    const left = Math.max(0, total - (performance.now() - S.t0)), f = left / total;
    const i = el.firstElementChild; if (i) i.style.transform = `scaleX(${f})`;
    el.classList.toggle("hot", f < .25);
    if (left > 0 && document.body.contains(el)) S.raf = requestAnimationFrame(loop);
  };
  loop();
}
function ansText(kind, a, q) {
  if (a === null || a === undefined) return "Sin respuesta";
  if (kind === "mc") return q.opts[a] ?? "—";
  if (kind === "tf") return a ? "Verdad" : "Trola";
  if (kind === "num") return fmt(a);
  if (kind === "ord") return (a || []).join(" › ");
  return String(a);
}
function revealView() {
  const g = S.g, q = g.q, kind = q.kind, rv = g.reveal || {}, per = rv.per || {};
  let shown = "";
  if (kind === "mc") shown = `<div class="opts">${q.opts.map((o, i) => { const who = Object.keys(per).filter(id => per[id].a === i); return `<div class="opt ${i === rv.right ? "right" : "dim"}" style="--oc:${OPT_COLORS[i]}"><span class="k">${"ABCD"[i]}</span>${esc(o)}<span class="who">${who.map(id => avatar(id, true)).join("")}</span></div>`; }).join("")}</div>`;
  else if (kind === "tf") shown = `<p class="answer">${rv.right ? "¡Es VERDAD!" : "¡Es una TROLA!"}</p>`;
  else if (kind === "num") shown = `<p class="answer">${fmt(rv.right)} ${esc(q.unit || "")}</p>`;
  else if (kind === "ord") shown = `<div class="ord-slots">${rv.right.map((x, i) => `<div class="slot full" style="border-color:var(--ok)"><b>${i + 1}</b>${esc(x)}</div>`).join("")}</div>`;
  const ids = seatIds().slice().sort((a, b) => ((per[b] || {}).pts || 0) - ((per[a] || {}).pts || 0));
  const rows = ids.map(id => {
    const r = per[id], pts = r ? r.pts : 0;
    const detail = !r ? "Sin respuesta" : kind === "ord" ? `${r.n}/4 en su sitio` : kind === "num" ? `${fmt(r.a)} · a ${fmt(r.d)}` : ansText(kind, r.a, q);
    return `<li>${avatar(id)}<span class="nm">${esc(nameOf(id))}</span><span class="ans">${esc(detail)}</span><span class="pts ${pts > 0 ? "p" : pts < 0 ? "n" : "z"}">${pts > 0 ? "+" : ""}${fmt(pts)}</span></li>`;
  }).join("");
  return qHead() + shown + hostLine(g.line) + `<ul class="res">${rows}</ul>`;
}
function wedgesHTML(id) { return `<span class="wedges">${((S.g.wedges || {})[id] || []).map(c => `<i style="--wc:${CATS[c].c}" title="${esc(CATS[c].n)}"></i>`).join("")}</span>`; }
function boardView(withWedgeAnim) {
  const sc = S.g.scores || {}, ids = Object.keys(sc).sort((a, b) => sc[b] - sc[a]), max = Math.max(1, ...Object.values(sc));
  return `<ul class="board">${ids.map((id, i) => `<li><span class="bar" style="width:${Math.max(0, sc[id]) / max * 100}%"></span><span class="pos">${i + 1}</span>${avatar(id)}<span><span class="nm">${esc(nameOf(id))}</span>${wedgesHTML(id)}</span><span class="sc">${fmt(sc[id])}</span></li>`).join("")}</ul>`;
}
function betView() {
  const g = S.g, mine = myAns(), seat = seatIds().includes(me()), sc = Math.max(0, (g.scores || {})[me()] || 0);
  const ctl = !seat ? "" : mine ? `<div class="wait"><p>Apuestas <b>${fmt(mine.a)}</b> puntos. Suerte.</p></div>`
    : `<div class="bets">${[0, 25, 50, 75, 100].map(p => `<button data-bet="${p}">${p}%</button>`).join("")}</div><p class="muted small" style="text-align:center">Tienes ${fmt(sc)} puntos. Si aciertas, sumas lo apostado; si fallas, lo pierdes.</p>`;
  return `<div class="intro pop">${catTag(g.cat)}<div class="type">Doble o nada</div><p class="rules">La última pregunta será de ${esc((CATS[g.cat] || {}).n || "")}. ¿Cuánto te juegas?</p></div><div class="timer" id="timer"><i></i></div>${ctl}${hostLine(g.line)}`;
}
function endView() {
  const sc = S.g.scores || {}, ids = Object.keys(sc).sort((a, b) => sc[b] - sc[a]), bonus = S.g.bonus || {};
  const pod = [ids[1], ids[0], ids[2]].map((id, i) => id ? `<div class="${["p2", "p1", "p3"][i]}">${avatar(id)}<span class="nm">${esc(nameOf(id))}</span><b>${fmt(sc[id])}</b>${wedgesHTML(id)}</div>` : "<div style='visibility:hidden'></div>").join("");
  return `${hostLine(S.g.line)}<div class="podium">${pod}</div>${boardView()}
    <p class="muted small" style="text-align:center">Incluye 500 puntos por cada quesito ganado.</p>
    <div class="row">${isHost() ? `<button class="btn gold" id="again">Otra partida</button>` : ""}<button class="btn ghost" id="home">Salir</button></div>`;
}
function confetti() {
  const fx = document.getElementById("fx"); if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["var(--geo)", "var(--ocio)", "var(--hist)", "var(--cien)", "var(--dep)", "var(--gold)"];
  fx.innerHTML = Array.from({ length: 90 }, () => `<i style="left:${Math.random() * 100}%;background:${pick(cols)};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s"></i>`).join("");
  setTimeout(() => { fx.innerHTML = ""; }, 5500);
}
function on(sel, ev, fn) { const el = $app.querySelector(sel); if (el) el.addEventListener(ev, fn); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.g) { S.lastKey = ""; render(); } });

boot();
})();
