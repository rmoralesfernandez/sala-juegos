<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo de Maravillas</title>
<meta name="theme-color" content="#16110D">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manrope:wght@500;700;800&display=swap">
<script>window.APP_KEY="duelo"</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../shared/claude-shim.js"></script>
<script src="motor.js"></script>
<style>
/* Layout: mesa de juego a una columna — rival arriba, frente militar y fichas, pirámide de cartas en el centro, tu ciudad abajo; los detalles salen en una hoja inferior */
:root{
  --bg:#16110D; --bg2:#231A13; --panel:#2B2119; --panel2:#3A2C20; --line:#4E3D2C;
  --ink:#F6ECDD; --muted:#C2AE95; --gold:#E9B949; --gold2:#B9852A; --ok:#5BD08A; --bad:#FF6B5E;
  --brown:#8A5A33; --grey:#8C939C; --blue:#2F6FD6; --green:#2E9E5B; --red:#CF3F2E; --yellow:#E2AE22; --purple:#7D4FC1;
  --age1:#A86E35; --age2:#3F72B8; --age3:#A3433F; --parch:#F4E8D2; --parch-ink:#2A1E12;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{appearance:none;border:0;border-radius:14px;min-height:50px;padding:0 18px;background:var(--panel2);color:var(--ink);font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.gold{background:var(--gold);color:#2A1A04}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
input.text{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;font-weight:700}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:22px;text-align:center}
label.lbl{display:grid;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 0 0 1px var(--line)}
.card h2{font-size:19px}
.msg{min-height:1.4em;color:var(--gold);text-align:center;font-weight:700}
.msg.err{color:var(--bad)}
.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:16px 4px}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:.95;color:var(--gold);text-shadow:0 3px 0 #6B4512,0 10px 30px rgba(0,0,0,.5)}
.logo small{display:block;font-size:.42em;letter-spacing:.3em;color:var(--ink);text-shadow:none;margin-bottom:6px}
.fan{display:flex;justify-content:center;height:86px;margin-top:6px}
.fan i{width:52px;height:74px;border-radius:8px;margin:0 -8px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15)}
.how{display:grid;gap:8px;font-size:14.5px}
.how b{color:var(--gold)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

.top{display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.chip{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;background:var(--panel);padding:6px 11px;border-radius:999px;box-shadow:0 0 0 1px var(--line)}
.big-code{font-family:var(--display);font-weight:900;font-size:52px;letter-spacing:.16em;line-height:1;text-align:center;color:var(--gold)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seat{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:2px;text-align:center;min-width:0}
.seat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.empty{color:var(--muted);border:2px dashed var(--line);background:transparent}
.wait{display:grid;place-items:center;gap:6px;text-align:center;padding:14px;background:var(--panel);border-radius:16px}

/* jugadores */
.pl{background:var(--panel);border-radius:16px;padding:10px 12px;display:grid;gap:7px;box-shadow:0 0 0 1px var(--line);text-align:left;width:100%;appearance:none;border:0;color:inherit}
.pl.turn{box-shadow:0 0 0 2px var(--gold),0 0 22px -6px var(--gold)}
.pl-h{display:flex;align-items:center;gap:8px;min-width:0}
.pl-h .nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl-h .sp{flex:1}
.stat{font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:3px 9px;font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:0 0 auto;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.pl-r{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:13px}
.res{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:2px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.res.z{opacity:.35}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:6px;font-weight:800;font-size:12px;color:#fff;background:var(--cc)}
.pill.y{color:#2A1A04}
.sym{font-size:15px;line-height:1}
.wons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.won{appearance:none;border:0;border-radius:11px;background:var(--bg);padding:6px 4px;display:grid;gap:1px;justify-items:center;text-align:center;min-width:0;position:relative;color:inherit}
.won .e{font-size:20px;line-height:1.1}
.won .n{font-size:10.5px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.won .p{font-size:11px;font-weight:800;color:var(--muted)}
.won.built{background:linear-gradient(180deg,#6B4C1E,#3F2C12);box-shadow:inset 0 0 0 2px var(--gold)}
.won.built .p{color:var(--gold)}
.won.lost{opacity:.3;text-decoration:line-through}
.won.can .p{color:var(--ok)}

/* frente militar */
.mil{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.cap{font-size:17px}
.trk{display:grid;grid-template-columns:repeat(19,1fr);gap:2px;position:relative;height:34px;align-items:end}
.cell{height:16px;border-radius:3px;background:var(--panel2);position:relative}
.cell.z0{background:#5a4a39}
.cell.z1{background:#6c3b2c}.cell.z2{background:#8b3a2a}.cell.z3{background:#ad3b2a}
.cell.z9{background:#e05a3e}
.cell.mine.z1{background:#2d4b6c}.cell.mine.z2{background:#2f5f8b}.cell.mine.z3{background:#3473ad}.cell.mine.z9{background:#4a90e0}
.cell .loot{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;background:var(--gold);color:#2A1A04;border-radius:999px;padding:0 4px;white-space:nowrap}
.pawn{position:absolute;bottom:0;width:calc(100%/19);height:24px;display:grid;place-items:center;transition:left .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.pawn i{width:16px;height:22px;border-radius:50% 50% 4px 4px;background:var(--gold);box-shadow:0 0 0 2px #2A1A04,0 3px 8px rgba(0,0,0,.6)}
.toks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tok{appearance:none;border:0;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d8f5a,#1d5a35);box-shadow:0 0 0 2px #8fd3a4,0 3px 6px rgba(0,0,0,.5);font-size:19px;display:grid;place-items:center;color:inherit;padding:0}
.tok.sm{width:24px;height:24px;font-size:12px;box-shadow:0 0 0 1.5px #8fd3a4}
.lbl2{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}

/* pirámide */
.pyr-wrap{display:grid;justify-items:center;padding-block:4px}
.pyr{position:relative}
.cd{position:absolute;appearance:none;border:0;padding:0;border-radius:7px;background:var(--cc);box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 0 1.5px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;color:#fff;transition:transform .12s,opacity .3s}
.cd .nm{font-size:8.5px;font-weight:800;line-height:1.1;padding:3px 3px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.cd.yellow .nm{color:#2A1A04;text-shadow:none}
.cd .fx{margin:0 3px;background:var(--parch);color:var(--parch-ink);border-radius:4px;min-height:24px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;font-size:13px;font-weight:800;line-height:1.05;padding:2px 1px;text-align:center}
.cd .co{margin-top:auto;font-size:9.5px;font-weight:800;padding:2px 2px 3px 3px;display:flex;justify-content:flex-start;gap:0;flex-wrap:wrap;line-height:1.1;background:rgba(0,0,0,.25)}
.cd .pr{position:absolute;right:-2px;bottom:-2px;font-size:10px;font-weight:800;background:var(--ink);color:var(--parch-ink);border-radius:7px 0 7px 0;padding:1px 5px}
.cd .pr.no{background:var(--bad);color:#fff}
.cd .pr.free{background:var(--ok);color:#06200f}
.cd.acc{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 2px var(--gold)}
.cd.acc.me:hover{transform:translateY(-3px)}
.cd.off{filter:saturate(.75) brightness(.82)}
.cd.back{background:var(--back);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;color:rgba(255,255,255,.75);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px)}
.cd.back.guild{--back:#4D2C78}
.cd.new{animation:flip .45s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}

.bar{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 1px var(--line);min-height:48px}
.bar .t{flex:1;font-weight:700;min-width:0}
.bar.mine{background:linear-gradient(90deg,#5a3f12,#2B2119);box-shadow:0 0 0 2px var(--gold)}
.bar .last{display:block;font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .2s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{font-size:20px}
.sheet .x{margin-left:auto}
.sh-h{display:flex;align-items:center;gap:10px}
.big{border-radius:14px;background:var(--cc);padding:10px;display:grid;gap:8px;color:#fff}
.big.yellow{color:#2A1A04}
.big .ty{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.big .ttl{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.05}
.big .body{background:var(--parch);color:var(--parch-ink);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-weight:600}
.big .body b{font-weight:800}
.costline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800}
.quote{background:var(--panel);border-radius:12px;padding:10px 12px;font-weight:600;display:grid;gap:3px}
.quote.no{box-shadow:inset 0 0 0 2px var(--bad)}
.acts{display:grid;gap:8px}
.wpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wbtn{appearance:none;border:0;border-radius:14px;background:var(--panel2);padding:10px;display:grid;gap:2px;text-align:left;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.wbtn .e{font-size:22px}
.wbtn b{font-size:14px}
.wbtn span{font-size:12.5px;color:var(--muted);font-weight:700}
.wbtn:disabled{opacity:.4}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;min-width:0}
.li .t{flex:1;min-width:0;display:grid;gap:1px}
.li .t b{font-weight:800}
.li .t span{font-size:13px;color:var(--muted)}
.li .sw{width:10px;align-self:stretch;border-radius:4px;background:var(--cc);flex:0 0 auto}
.grp{display:grid;gap:6px}
.grp h4{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--cc);color:#fff;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.chips span.y{color:#2A1A04}
table.sc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sc th,table.sc td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc tr.tot td{font-family:var(--display);font-weight:900;font-size:19px;color:var(--gold);border:0}
table.sc thead th{font-size:13px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* draft */
.draft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dw{background:var(--panel);border-radius:16px;padding:12px;display:grid;gap:6px;box-shadow:0 0 0 1px var(--line);align-content:start}
.dw .e{font-size:30px;line-height:1}
.dw h3{font-size:15px}
.dw ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.dw .btn{margin-top:4px}

.banner{text-align:center;display:grid;gap:6px;padding:18px 12px;border-radius:20px;background:linear-gradient(180deg,#5a3f12,#2B2119);box-shadow:0 0 0 2px var(--gold)}
.banner .w{font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,40px);color:var(--gold);line-height:1}
.pass{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.pass div{display:grid;gap:14px;justify-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--parch-ink);padding:10px 16px;border-radius:12px;font-weight:800;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:80;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="logo"><small>DUELO DE</small>Maravillas</div><p class="muted">Preparando la mesa…</p></div></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const M = window.Motor;
const { CARDS, WONDERS, TOKENS, SCI, SCI_N } = M;
const RI = { W: "🪵", C: "🧱", S: "🪨", G: "🧪", P: "📜" };
const RN = { W: "madera", C: "arcilla", S: "piedra", G: "vidrio", P: "papiro" };
const COLN = { brown: "Materia prima", grey: "Manufactura", blue: "Edificio civil", green: "Edificio científico", red: "Edificio militar", yellow: "Edificio comercial", purple: "Gremio" };
const COLP = { brown: "marrones", grey: "grises", blue: "azules", green: "verdes", red: "rojas", yellow: "amarillas", purple: "moradas", wonder: "maravillas", coins: "monedas" };
const COLS = ["brown", "grey", "blue", "green", "red", "yellow", "purple"];
const ROMAN = ["", "I", "II", "III"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const $app = document.getElementById("app"), $sheet = document.getElementById("sheet");
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }
function on(sel, ev, fn, root) { (root || $app).querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }

/* ================= estado ================= */
const S = {
  db: null, uid: null, ready: false, offline: false,
  name: (localStorage.getItem("sala.nick") || "").slice(0, 16),
  code: null, g: null, unsub: null, sel: null, homeMsg: "", homeErr: false, busy: false,
  lastKey: ""
};
const me = () => S.uid;
if (window.FIREBASE_EMULATORS) window.__S = S;

async function boot() {
  try {
    const [db, user] = await Promise.all(["db", "user"].map(n => window.claude ? claude.use(n).catch(() => null) : null));
    S.db = db; if (user) S.uid = await user.id();
  } catch {}
  if (!S.db || !S.uid) S.offline = true;
  S.ready = true;
  const h = (location.hash || "").replace("#", "").toUpperCase(), last = ls.get("duelo.last");
  if (!S.offline && /^[A-Z]{4}$/.test(h)) S.prefill = h;
  else if (!S.offline && last && last.code && Date.now() - last.t < 12 * 3600e3) S.rejoin = last.code;
  render();
}

/* ================= partida ================= */
function watch(code) {
  unwatch(); S.code = code; ls.set("duelo.last", { code, t: Date.now() });
  S.unsub = S.db.doc("games/" + code).onSnapshot(snap => {
    if (!snap.exists) { leave("Esa partida ya no existe."); return; }
    const prev = S.g; S.g = snap.data(); onGame(prev); render();
  }, () => leave("Se ha perdido la conexión con la partida."));
}
function unwatch() { if (S.unsub) try { S.unsub(); } catch {} S.unsub = null; S.g = null; S.sel = null; closeSheet(); }
function leave(msg) { unwatch(); S.code = null; S.homeMsg = msg || ""; S.homeErr = !!msg; history.replaceState(null, "", location.pathname); render(); }
function saveName() {
  const el = document.getElementById("nm"), v = ((el && el.value) || S.name || "").trim().slice(0, 16);
  if (!v) { S.homeMsg = "Escribe tu nombre."; S.homeErr = true; render(); return false; }
  S.name = v; try { localStorage.setItem("sala.nick", v); } catch {} return true;
}
const genCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };
async function freeCode() { let code; for (let i = 0; i < 6; i++) { code = genCode(); if (!(await S.db.doc("games/" + code).get()).exists) break; } return code; }
async function createGame(local) {
  if (!saveName()) return;
  let rival = "";
  if (local) { rival = (document.getElementById("rv").value || "").trim().slice(0, 16); if (!rival) { S.homeMsg = "Escribe el nombre del rival."; S.homeErr = true; render(); return; } }
  S.busy = true; render();
  try {

    const seats = { 0: { id: me(), name: S.name } };
    const doc = { v: 1, status: "lobby", host: me(), createdAt: Date.now(), seq: 0, local: !!local, seats, s: null };
    if (local) { seats[1] = { id: me(), name: rival }; doc.status = "play"; doc.s = M.newGame(Math.random() < .5 ? 0 : 1); }

  } catch { S.homeMsg = "No se pudo crear la partida. Revisa la conexión."; S.homeErr = true; }

}
async function joinGame(code) {
  if (!saveName()) return;
  code = String(code || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { S.homeMsg = "El código tiene 4 letras."; S.homeErr = true; render(); return; }
  S.busy = true; render();
  try {
    const snap = await S.db.doc("games/" + code).get();
    if (!snap.exists) { S.homeMsg = "No hay ninguna partida con ese código."; S.homeErr = true; }
    else {
      const g = snap.data(), seats = g.seats || {};
      const mine = [0, 1].find(i => seats[i] && seats[i].id === me());
      if (mine !== undefined && !g.local) { if (seats[mine].name !== S.name) await S.db.doc("games/" + code).update({ seats: { [mine]: { id: me(), name: S.name } } }); }
      else if (!seats[1] && g.status === "lobby") await S.db.doc("games/" + code).update({ seats: { 1: { id: me(), name: S.name } } });
      else if (mine === undefined) toast("La partida está completa: entras como público.");
      location.hash = code; watch(code);
    }
  } catch { S.homeMsg = "No se pudo entrar. Revisa la conexión."; S.homeErr = true; }
  S.busy = false; render();
}
async function put(patch) {
  const g = { ...S.g, ...patch, seq: (S.g.seq || 0) + 1 };
  S.g = g; render();
  try { await S.db.doc("games/" + S.code).set(g); }
  catch { toast("No se pudo guardar. Reintentando…"); setTimeout(() => S.db.doc("games/" + S.code).set(S.g).catch(() => toast("Sin conexión con la partida.")), 1500); }
}
async function startGame() {
  if (!S.g.seats[1]) return;

}

/* índice desde el que miro la mesa y con el que actúo */
function myIdx() {

  const i = seatOf(me()); return i === undefined ? null : i;
}

async function play(a) {
  const s = G(), pi = myIdx();
  let ns;
  try { ns = M.act(s, pi, a); } catch (e) { toast(e.rule ? e.message : "No se puede hacer eso."); return; }

}

function onGame(prev) {
  const s = G(); if (!s) return;
  if (S.g.local) S.view = M.actor(s) ?? S.view;
  const ps = prev && prev.s;
  if (ps && !S.g.local && JSON.stringify(ps.log) !== JSON.stringify(s.log)) {
    /* aviso de lo que acaba de hacer el rival */
    const lastOld = JSON.stringify(ps.log[ps.log.length - 1]);
    let j = -1; for (let x = s.log.length - 1; x >= 0; x--) if (JSON.stringify(s.log[x]) === lastOld) { j = x; break; }
    const other = s.log.slice(j + 1).filter(e => e.p !== null && e.p !== myIdx());
    if (other.length) toast(other.slice(-2).map(e => `${nameOf(e.p)} ${e.m}`).join(" · "));
  }
  if (!S.g.local && ps && M.actor(ps) !== myIdx() && isMyTurn() && navigator.vibrate) try { navigator.vibrate(40); } catch {}
  if (S.sel && S.sel.kind === "slot" && (!s.slots[S.sel.i] || s.slots[S.sel.i].gone)) { S.sel = null; closeSheet(); }
}

function militaryTrack() {

    const acc = M.accessible(s, i);
    let pr = "";
    if (acc && pi !== null && s.phase === "age") {
      const q = M.cardPrice(s, pi, t.c);
      pr = q.chain ? `<span class="pr free">🔗</span>` : !q.total ? `<span class="pr free">0</span>` : `<span class="pr${q.ok ? "" : " no"}">${q.total}🪙</span>`;
    }
    const isNew = S.prevUp && !prevUp[i] ? " new" : "";
    return `<button class="cd ${c.col}${acc ? " acc" : " off"}${mine ? " me" : ""}${isNew}" style="${style};--cc:var(--${c.col})" data-slot="${i}" aria-label="${esc(c.n)}${acc ? ", libre" : ""}">
      <span class="nm">${esc(c.n)}</span><span class="fx">${fxShort(c)}</span><span class="co">${costHTML(c.cost, true)}${c.free ? "🔗" : ""}</span>${pr}</button>`;
  }).join("");
  S.prevUp = {}; s.slots.forEach((t, i) => { if (t.up) S.prevUp[i] = 1; });
  return `<div class="pyr-wrap"><div class="pyr" style="width:${W}px;height:${H}px">${cards}</div></div>`;
}
const PEND = { sci: "elegir una ficha de progreso", lib: "elegir una ficha de la Gran Biblioteca", destroy: "elegir qué carta destruir", mau: "rescatar una carta del descarte", start: "decidir quién empieza la siguiente era" };
function turnBar() {
  const s = G(), a = M.actor(s), mineT = isMyTurn(), pen = s.pending[0];
  let t;
  if (s.phase === "draft") t = mineT ? "Te toca elegir una maravilla" : `${nameOf(a)} está eligiendo maravilla…`;
  else if (pen) t = mineT ? `Te toca ${PEND[pen.t]}` : `${nameOf(a)} tiene que ${PEND[pen.t]}…`;
  else t = mineT ? (S.g.local ? `Turno de ${nameOf(a)}: toca una carta libre` : "Tu turno: toca una carta libre") : `Turno de ${nameOf(a)}…`;
  const last = s.log.length ? s.log[s.log.length - 1] : null;
  const lastT = last ? `${last.p === null ? "" : nameOf(last.p) + " "}${last.m}` : "";
  return `<div class="bar${mineT ? " mine" : ""}"><div class="t">${esc(t)}${lastT ? `<span class="last">${esc(lastT)}</span>` : ""}</div>
    <button class="btn ghost sm" id="logb" aria-label="Historial">📜</button>${pen && mineT ? `<button class="btn gold sm" id="penb">Elegir</button>` : ""}</div>`;
}
function draftView() {
  const s = G(), mineT = isMyTurn(), d = s.draft;
  const set = d.step < 4 ? 1 : 2;
  const html = d.pool.map(w => { const W = WONDERS[w]; return `<div class="dw"><span class="e">${W.e}</span><h3>${esc(W.n)}</h3><span class="small" style="font-weight:800">${costHTML(W.cost)}</span><ul>${wonderFx(W).map(x => `<li>${x}</li>`).join("")}</ul>${mineT ? `<button class="btn gold sm" data-draft="${w}">Elegir</button>` : ""}</div>`; }).join("");
  return `<p class="lbl2">Elección de maravillas · tanda ${set} de 2</p><div class="draft">${html}</div>`;
}
function endView() {
  const s = G(), w = s.winner, a = M.score(s, 0), b = M.score(s, 1), v = viewIdx();
  const how = { military: "Supremacía militar: el ejército ha llegado a la capital rival.", science: "Supremacía científica: 6 símbolos científicos distintos.", civil: "Victoria civil: más puntos al final de la Era III." }[w.how];
  const title = w.who === -1 ? "¡Empate!" : S.g.local || myIdx() === null ? `¡Gana ${nameOf(w.who)}!` : w.who === myIdx() ? "¡Has ganado!" : `Gana ${nameOf(w.who)}`;
  const rows = [["🟦 Civiles", "blue"], ["🟩 Ciencia", "green"], ["🟨 Comercio", "yellow"], ["🟪 Gremios", "purple"], ["🏛️ Maravillas", "wonders"], ["🟢 Fichas", "tokens"], ["🪙 Monedas", "coins"], ["🛡️ Militar", "military"]];
  const o = v === 0 ? [0, 1] : [1, 0], sc = [a, b];
  const tbl = `<table class="sc"><thead><tr><th></th><th>${esc(nameOf(o[0]))}</th><th>${esc(nameOf(o[1]))}</th></tr></thead><tbody>${rows.map(([n, k]) => `<tr><td>${n}</td><td>${sc[o[0]][k]}</td><td>${sc[o[1]][k]}</td></tr>`).join("")}<tr class="tot"><td>Total</td><td>${sc[o[0]].total}</td><td>${sc[o[1]].total}</td></tr></tbody></table>`;
  return `<div class="banner"><div class="w">${esc(title)}</div><p>${esc(w.who === -1 ? "Mismos puntos y mismos edificios civiles." : how)}</p></div>
    <div class="card">${tbl}${w.how === "civil" && w.who !== -1 && a.total === b.total ? `<p class="muted small">Empate a puntos: gana quien tiene más puntos en edificios civiles.</p>` : ""}</div>
    <div class="row">${myIdx() !== null ? `<button class="btn gold" id="again">Revancha</button>` : ""}<button class="btn ghost" id="home">Salir</button></div>`;
}
function renderGame() {
  const s = G(), v = viewIdx(), o = 1 - v, mineSeat = myIdx() !== null;
  if (S.g.local && s.phase !== "end") {
    const a = M.actor(s);
    if (S.ackActor === undefined) S.ackActor = a;
    if (a !== S.ackActor) {
      closeSheet();
      view(`<div class="pass"><div><div class="logo" style="font-size:30px"><small>TURNO DE</small>${esc(nameOf(a))}</div><p class="muted">Pásale el móvil.</p><button class="btn gold" id="ready">Soy ${esc(nameOf(a))}</button></div></div>`, "pass|" + a + "|" + S.g.seq);
      on("#ready", "click", () => { S.ackActor = a; S.lastKey = ""; render(); });
      return;
    }
  }
  const key = JSON.stringify([S.g.seq, v, s.log.length, window.innerWidth > 0 ? Math.min(560, window.innerWidth) : 0]);
  let mid;
  if (s.phase === "draft") mid = draftView();
  else if (s.phase === "end") mid = endView();
  else mid = militaryTrack() + tokensRow() + pyramid();
  const html = `
  <div class="top"><button class="btn ghost sm" id="out">Salir</button>${s.phase === "age" || s.phase === "end" && s.age ? `<span class="chip">ERA ${ROMAN[s.age]}</span>` : `<span class="chip">MARAVILLAS</span>`}<span class="sp"></span><span class="chip">${esc(S.code)}</span></div>
  ${playerStrip(o, false)}${wondersRow(o, false)}
  ${mid}
  ${s.phase !== "end" ? turnBar() : ""}
  ${playerStrip(v, mineSeat)}${wondersRow(v, mineSeat)}`;
  const changed = view(html, "game|" + key);
  if (!changed) return;
  on("#out", "click", () => leave(""));
  on("[data-slot]", "click", e => openSheet({ kind: "slot", i: +e.currentTarget.dataset.slot }));
  on("[data-city]", "click", e => openSheet({ kind: "city", who: +e.currentTarget.dataset.city }));
  on("[data-won]", "click", e => openSheet({ kind: "won", id: e.currentTarget.dataset.won, of: +e.currentTarget.dataset.of }));
  on("[data-tok]", "click", e => openSheet({ kind: "tok", id: e.currentTarget.dataset.tok }));
  on("[data-draft]", "click", e => play({ t: "draft", w: e.currentTarget.dataset.draft }));
  on("#logb", "click", () => openSheet({ kind: "log" }));
  on("#penb", "click", () => openSheet({ kind: "pend" }));
  on("#again", "click", rematch);
  on("#home", "click", () => leave(""));
  /* elecciones pendientes: se abren solas */
  if (s.pending.length && isMyTurn() && (!S.sel || S.sel.kind !== "pend")) openSheet({ kind: "pend" });
  else if (S.sel) openSheet(S.sel);
  else closeSheet();
}

/* ---------- hoja inferior ---------- */
function closeSheet() { S.sel = null; $sheet.innerHTML = ""; }
function openSheet(sel) {
  S.sel = sel;
  const s = G(); if (!s) return;
  const html = sheetHTML(sel);
  if (!html) { closeSheet(); return; }
  const blocking = sel.kind === "pend";
  $sheet.innerHTML = `<div class="scrim"${blocking ? "" : ' data-close="1"'}><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const root = $sheet;
  on("[data-close]", "click", e => { if (e.target === e.currentTarget) closeSheet(); }, root);
  on(".x", "click", closeSheet, root);
  on("[data-act]", "click", e => { const b = e.currentTarget.dataset; play(JSON.parse(b.act)); }, root);
}
const xBtn = `<button class="btn ghost sm x" aria-label="Cerrar">✕</button>`;
function bigCard(c) {
  return `<div class="big ${c.col}" style="--cc:var(--${c.col})"><span class="ty">${COLN[c.col]} · Era ${ROMAN[c.age]}</span><span class="ttl">${esc(c.n)}</span>
    <div class="body">${fxLong(c).map(x => `<p>${x}</p>`).join("")}<p class="costline">Coste: ${costHTML(c.cost)}</p></div></div>`;
}
function sheetHTML(sel) {
  const s = G(), pi = myIdx(), mineT = isMyTurn() && s.phase === "age" && !s.pending.length;
  if (sel.kind === "slot") {
    const t = s.slots[sel.i]; if (!t || t.gone || !t.up) return "";
    const c = CARDS[t.c], acc = M.accessible(s, sel.i);
    let body = bigCard(c);
    if (!acc) body += `<p class="muted small">Esta carta todavía tiene otra encima: no se puede coger.</p>`;
    else if (pi !== null && s.phase === "age") {
      const q = M.cardPrice(s, pi, t.c);
      body += quoteHTML(q, pi);
      if (mineT) {
        const left = M.wondersLeft(s), ws = s.P[pi].wonders.filter(w => !w.built && !w.lost);
        body += `<div class="acts"><button class="btn gold" data-act='${JSON.stringify({ t: "build", slot: sel.i })}'${q.ok ? "" : " disabled"}>Construir${q.total ? ` · ${q.total} 🪙` : ""}</button>
          <button class="btn" data-act='${JSON.stringify({ t: "discard", slot: sel.i })}'>Descartar · +${M.discardGain(s, pi)} 🪙</button></div>`;
        if (ws.length && left > 0) body += `<p class="lbl2" style="text-align:left">O úsala para construir una maravilla</p><div class="wpick">${ws.map(w => { const W = WONDERS[w.id], wq = M.wonderPrice(s, pi, w.id); return `<button class="wbtn" data-act='${JSON.stringify({ t: "wonder", slot: sel.i, w: w.id })}'${wq.ok ? "" : " disabled"}><span class="e">${W.e}</span><b>${esc(W.n)}</b><span>${wq.total ? `${wq.total} 🪙` : "Gratis"}${wq.ok ? "" : " · no te llega"}</span></button>`; }).join("")}</div>`;
        else if (left <= 0) body += `<p class="muted small">Ya se han construido las 7 maravillas.</p>`;
      } else body += `<p class="muted small">${s.phase === "age" ? "Espera a tu turno para cogerla." : ""}</p>`;
    }
    return `<div class="sh-h"><h3>Carta</h3>${xBtn}</div>${body}`;
  }
  if (sel.kind === "won") {
    const W = WONDERS[sel.id], P = s.P[sel.of], w = P.wonders.find(x => x.id === sel.id) || {};
    let extra = "";
    if (w.built) extra = `<p class="muted small">Construida en la Era ${ROMAN[w.age] || ""}.</p>`;
    else if (w.lost) extra = `<p class="muted small">Ya se construyeron 7 maravillas: esta se queda sin hacer.</p>`;
    else if (sel.of === pi && s.phase === "age") extra = quoteHTML(M.wonderPrice(s, pi, sel.id), pi) + `<p class="muted small">Para construirla, toca una carta libre de la pirámide y elige esta maravilla.</p>`;
    return `<div class="sh-h"><h3>Maravilla</h3>${xBtn}</div><div class="big" style="--cc:#6B4C1E"><span class="ty">Maravilla de ${esc(nameOf(sel.of))}</span><span class="ttl">${W.e} ${esc(W.n)}</span>
      <div class="body">${wonderFx(W).map(x => `<p>${x}</p>`).join("")}<p class="costline">Coste: ${costHTML(W.cost)}</p></div></div>${extra}`;
  }
  if (sel.kind === "tok") {
    const T = TOKENS[sel.id];
    return `<div class="sh-h"><h3>${T.e} ${esc(T.n)}</h3>${xBtn}</div><div class="quote">${esc(T.d)}</div><p class="muted small">Las fichas de progreso se consiguen al juntar dos símbolos científicos iguales.</p>`;
  }
  if (sel.kind === "log") {
    const items = s.log.slice().reverse().map(e => `<div class="li"><div class="t"><b>${e.p === null ? "Partida" : esc(nameOf(e.p))}</b><span>${esc(e.m)}</span></div></div>`).join("");
    return `<div class="sh-h"><h3>Historial</h3>${xBtn}</div><div class="list">${items || `<p class="muted">Aún no ha pasado nada.</p>`}</div>
      ${s.discard.length ? `<div class="grp"><h4>Descarte (${s.discard.length})</h4><div class="chips">${s.discard.map(id => `<span class="${CARDS[id].col === "yellow" ? "y" : ""}" style="--cc:var(--${CARDS[id].col})">${esc(CARDS[id].n)}</span>`).join("")}</div></div>` : ""}`;
  }
  if (sel.kind === "city") {
    const P = s.P[sel.who], sc = M.score(s, sel.who), sci = M.sciSymbols(P);
    const groups = COLS.map(col => { const cs = P.cards.filter(id => CARDS[id].col === col); return cs.length ? `<div class="grp"><h4>${COLN[col]} (${cs.length})</h4><div class="list">${cs.map(id => { const c = CARDS[id]; return `<div class="li"><span class="sw" style="--cc:var(--${col})"></span><div class="t"><b>${esc(c.n)}</b><span>${fxLong(c).filter(x => !x.startsWith("🔗")).join(" ").replace(/<[^>]+>/g, "")}</span></div></div>`; }).join("")}</div></div>` : ""; }).join("");
    const wons = P.wonders.filter(w => w.built).map(w => `${WONDERS[w.id].e} ${esc(WONDERS[w.id].n)}`).join(" · ");
    const pts = `🟦${sc.blue} 🟩${sc.green} 🟨${sc.yellow} 🟪${sc.purple} 🏛️${sc.wonders} 🟢${sc.tokens} 🪙${sc.coins} 🛡️${sc.military}`;
    return `<div class="sh-h"><h3>Ciudad de ${esc(nameOf(sel.who))}</h3>${xBtn}</div>
      <div class="quote"><b>★ ${sc.total} puntos ahora mismo</b><span class="small muted">${pts}</span></div>
      ${Object.keys(sci).length ? `<div class="grp"><h4>Ciencia (${Object.keys(sci).length} de 6 para ganar)</h4><div class="chips">${Object.entries(sci).map(([k, n]) => `<span style="--cc:var(--panel2)">${SCI[k]} ${SCI_N[k]}${n > 1 ? " ×2" : ""}</span>`).join("")}</div></div>` : ""}
      ${P.tokens.length ? `<div class="grp"><h4>Fichas de progreso</h4><div class="list">${P.tokens.map(t => `<div class="li"><span class="tok sm">${TOKENS[t].e}</span><div class="t"><b>${esc(TOKENS[t].n)}</b><span>${esc(TOKENS[t].d)}</span></div></div>`).join("")}</div></div>` : ""}
      ${wons ? `<div class="grp"><h4>Maravillas construidas</h4><p>${wons}</p></div>` : ""}
      ${groups || `<p class="muted">Todavía no hay edificios.</p>`}`;
  }
  if (sel.kind === "pend") {
    const pen = s.pending[0]; if (!pen || !isMyTurn()) return "";
    const o = s.P[1 - pen.who];
    const tokList = ids => `<div class="list">${ids.map(t => `<div class="li"><span class="tok">${TOKENS[t].e}</span><div class="t"><b>${esc(TOKENS[t].n)}</b><span>${esc(TOKENS[t].d)}</span></div><button class="btn gold sm" data-act='${JSON.stringify({ t: pen.t, id: t })}'>Elegir</button></div>`).join("")}</div>`;
    const cardList = (ids, t, label) => `<div class="list">${ids.map(id => { const c = CARDS[id]; return `<div class="li"><span class="sw" style="--cc:var(--${c.col})"></span><div class="t"><b>${esc(c.n)}</b><span>${fxLong(c).filter(x => !x.startsWith("🔗")).join(" ").replace(/<[^>]+>/g, "")}</span></div><button class="btn gold sm" data-act='${JSON.stringify({ t, card: id })}'>${label}</button></div>`; }).join("")}</div>`;
    if (pen.t === "sci") return `<h3>¡Pareja de símbolos!</h3><p class="muted">Elige una ficha de progreso.</p>${tokList(s.tokens)}`;
    if (pen.t === "lib") return `<h3>📚 Gran Biblioteca</h3><p class="muted">Elige una de estas fichas que no estaban en juego.</p>${tokList(pen.opts)}`;
    if (pen.t === "destroy") return `<h3>Destruye una carta ${pen.col === "grey" ? "gris" : "marrón"}</h3><p class="muted">Va al descarte y ${esc(nameOf(1 - pen.who))} deja de producir ese recurso.</p>${cardList(o.cards.filter(id => CARDS[id].col === pen.col), "destroy", "Destruir")}`;
    if (pen.t === "mau") { const ids = [...new Set(s.discard)]; return `<h3>⚱️ Mausoleo</h3><p class="muted">Elige una carta del descarte y constrúyela gratis.</p>${cardList(ids, "mau", "Construir")}`; }
    if (pen.t === "start") {
      const next = ROMAN[s.age + 1], why = s.pawn === 0 ? "El frente está igualado y fuiste quien cogió la última carta." : "Vas por detrás en lo militar.";
      return `<h3>¿Quién empieza la Era ${next}?</h3><p class="muted">${why} Tú decides.</p>
        <div class="acts"><button class="btn gold" data-act='${JSON.stringify({ t: "start", who: pen.who })}'>Empiezo ${S.g.local ? esc(nameOf(pen.who)) : "yo"}</button><button class="btn" data-act='${JSON.stringify({ t: "start", who: 1 - pen.who })}'>Que empiece ${esc(nameOf(1 - pen.who))}</button></div>`;
    }
  }
  return "";
}

window.addEventListener("resize", () => { if (S.g && G()) { S.lastKey = ""; render(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.g) { S.lastKey = ""; render(); } });
boot();
})();
