<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Pueblo Duerme</title>
<meta name="theme-color" content="#0B1024">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,900&display=swap">
<script>window.APP_KEY="pueblo"</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../shared/claude-shim.js"></script>
<style>
/* Layout: una columna — cielo arriba (luna o sol, narrador, temporizador), acción del rol en el centro, aldea y tu carta abajo */
:root{
  --bg:#0B1024; --bg-2:#121A36; --panel:#18224A; --panel-2:#22306A; --line:#2E3D7A;
  --ink:#EEF1FF; --muted:#A4AED6; --accent:#F4C95D; --accent-ink:#2A1E00; --blood:#E5484D; --ok:#5EE3A1; --love:#FF7AB6;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sky:radial-gradient(120% 70% at 50% -10%,#24306B,#0B1024 70%);
  color-scheme:dark;
}
body.day{
  --bg:#F6EBDD; --bg-2:#EFDFCB; --panel:#FFF8EE; --panel-2:#F3E3CC; --line:#DCC5A6;
  --ink:#2B2118; --muted:#7A6652; --accent:#B5541C; --accent-ink:#FFFFFF; --blood:#C42E33; --ok:#2E8A57; --love:#C93D80;
  --sky:radial-gradient(120% 70% at 50% -10%,#FFD9A0,#F6EBDD 65%);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .6s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:14px 36px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}

.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 18px;background:var(--panel-2);color:var(--ink);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.red{background:var(--blood);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
input.text{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg-2);padding:0 14px;font-size:18px;font-weight:700}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:24px;text-align:center}
label.lbl{display:grid;gap:6px;font-size:12.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:14px 4px}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,60px);line-height:.95;letter-spacing:.02em;color:var(--accent);text-shadow:0 4px 18px rgba(0,0,0,.4)}
.logo small{display:block;font-size:.36em;letter-spacing:.32em;color:var(--ink);margin-bottom:4px}
.moon{width:120px;height:90px}
.card{background:var(--panel);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.card h2{font-size:19px}
.how{display:grid;gap:8px;font-size:15px}
.how b{color:var(--accent)}
summary{cursor:pointer;font-weight:900}
.msg{min-height:1.4em;color:var(--accent);text-align:center;font-weight:700}
.msg.err{color:var(--blood)}

.top{display:flex;align-items:center;gap:8px}
.chip{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;background:var(--panel);padding:6px 12px;border-radius:999px}
.top .sp{flex:1}
.big-code{font-family:var(--display);font-weight:900;font-size:54px;letter-spacing:.16em;line-height:1;text-align:center;color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:12px;padding:8px 10px;font-weight:700;min-width:0}
.plist li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.plist li .n small{display:block;font-weight:400;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.plist li.dead{opacity:.55}
.plist li.dead .n>span{text-decoration:line-through}
.av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:14px;color:#0B1024;background:var(--c,#fff)}
.tick{color:var(--ok);font-weight:900}
.cfg{display:grid;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:0;border-radius:10px;min-height:42px;min-width:46px;padding:0 12px;background:var(--bg-2);font-weight:900}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rtog{appearance:none;border:0;border-radius:12px;min-height:52px;padding:6px 10px;background:var(--bg-2);display:flex;gap:8px;align-items:center;text-align:left;font-weight:700}
.rtog[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--accent)}
.rtog .e{font-size:22px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;min-height:40px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.compo{display:flex;flex-wrap:wrap;gap:6px}
.compo span{background:var(--bg-2);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}

/* cielo */
.sky{display:grid;gap:6px;justify-items:center;text-align:center;padding:6px 0 2px}
.sky .orb{width:64px;height:64px}
.sky h1{font-size:26px}
.narr{font-size:17px;font-weight:700;max-width:40ch}
.timer{font-family:var(--display);font-weight:900;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}

/* carta de rol */
.rolecard{position:relative;border-radius:20px;min-height:150px;display:grid;place-items:center;text-align:center;padding:18px;background:repeating-linear-gradient(45deg,var(--panel) 0 12px,var(--bg-2) 12px 24px);box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 2px var(--line);user-select:none;-webkit-user-select:none;cursor:pointer}
.rolecard .e{font-size:54px;line-height:1}
.rolecard .rn{font-family:var(--display);font-weight:900;font-size:28px;margin-top:4px}
.rolecard .rd{color:var(--muted);margin-top:6px;max-width:36ch}
.rolecard .lbl2{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.rolecard.wolf{box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 3px var(--blood)}
.band{border-radius:12px;padding:8px 12px;font-weight:700;font-size:14.5px;background:var(--bg-2)}
.band.love{box-shadow:inset 3px 0 0 var(--love)}
.band.wolf{box-shadow:inset 3px 0 0 var(--blood)}

.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tbtn{appearance:none;border:0;border-radius:14px;min-height:58px;padding:8px 10px;background:var(--panel-2);font-weight:900;display:flex;align-items:center;gap:8px;text-align:left;position:relative}
.tbtn[aria-pressed="true"]{background:var(--blood);color:#fff}
.tbtn.love[aria-pressed="true"]{background:var(--love)}
.tbtn.safe[aria-pressed="true"]{background:var(--ok);color:#06210F}
.tbtn:disabled{opacity:.35}
.tbtn .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tbtn .marks{position:absolute;top:-6px;right:-4px;display:flex;gap:2px}
.tbtn .marks i{font-style:normal;font-size:11px;background:var(--blood);color:#fff;border-radius:999px;padding:1px 6px;font-weight:900;box-shadow:0 0 0 2px var(--panel)}
.result{display:flex;gap:12px;align-items:center;background:var(--bg-2);border-radius:14px;padding:12px}
.result .e{font-size:40px;line-height:1}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news li{display:flex;gap:10px;align-items:center;background:var(--bg-2);border-radius:14px;padding:10px 12px}
.news li .e{font-size:28px}
.news li b{display:block}
.tally{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tally li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--bg-2);border-radius:12px;padding:8px 12px}
.tally .who{font-size:12.5px;color:var(--muted)}
.win{text-align:center;display:grid;gap:8px;padding:6px 0}
.win .big{font-family:var(--display);font-weight:900;font-size:32px;line-height:1.1;color:var(--accent)}
.win .e{font-size:58px;line-height:1}
.menu{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:900;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}body{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="logo"><small>EL PUEBLO</small>DUERME</div><p class="muted">Cayendo la noche…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const ROLES = {
  wolf: { n: "Hombre lobo", e: "🐺", d: "Cada noche, con tu manada, elegís a quién devorar. De día, disimula y desvía las sospechas." },
  villager: { n: "Aldeano", e: "🧑‍🌾", d: "No tienes poderes. Tu arma es el olfato, la palabra y el voto." },
  seer: { n: "Vidente", e: "🔮", d: "Cada noche descubres el personaje de un jugador. Úsalo con cabeza: si te pillan, eres el siguiente." },
  witch: { n: "Bruja", e: "🧪", d: "Tienes una poción de vida para salvar a la víctima de los lobos y una de muerte para envenenar a alguien. Una vez cada una en toda la partida." },
  hunter: { n: "Cazador", e: "🏹", d: "Si mueres, de noche o de día, disparas tu última flecha y te llevas a alguien contigo." },
  cupid: { n: "Cupido", e: "💘", d: "La primera noche enamoras a dos jugadores. Si uno muere, el otro muere de pena." },
  guard: { n: "Protector", e: "🛡️", d: "Cada noche proteges a alguien de los lobos (también a ti). No puedes repetir con la misma persona dos noches seguidas." }
};
const SPECIALS = ["seer", "witch", "hunter", "cupid", "guard"];
const PCOL = ["#FF8A8A", "#7CC4FF", "#F4C95D", "#5EE3A1", "#C9A6FF", "#FFAB6B", "#7EE8E0", "#F7A8D8", "#B8E86B", "#FFFFFF", "#E8C07E", "#9AA8FF", "#FF9FB0", "#A0F0C0", "#D0B0FF", "#FFE08A"];
const MAX_PLAYERS = 18, MIN_PLAYERS = 4;
const MOON_SVG = `<svg class="moon" viewBox="0 0 120 90" aria-hidden="true"><circle cx="78" cy="30" r="22" fill="#F4C95D"/><circle cx="88" cy="24" r="20" fill="#0B1024"/><path d="M0 90V62l10-8 8 6 10-14 10 10 8-6 12 12 10-10 12 14 10-8 10 10 10-6 10 10v18z" fill="#18224A"/><rect x="22" y="58" width="12" height="14" fill="#F4C95D" opacity=".9"/><rect x="70" y="64" width="10" height="10" fill="#F4C95D" opacity=".7"/></svg>`;
const ORB = { night: `<svg class="orb" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="#F4C95D"/><circle cx="42" cy="26" r="19" fill="#0B1024"/></svg>`,
  day: `<svg class="orb" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="14" fill="#F2A33A"/><g stroke="#F2A33A" stroke-width="4" stroke-linecap="round">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => { const a = i * Math.PI / 4; return `<line x1="${32 + 20 * Math.cos(a)}" y1="${32 + 20 * Math.sin(a)}" x2="${32 + 27 * Math.cos(a)}" y2="${32 + 27 * Math.sin(a)}"/>`; }).join("")}</g></svg>` };

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const $app = document.getElementById("app");
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }

/* ================= estado local ================= */
const S = {
  db: null, uid: null, ready: false, offline: false,
  name: (localStorage.getItem("sala.nick") || "").slice(0, 16),
  code: null, g: null, players: [], acts: {}, sec: null, all: null, unsubs: [], secUnsubs: [], secKey: "",
  homeMsg: "", homeErr: false, busy: false, show: false, menu: false, lastHtml: "",
  sel: [], fake: null, voice: !!ls.get("pd.voice"), spoken: ""
};
const me = () => S.uid;
const isHost = () => S.g && S.g.host === S.uid;
const DEF_CFG = { wolves: 0, seer: true, witch: true, hunter: true, cupid: false, guard: false, reveal: true, talk: 180, night: 60 };

async function boot() {
  try {
    const [db, user] = await Promise.all(["db", "user"].map(n => window.claude ? claude.use(n).catch(() => null) : null));
    S.db = db; if (user) S.uid = await user.id();
  } catch {}
  if (!S.db || !S.uid) S.offline = true;
  S.ready = true;
  const h = (location.hash || "").replace("#", "").toUpperCase(), last = ls.get("pd.last");
  if (!S.offline && /^[A-Z]{4}$/.test(h)) S.prefill = h;
  else if (!S.offline && last && last.code && Date.now() - last.t < 12 * 3600e3) S.rejoin = last.code;
  render();
  setInterval(tick, 1000);
}

/* ================= sala online ================= */
const base = () => "games/" + S.code;
function watch(code) {
  unwatch(); S.code = code; ls.set("pd.last", { code, t: Date.now() });
  S.unsubs.push(S.db.doc(base()).onSnapshot(snap => {
    if (!snap.exists) { leave("Esa partida ya no existe."); return; }
    const d = snap.data();
    if (S.g && d.seq < S.g.seq && d.gid === S.g.gid) return;
    const prev = S.g; S.g = d; onGame(prev); render(); drive();
  }, () => leave("Se ha perdido la conexión con la partida.")));
  S.unsubs.push(S.db.collection(base() + "/players").orderBy("joinedAt").onSnapshot(q => {
    S.players = q.docs.map(d => ({ id: d.id, ...d.data() })); render(); drive();
  }, () => {}));
  S.unsubs.push(S.db.collection(base() + "/act").onSnapshot(q => {
    const a = {}; q.docs.forEach(d => { a[d.id] = d.data(); }); S.acts = a; render(); drive();
  }, () => {}));
}
function unwatch() { [...S.unsubs, ...S.secUnsubs].forEach(u => { try { u(); } catch {} }); S.unsubs = []; S.secUnsubs = []; S.secKey = ""; S.g = null; S.players = []; S.acts = {}; S.sec = null; S.all = null; }
function leave(msg) { unwatch(); S.code = null; S.homeMsg = msg || ""; S.homeErr = !!msg; history.replaceState(null, "", location.pathname); render(); }
const secPath = (uid, gid) => `${base()}/secret/${uid}_${gid}`;
const allPath = gid => `${base()}/secret/_all_${gid}`;
function onGame(prev) {
  const g = S.g;
  if (!prev || prev.gid !== g.gid || prev.phase !== g.phase) S.show = false;
  if (!prev || prev.k !== g.k) { S.sel = []; S.menu = false; S.fake = null; S.heal = false; }
  document.body.classList.toggle("day", isDay(g));
  watchSecrets(); narrate();
}
function watchSecrets() {
  const g = S.g; if (!g || !g.gid || g.status === "lobby") return;
  const seeAll = isHost() || (g.order && g.order.includes(me()) && !g.alive.includes(me()));
  const key = me() + "_" + g.gid + (seeAll ? "_a" : ""); if (key === S.secKey) return;
  S.secUnsubs.forEach(u => u()); S.secUnsubs = []; S.secKey = key; S.sec = null; S.all = null;
  S.secUnsubs.push(S.db.doc(secPath(me(), g.gid)).onSnapshot(s => { S.sec = s.exists ? s.data() : null; render(); }, () => {}));
  if (seeAll) S.secUnsubs.push(S.db.doc(allPath(g.gid)).onSnapshot(s => { if (s.exists) { S.all = s.data(); drive(); render(); } }, () => {}));
}
function saveName() {
  const el = document.getElementById("nm"); const v = ((el && el.value) || S.name || "").trim().slice(0, 16);
  if (!v) { S.homeMsg = "Escribe tu nombre para que te reconozcan."; S.homeErr = true; render(); return false; }
  S.name = v; try { localStorage.setItem("sala.nick", v); } catch {} return true;
}
const genCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };
async function createGame() {
  if (!saveName()) return;
  S.busy = true; render();
  try {
    let code;
    for (let i = 0; i < 6; i++) { code = genCode(); if (!(await S.db.doc("games/" + code).get()).exists) break; }
    await S.db.doc("games/" + code).set({ v: 1, status: "lobby", host: me(), createdAt: Date.now(), seq: 0, cfg: { ...DEF_CFG, ...(ls.get("pd.cfg") || {}) } });
    S.code = code; await joinSeat(code);
    location.hash = code; watch(code);
  } catch { S.homeMsg = "No se pudo crear la partida. Revisa la conexión."; S.homeErr = true; }
  S.busy = false; render();
}
async function joinSeat(code) {
  const ref = S.db.doc(`games/${code}/players/${me()}`);
  const cur = await ref.get();
  if (cur.exists) { await ref.update({ name: S.name }); return true; }
  const all = await S.db.collection(`games/${code}/players`).get();
  if (all.docs.length >= MAX_PLAYERS) { toast("El pueblo está lleno: entras como público."); return false; }
  await ref.set({ name: S.name, joinedAt: Date.now() });
  return true;
}
async function joinGame(code) {
  if (!saveName()) return;
  code = String(code || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { S.homeMsg = "El código tiene 4 letras."; S.homeErr = true; render(); return; }
  S.busy = true; render();
  try {
    const snap = await S.db.doc("games/" + code).get();
    if (!snap.exists) { S.homeMsg = "No hay ninguna partida con ese código."; S.homeErr = true; }
    else {
      const g = snap.data(), mine = (await S.db.doc(`games/${code}/players/${me()}`).get()).exists;
      if (g.status === "lobby" || mine) await joinSeat(code);
      else toast("La partida ya ha empezado: entras como público.");
      location.hash = code; watch(code);
    }
  } catch { S.homeMsg = "No se pudo entrar. Revisa la conexión."; S.homeErr = true; }
  S.busy = false; render();
}

/* ================= helpers ================= */
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || "Alguien";

/* ================= anfitrión: reparto ================= */

  S.busy = true; render();
  const cfg = { ...DEF_CFG, ...g0.cfg }, compo = composition(cfg, ids.length), deal = shuffle(compo);
  const roles = {}; ids.forEach((u, i) => { roles[u] = deal[i]; });
  const wolves = ids.filter(u => roles[u] === "wolf");
  const gid = Date.now();
  try {
    await Promise.all(ids.map(u => S.db.doc(secPath(u, gid)).set({ role: roles[u], ...(roles[u] === "wolf" ? { pack: wolves } : {}), seen: {}, lover: null, lastGuard: null })));

    k: gid + "|rev", until: null, dead: {}, news: null, hunterQ: [], vote: null, win: null, reveal: null, log: [],
    narr: "Cada uno mira su carta en secreto. Que nadie vea tu pantalla."

}

/* ================= máquina de estados (solo el anfitrión) ================= */
const R = u => S.all.roles[u];
const aliveWith = (g, role) => g.alive.filter(u => R(u) === role);
const NIGHT_TEXT = {
  cupid: "Cupido despierta y elige a dos enamorados…",
  main: g => {
    const c = g.compo, parts = ["Los lobos despiertan y eligen a su víctima."];
    if (c.includes("seer")) parts.push("La vidente escudriña un alma.");
    if (c.includes("guard")) parts.push("El protector vela por alguien.");

function startNight(g) {

}
function beginStep(g) {

  const actor = step === "cupid" ? "cupid" : step === "witch" ? "witch" : "wolf";
  const alive = aliveWith(g, actor).length > 0;

  g.until = now + (alive ? g.cfg.night * 1000 : 5000 + Math.floor(Math.random() * 4000));
  g.fakeWait = !alive;
  if (step === "witch" && alive) aliveWith(g, "witch").forEach(u => patchSec(u, { witch: { n: g.night, victim: S.all.victim, heal: S.all.heal, poison: S.all.poison } }));
}
function nextStep(g) {
  g.si++;
  if (g.si < g.steps.length) return beginStep(g);
  dawn(g);
}
function kill(g, u, how, items, fx = true) {
  if (!g.alive.includes(u)) return;
  g.alive = g.alive.filter(x => x !== u);
  const role = R(u);
  g.dead = { ...(g.dead || {}), [u]: g.cfg.reveal ? role : "?" };
  items.push({ u, how, role: g.cfg.reveal ? role : null });
  if (!fx) return;
  if (role === "hunter") g.hunterQ = [...(g.hunterQ || []), u];
  const L = S.all.lovers;
  if (L && L.includes(u)) { const o = L[0] === u ? L[1] : L[0]; kill(g, o, "pena", items); }
}
function dawn(g) {
  const items = [], A = S.all;
  if (A.victim && !A.healed) kill(g, A.victim, "lobos", items);
  if (A.poisoned) kill(g, A.poisoned, "veneno", items);
  A.healed = false; A.poisoned = null; A.victim = null; saveAll();
  news(g, { night: false, title: `Amanece el día ${g.night}`, items, next: "day" });
  g.narr = items.length ? `Amanece en el pueblo… y ${items.length === 1 ? "falta una persona" : "faltan " + items.length + " personas"}.` : "Amanece en el pueblo… ¡y esta noche no ha muerto nadie!";
}
function news(g, n) { g.fakeWait = false; g.phase = "news"; g.news = n; g.k = `${g.gid}|news${g.seq}`; g.until = Date.now() + (n.items.length ? 12000 : 8000); }
function checkWin(g) {
  const alive = g.alive, wolves = alive.filter(u => R(u) === "wolf").length, L = S.all.lovers;
  if (L && alive.length === 2 && L.every(u => alive.includes(u)) && (R(L[0]) === "wolf") !== (R(L[1]) === "wolf")) return "lovers";
  if (!alive.length) return "none";

  if (wolves >= alive.length - wolves) return "wolves";

}
function endGame(g, win) {
  g.status = "end"; g.phase = "end"; g.win = win; g.until = null; g.k = g.gid + "|end";
  g.reveal = { roles: S.all.roles, lovers: S.all.lovers };
  g.narr = win === "village" ? "¡El pueblo ha acabado con los lobos!" : win === "wolves" ? "Los lobos se han hecho con el pueblo." : win === "lovers" ? "El amor lo puede todo: ganan los enamorados." : "No queda nadie en el pueblo.";
}
function afterNews(g) {
  if ((g.hunterQ || []).length) {
    const h = g.hunterQ[0]; g.hunterQ = g.hunterQ.slice(1);
    g.phase = "hunter"; g.hunter = h; g.k = `${g.gid}|hunt${g.seq}`; g.until = Date.now() + 45000;
    g.narr = `${nameOf(h)} era el cazador. Antes de caer, apunta con su última flecha…`;
    return;
  }
  const w = checkWin(g); if (w) return endGame(g, w);

}
function toDay(g) {
  g.phase = "day"; g.k = `${g.gid}|d${g.night}`; g.until = g.cfg.talk ? Date.now() + g.cfg.talk * 1000 : null; g.news = null;
  g.narr = "Debatid: ¿quién de vosotros es un lobo?";
  if (!g.cfg.talk) toVote(g, null);
}
function toVote(g, cands) {
  g.phase = "vote"; g.vote = { cands: cands || [...g.alive], round: cands ? 2 : 1 };
  g.k = `${g.gid}|v${g.night}-${g.vote.round}`; g.until = null;

}

function drive() {

    }

      const items = [];

      const next = g0.news ? g0.news.next : "night";

      if (top.length === 1) kill(g, top[0], "pueblo", items);

      g.narr = items.length ? `El pueblo ha decidido: ${nameOf(top[0])} es ejecutado.` : "El pueblo no se pone de acuerdo. Hoy no muere nadie.";
      return commit(g);

}
async function hostSkip() {
  if (!isHost()) return;
  const g = clone(S.g);
  if (g.phase === "day") toVote(g, null);
  else if (g.phase === "news") afterNews(g);
  else if (["night", "hunter"].includes(g.phase)) { g.until = Date.now() - 1; S.g = g; drive(); return; }
  else return;
  await commit(g);
}
async function hostKick(u) {
  if (!isHost() || !S.all) return;
  const g = clone(S.g);
  if (!g.alive.includes(u)) return;
  kill(g, u, "huye", [], false);
  const w = checkWin(g); if (w) endGame(g, w);
  await commit(g);
}
async function toLobby() {
  if (!isHost()) return;
  const g = clone(S.g);
  Object.assign(g, { status: "lobby", phase: null, k: null, until: null, news: null, vote: null, win: null, reveal: null, alive: [], order: [], dead: {}, narr: null });
  await commit(g);
}
async function takeOver() {
  if (!S.g || isHost()) return;
  try { await S.db.doc(base()).update({ host: me() }); toast("Ahora llevas tú la partida."); } catch { toast("No se pudo."); }
}

  if (!S.code) return renderHome();
  if (!S.g) return view(`<div class="hero"><div class="logo"><small>EL PUEBLO</small>DUERME</div><p class="muted">Llegando al pueblo…</p></div>`);
  if (S.g.status === "lobby") return renderLobby();

}

  $app.querySelectorAll("input[data-keep]").forEach(el => { keep[el.id] = el.value; });
  S.lastHtml = html; $app.innerHTML = html;
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });

}
const H = {};
function bind() {
  $app.querySelectorAll("[data-on]").forEach(el => {
    const [ev, fn, arg] = el.dataset.on.split(":");

}
function tick() {

    const left = Math.max(0, Math.ceil((+el.dataset.until - Date.now()) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  });
  if (g && g.until && isHost() && Date.now() >= g.until) drive();
}

  <div class="card"><h2>Todos los personajes</h2><ul class="plist">${g.order.map(u => { const ro = r.roles[u]; return `<li class="${g.alive.includes(u) ? "" : "dead"}">${av(u)}<span class="n"><span>${esc(nameOf(u))}${lovers.includes(u) ? " 💘" : ""}</span><small>${ro ? `${ROLES[ro].e} ${esc(ROLES[ro].n)}` : ""}</small></span></li>`; }).join("")}</ul></div>
  ${isHost() ? `<button class="btn gold wide" data-on="click:again">Otra partida</button>` : `<p class="muted center">${esc(nameOf(g.host))} puede empezar otra.</p>`}`);
}

window.__pd = { S, drive, ROLES, composition, checkWin, hostSkip };
boot();
})();
</script>
