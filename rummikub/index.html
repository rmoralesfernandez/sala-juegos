<style>
/* Layout: one-screen app — header strip, scrolling felt table, fixed tile rack at the bottom */
:root{
  --felt:#163b36; --felt-2:#1d4a43; --felt-line:#2c6158;
  --rack:#2a1d14; --rack-2:#3a2a1e;
  --bone:#f3ead8; --bone-edge:#d6c8ad;
  --ink:#f4efe4; --ink-dim:#a9c2bb;
  --red:#c2362b; --blue:#1d5aa6; --amber:#d6800a; --black:#1d1a17;
  --gold:#f0b43c; --bad:#ff6b5e; --ok:#7fd8a6; --mark:#7cc4ff;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tw:34px; --th:46px;
  color-scheme:dark;
}
@media (min-width:700px){ :root{ --tw:40px; --th:54px; } }
html,body{height:100%}
body{background:var(--felt);color:var(--ink);font-family:var(--body);font-size:15px;
  background-image:radial-gradient(ellipse at 50% 30%, var(--felt-2), var(--felt) 70%);}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- screens ---------- */
.screen{flex:1;overflow-y:auto;padding-block:24px;padding-inline:16px}
.home{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,48px);line-height:1;margin:0;letter-spacing:.5px}
.brand p{margin:0;color:var(--ink-dim);max-width:38ch;line-height:1.45}
.demo{display:flex;gap:4px;flex-wrap:wrap}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--felt-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-dim)}
input[type=text]{background:var(--felt);border:1px solid var(--felt-line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.row > *{flex:1 1 auto}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--felt-line);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#2a1d0a}
.btn.ghost{background:transparent;border:1px solid var(--felt-line)}
.btn.small{padding:7px 11px;font-size:13px}
.msg{min-height:1.3em;font-size:14px;color:var(--gold)}
.msg.err{color:var(--bad)}
.muted{color:var(--ink-dim);font-size:13px;line-height:1.45;margin:0}

/* lobby */
.bigcode{font-family:var(--display);font-size:44px;letter-spacing:.18em;line-height:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,0,0,.2);border-radius:8px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--felt-line);background:rgba(0,0,0,.2)}
.top .code{font-family:var(--display);letter-spacing:.15em;font-size:16px}
.seats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.seat{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.25);font-size:13px;border:1px solid transparent;white-space:nowrap}
.seat.turn{border-color:var(--gold);color:var(--gold)}
.seat b{font-variant-numeric:tabular-nums;font-weight:700;background:var(--bone);color:var(--black);border-radius:4px;padding:0 5px;font-size:12px}
.pool{font-size:12px;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

.table{flex:1;overflow-y:auto;padding-block:14px 18px;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;font-size:14px}
.banner strong{font-weight:700}
.banner .turnline{color:var(--gold);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.set{display:flex;align-items:center;gap:3px;padding:5px;border-radius:9px;border:1.5px dashed transparent;background:rgba(0,0,0,.12);min-height:calc(var(--th) + 10px)}
.set.changed{border-style:solid;border-color:rgba(124,196,255,.55);background:rgba(124,196,255,.10)}
.set.bad{border-style:dashed;border-color:var(--bad);background:rgba(255,107,94,.08)}
.set.target{cursor:pointer;border-color:rgba(240,180,60,.45)}
.set.target:hover,.set.hover,.newset.hover,.hand.hover{border-color:var(--gold);background:rgba(240,180,60,.12)}
.grip{width:14px;align-self:stretch;border:0;border-radius:5px;background:transparent;padding:0;display:grid;place-items:center;color:var(--ink-dim);touch-action:none}
.grip::before{content:"";width:4px;height:60%;border-left:2px dotted currentColor;border-right:2px dotted currentColor;opacity:.6}
.grip:disabled{cursor:default;opacity:.35}
.grip.on{color:var(--gold)}
.newset{align-self:stretch;border:1.5px dashed var(--felt-line);border-radius:9px;background:transparent;color:var(--ink-dim);padding:0 14px;min-height:calc(var(--th) + 10px);font-weight:600}
.newset.on{border-color:var(--gold);color:var(--gold)}
.newset:disabled{opacity:.45;cursor:default}
.lastmove{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mark)}
.lastmove i{width:12px;height:12px;border-radius:3px;background:rgba(124,196,255,.25);border:1.5px solid var(--mark);flex:0 0 auto}
.empty{color:var(--ink-dim);font-size:14px;padding:18px;border:1.5px dashed var(--felt-line);border-radius:12px;text-align:center}
.log{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink-dim);display:flex;flex-direction:column;gap:2px}

/* tiles */
.tile{width:var(--tw);height:var(--th);border-radius:6px;background:linear-gradient(180deg,#fbf5e8,var(--bone));border:0;
  box-shadow:0 2px 0 var(--bone-edge),0 3px 6px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);font-size:calc(var(--tw) * .58);line-height:1;padding:0;position:relative;transition:transform .1s, box-shadow .1s;flex:0 0 auto}
.tile::after{content:"";width:40%;height:3px;border-radius:2px;background:currentColor;opacity:.35;margin-top:4px}
.tile.c0{color:var(--red)} .tile.c1{color:var(--blue)} .tile.c2{color:var(--amber)} .tile.c3{color:var(--black)}
.tile.jk{color:var(--red)}
.tile.jk svg{width:72%;height:auto}
.tile.jk::after{display:none}
.tile.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 8px 12px rgba(0,0,0,.4)}
.tile.fresh{box-shadow:0 2px 0 var(--bone-edge),0 0 0 2px var(--ok)}
.tile.fresh.sel{box-shadow:0 0 0 3px var(--gold),0 8px 12px rgba(0,0,0,.4)}
.tile.rival{box-shadow:0 2px 0 var(--bone-edge),0 0 0 2.5px var(--mark),0 0 12px rgba(124,196,255,.55)}
.tile.rival::before{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--mark)}
.tile.rival.sel{box-shadow:0 0 0 3px var(--gold),0 8px 12px rgba(0,0,0,.4)}
.tile.locked{cursor:default}
.tile.pick{touch-action:none}
.tile.dragsrc{opacity:.3}
.slot{width:var(--tw);height:var(--th);border-radius:6px;border:1.5px dashed rgba(243,234,216,.22);flex:0 0 auto}
.ghost{position:fixed;left:0;top:0;z-index:10;pointer-events:none;display:flex;gap:3px;transform:translate(-50%,-60%) rotate(-3deg);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.dragging, .dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}

/* rack */
.rack{background:linear-gradient(180deg,var(--rack-2),var(--rack));border-top:3px solid #4b3626;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 20px rgba(0,0,0,.3)}
.rackhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#d9c7ae}
.rackhead .sp{flex:1}
.seg{display:flex;border:1px solid #5a4330;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#d9c7ae;padding:5px 9px;font-size:12px;font-weight:600}
.seg button[aria-pressed=true]{background:#5a4330;color:var(--bone)}
.hand{display:flex;flex-wrap:wrap;gap:5px;min-height:var(--th);padding-top:6px;max-height:calc(var(--th)*2 + 22px);overflow-y:auto}
.hand{border:1.5px dashed transparent;border-radius:8px;padding:6px 4px 4px}
.hand.target{border-color:rgba(240,180,60,.45);cursor:pointer}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions .btn{padding-inline:8px;font-size:14px}
@media (max-width:480px){ .actions{grid-template-columns:1fr 1fr} }
.status{font-size:13px;min-height:1.2em;color:var(--gold)}
.status.err{color:var(--bad)}

.overlay{position:fixed;inset:0;background:rgba(8,20,18,.82);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--felt);border:1px solid var(--felt-line);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.scores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.scores li{display:flex;justify-content:space-between}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app" id="app">
  <div class="screen"><div class="home"><div class="brand"><h1>Ficha a Ficha</h1><p>Conectando con la mesa…</p></div></div></div>
</div>

<script>
(() => {
"use strict";
/* ================= modelo de fichas ================= */
// 106 fichas: id 0..103 → 4 colores × 13 números × 2 copias; 104 y 105 = comodines
const COLOR_NAMES = ["rojo","azul","naranja","negro"];
const isJ = id => id >= 104;
const col = id => Math.floor(id / 26);
const num = id => (id % 26) % 13 + 1;
const tileVal = id => isJ(id) ? 30 : num(id);

function analyze(ids){
  const n = ids.length;
  if (n < 3) return { valid:false };
  const jk = ids.filter(isJ), nj = ids.filter(i => !isJ(i));
  if (!nj.length) return { valid:false };
  let best = null;
  // Grupo: mismo número, colores distintos, 3-4 fichas
  if (n <= 4) {
    const v = num(nj[0]);
    const cs = new Set(nj.map(col));
    if (nj.every(i => num(i) === v) && cs.size === nj.length) {
      best = { valid:true, type:"group", value:v*n, ordered:[...nj].sort((a,b)=>col(a)-col(b)).concat(jk) };
    }
  }
  // Escalera: mismo color, números consecutivos
  if (n <= 13) {
    const c = col(nj[0]), ns = nj.map(num);
    if (nj.every(i => col(i) === c) && new Set(ns).size === ns.length) {
      const mn = Math.min(...ns), mx = Math.max(...ns);
      if (mx - mn + 1 <= n) {
        let s = mn; if (s + n - 1 > 13) s = 14 - n;
        const by = {}; nj.forEach(i => by[num(i)] = i);
        const ord = []; let j = 0;
        for (let k = s; k < s + n; k++) ord.push(by[k] ?? jk[j++]);
        const val = n * (2*s + n - 1) / 2;
        if (!best || val > best.value) best = { valid:true, type:"run", value:val, ordered:ord };
      }
    }
  }
  return best || { valid:false };
}
const keyOf = s => [...s].sort((a,b)=>a-b).join(",");

function shuffled(){
  const a = Array.from({length:106}, (_, i) => i);
  const r = new Uint32Array(a.length); crypto.getRandomValues(r);
  for (let i = a.length - 1; i > 0; i--) { const j = r[i] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const handPoints = h => (h || []).reduce((s, i) => s + tileVal(i), 0);

/* ================= util ================= */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const JOKER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="8.5" cy="10" r="1.6" fill="currentColor"/><circle cx="15.5" cy="10" r="1.6" fill="currentColor"/><path d="M7 14.5c1.3 2.2 3 3.2 5 3.2s3.7-1 5-3.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function tileHTML(id, cls = "", attrs = ""){
  if (isJ(id)) return `<button class="tile jk ${cls}" data-t="${id}" aria-label="Comodín" ${attrs}>${JOKER_SVG}</button>`;
  return `<button class="tile c${col(id)} ${cls}" data-t="${id}" aria-label="${num(id)} ${COLOR_NAMES[col(id)]}" ${attrs}>${num(id)}</button>`;
}
function makeCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  return [...r].map(x => A[x % A.length]).join("");
}

/* ================= estado local ================= */
let DR = null; // arrastre en curso
const S = {
  db:null, uid:null, ready:false, noAccess:false,
  screen:"home", code:null, game:null, players:[],
  unsubGame:null, unsubPlayers:null,
  nick: ls.get("faf.nick") || "",
  homeMsg:"", homeErr:false,
  draft:null, sel:new Set(), sort: ls.get("faf.sort") || "color",
  status:"", statusErr:false, busy:false, confirmSkip:false
};

/* ================= arranque ================= */
async function boot(){
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    S.db = db;
    if (user) {
      S.uid = await user.id();
      if (!S.nick) { const nm = await user.name().catch(() => ""); if (nm) S.nick = nm.split(" ")[0]; }
    }
  } catch {}
  if (!S.db || !S.uid) S.noAccess = true;
  S.ready = true;
  const h = (location.hash || "").replace("#","").toUpperCase();
  if (/^[A-Z0-9]{4}$/.test(h) && !S.noAccess) { S.prefill = h; }
  render();
}
if (window.claude && claude.use) boot(); else { S.ready = true; S.noAccess = true; render(); }

/* ================= suscripciones ================= */
function watch(code){
  unwatch();
  S.code = code; ls.set("faf.last", code);
  S.unsubGame = S.db.doc("games/" + code).onSnapshot(snap => {
    if (!snap.exists) { S.game = null; leaveToHome("Esa partida ya no existe."); return; }
    const prev = S.game;
    S.game = snap.data();
    syncDraft(prev);
    S.screen = S.game.status === "lobby" ? "lobby" : "game";
    if (S.game.status === "lobby" && !S.unsubPlayers) watchPlayers(code);
    if (S.game.status !== "lobby" && S.unsubPlayers) { S.unsubPlayers(); S.unsubPlayers = null; }
    render();
  }, () => leaveToHome("Se perdió la conexión con la partida. Vuelve a entrar."));
}
function watchPlayers(code){
  S.unsubPlayers = S.db.collection("games/" + code + "/players").orderBy("joinedAt").onSnapshot(q => {
    S.players = q.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, () => {});
}
function unwatch(){
  if (S.unsubGame) S.unsubGame(); if (S.unsubPlayers) S.unsubPlayers();
  S.unsubGame = S.unsubPlayers = null; S.game = null; S.players = []; S.draft = null; S.sel.clear();
}
function leaveToHome(msg){
  unwatch(); S.code = null; S.screen = "home"; S.homeMsg = msg || ""; S.homeErr = !!msg; render();
}

/* ================= acciones de sala ================= */
async function createGame(){
  if (!saveNick()) return;
  S.busy = true; render();
  try {
    let code, ref;
    for (let i = 0; i < 6; i++) {
      code = makeCode(); ref = S.db.doc("games/" + code);
      if (!(await ref.get()).exists) break;
    }
    await ref.set({ status:"lobby", host:S.uid, createdAt:Date.now() });
    await S.db.doc(`games/${code}/players/${S.uid}`).set({ nick:S.nick, joinedAt:Date.now() });
    watch(code);
  } catch (e) { homeError(e); }
  S.busy = false; render();
}
async function joinGame(code){
  if (!saveNick()) return;
  code = (code || "").toUpperCase().trim();
  if (!/^[A-Z0-9]{4}$/.test(code)) { S.homeMsg = "El código tiene 4 caracteres."; S.homeErr = true; render(); return; }
  S.busy = true; render();
  try {
    const snap = await S.db.doc("games/" + code).get();
    if (!snap.exists) { S.homeMsg = "No hay ninguna partida con ese código."; S.homeErr = true; }
    else {
      const g = snap.data();
      if (g.status === "lobby") {
        await S.db.doc(`games/${code}/players/${S.uid}`).set({ nick:S.nick, joinedAt:Date.now() });
      }
      watch(code);
    }
  } catch (e) { homeError(e); }
  S.busy = false; render();
}
function homeError(e){
  S.homeErr = true;
  S.homeMsg = e && e.code === "invalid_argument"
    ? "No se pudo guardar. Revisa la conexión e inténtalo otra vez."
    : "No se pudo conectar. Inténtalo de nuevo.";
}
async function leaveLobby(){
  try { await S.db.doc(`games/${S.code}/players/${S.uid}`).delete(); } catch {}
  ls.del("faf.last"); leaveToHome("");
}
function saveNick(){
  const v = (document.getElementById("nick")?.value ?? S.nick).trim().slice(0, 16);
  if (!v) { S.homeMsg = "Escribe tu nombre para la mesa."; S.homeErr = true; render(); return false; }
  S.nick = v; ls.set("faf.nick", v); return true;
}
async function startGame(players){
  const ps = (players || S.players).slice(0, 4);
  if (ps.length < 2) return;
  const pool = shuffled();
  const hands = {}, names = {}, melded = {};
  ps.forEach(p => { hands[p.id] = pool.splice(0, 14); names[p.id] = p.nick || "Jugador"; melded[p.id] = false; });
  S.busy = true; render();
  try {
    await S.db.doc("games/" + S.code).set({
      status:"playing", host:S.game.host, createdAt:S.game.createdAt || Date.now(),
      order:ps.map(p => p.id), names, hands, melded, pool,
      table:[], turn:0, turnNo:1, passes:0, winner:null, last:null,
      log:[`Empieza ${names[ps[0].id]}`]
    });
  } catch (e) { setStatus("No se pudo empezar la partida.", true); }
  S.busy = false; render();
}

/* ================= turno ================= */
const me = () => S.uid;
const myTurn = () => S.game && S.game.status === "playing" && S.game.order[S.game.turn] === me();
const amPlayer = () => S.game && S.game.order && S.game.order.includes(me());

function syncDraft(prev){
  const g = S.game;
  if (!g || g.status !== "playing" || !amPlayer()) { S.draft = null; S.sel.clear(); return; }
  const fresh = !S.draft || S.draft.turnNo !== g.turnNo || !prev || prev.turnNo !== g.turnNo || !myTurn();
  if (fresh) resetDraft();
}
function resetDraft(){
  const g = S.game;
  const table = (g.table || []).map(s => [...s.t]);
  const hand = [...(g.hands[me()] || [])];
  S.draft = { turnNo:g.turnNo, table, hand, origTable:table.map(s => [...s]), origHand:new Set(hand) };
  S.sel.clear(); S.confirmSkip = false;
}
const dirty = () => S.draft && S.draft.hand.length !== S.draft.origHand.size;
const changed = () => S.draft && (dirty() || keyTable(S.draft.table) !== keyTable(S.draft.origTable));
const keyTable = t => t.filter(s => s.length).map(keyOf).sort().join("|");

function canPick(id){
  if (!myTurn() || !S.draft) return false;
  if (S.draft.hand.includes(id)) return true;
  if (S.draft.origHand.has(id)) return true;      // puesta este turno
  return !!S.game.melded[me()];                   // fichas de la mesa: solo tras la primera bajada
}
function toggle(id){
  if (!canPick(id)) {
    if (myTurn()) setStatus("Hasta tu primera bajada (30 puntos) no puedes mover fichas de la mesa.", true);
    return;
  }
  S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
  setStatus(""); render();
}
function moveSel(target){
  const d = S.draft; if (!d || !S.sel.size) return;
  const ids = [...S.sel];
  if (target === "hand" && ids.some(i => !d.origHand.has(i))) { setStatus("Solo puedes devolver a tu atril las fichas que has sacado este turno.", true); return; }
  for (const id of ids) {
    const hi = d.hand.indexOf(id); if (hi > -1) d.hand.splice(hi, 1);
    d.table.forEach(s => { const k = s.indexOf(id); if (k > -1) s.splice(k, 1); });
  }
  if (target === "hand") d.hand.push(...ids);
  else if (target === "new") d.table.push(ids);
  else d.table[target].push(...ids);
  d.table = d.table.filter(s => s.length);
  S.sel.clear(); setStatus(""); render();
}
function newMeldValue(){
  const d = S.draft, orig = new Map();
  d.origTable.forEach(s => { const k = keyOf(s); orig.set(k, (orig.get(k) || 0) + 1); });
  let sum = 0, touched = false, foreign = false;
  for (const s of d.table) {
    const k = keyOf(s);
    if (orig.get(k)) { orig.set(k, orig.get(k) - 1); continue; }
    if (s.some(i => !d.origHand.has(i))) foreign = true;
    const a = analyze(s); if (a.valid) sum += a.value;
  }
  for (const v of orig.values()) if (v > 0) touched = true;
  return { sum, touched: touched || foreign };
}
function validate(){
  const d = S.draft, g = S.game;
  if (!dirty()) return "Coloca al menos una ficha de tu atril, o roba.";
  if (d.table.some(s => !analyze(s).valid)) return "Hay jugadas no válidas en la mesa (marcadas en rojo).";
  if (!g.melded[me()]) {
    const { sum, touched } = newMeldValue();
    if (touched) return "En tu primera bajada no puedes tocar las jugadas que ya hay en la mesa.";
    if (sum < 30) return `Tu primera bajada debe sumar 30 puntos. Llevas ${sum}.`;
  }
  return null;
}
async function endTurn(){
  const err = validate(); if (err) { setStatus(err, true); return; }
  const g = S.game, d = S.draft, n = g.order.length;
  const played = d.origHand.size - d.hand.length;
  const table = d.table.map(s => ({ t: analyze(s).ordered }));
  const won = d.hand.length === 0;
  const name = g.names[me()];
  // Qué ha cambiado: fichas sacadas del atril y jugadas nuevas o modificadas
  const origKeys = new Map();
  d.origTable.forEach(s => { const k = keyOf(s); origKeys.set(k, (origKeys.get(k) || 0) + 1); });
  const changedKeys = [];
  d.table.forEach(s => { const k = keyOf(s); if (origKeys.get(k)) origKeys.set(k, origKeys.get(k) - 1); else changedKeys.push(k); });
  const placed = [...d.origHand].filter(i => !d.hand.includes(i));
  const patch = {
    last:{ by:me(), placed, changed:changedKeys, turnNo:g.turnNo },
    table, hands:{ [me()]: d.hand }, melded:{ [me()]: true }, passes:0,
    turn: won ? g.turn : (g.turn + 1) % n, turnNo: g.turnNo + 1,
    log: [...(g.log || []), won ? `${name} se queda sin fichas y gana` : `${name} coloca ${played} ficha${played > 1 ? "s" : ""}`].slice(-6)
  };
  if (won) { patch.status = "ended"; patch.winner = me(); }
  await write(patch);
}
async function drawTile(forUid){
  const g = S.game, uid = forUid || me(), n = g.order.length;
  const pool = [...(g.pool || [])];
  const hand = [...(g.hands[uid] || [])];
  const name = g.names[uid];
  const patch = { turn:(g.turn + 1) % n, turnNo:g.turnNo + 1 };
  if (pool.length) {
    hand.push(pool.pop());
    Object.assign(patch, { pool, hands:{ [uid]: hand }, passes:0, log:[...(g.log || []), forUid ? `${name} pierde el turno y roba` : `${name} roba`].slice(-6) });
  } else {
    const passes = (g.passes || 0) + 1;
    Object.assign(patch, { passes, log:[...(g.log || []), `${name} pasa`].slice(-6) });
    if (passes >= n) {
      let best = null;
      g.order.forEach(id => { const p = handPoints(id === uid ? hand : g.hands[id]); if (!best || p < best.p) best = { id, p }; });
      Object.assign(patch, { status:"ended", winner:best.id, log:[...(g.log || []), "Sin fichas en el pozo: gana quien menos puntos tiene"].slice(-6) });
    }
  }
  await write(patch);
}
async function write(patch){
  S.busy = true; render();
  try { await S.db.doc("games/" + S.code).update(patch); setStatus(""); }
  catch (e) {
    if (e && e.code === "unavailable") {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      try { await S.db.doc("games/" + S.code).update(patch); } catch { setStatus("No se pudo guardar la jugada. Inténtalo otra vez.", true); }
    } else setStatus("No se pudo guardar la jugada. Inténtalo otra vez.", true);
  }
  S.busy = false; render();
}
async function rematch(){
  const g = S.game;
  await startGame(g.order.map(id => ({ id, nick:g.names[id] })));
}
function setStatus(t, err){ S.status = t; S.statusErr = !!err; }

/* ================= render ================= */
function render(){
  if (!S.ready) return;
  if (DR) { S.pendingRender = true; return; }       // no repintar en mitad de un arrastre
  S.pendingRender = false;
  if (S.noAccess) return renderNoAccess();
  if (S.screen === "home") return renderHome();
  if (S.screen === "lobby") return renderLobby();
  // conservar el scroll de la mesa y del atril entre repintados
  const tb = document.getElementById("table"), hd = document.getElementById("hand");
  const st = tb ? tb.scrollTop : 0, sh = hd ? hd.scrollTop : 0;
  renderGame();
  const tb2 = document.getElementById("table"), hd2 = document.getElementById("hand");
  if (tb2) tb2.scrollTop = st; if (hd2) hd2.scrollTop = sh;
}
function renderNoAccess(){
  $app.innerHTML = `<div class="screen"><div class="home">
    <div class="brand"><h1>Ficha a Ficha</h1>
    <p>No hay conexión con el servidor de partidas. Revisa internet y recarga.</p></div>
  </div></div>`;
}
function renderHome(){
  const last = ls.get("faf.last");
  const demo = [26+6, 26+7, 104, 26+9].map(i => tileHTML(i, "locked", "tabindex=-1")).join("");
  $app.innerHTML = `<div class="screen"><div class="home">
    <div class="brand">
      <div class="demo" aria-hidden="true">${demo}</div>
      <h1>Ficha a Ficha</h1>
      <p>Escaleras y grupos de fichas para 2 a 4 jugadores. Crea una mesa, pasa el código y cada uno juega desde su móvil.</p>
    </div>
    <label>Tu nombre en la mesa<input type="text" id="nick" maxlength="16" autocomplete="nickname" value="${esc(S.nick)}" placeholder="Tu nombre"></label>
    <div class="panel">
      <h2>Nueva partida</h2>
      <button class="btn primary" id="create" ${S.busy ? "disabled" : ""}>Crear mesa</button>
    </div>
    <div class="panel">
      <h2>Unirse con código</h2>
      <div class="row">
        <input type="text" id="joincode" class="code" maxlength="4" autocomplete="off" placeholder="ABCD" value="${esc(S.prefill || "")}" aria-label="Código de la mesa">
        <button class="btn" id="join" ${S.busy ? "disabled" : ""}>Entrar</button>
      </div>
      ${last ? `<button class="btn ghost small" id="rejoin">Volver a la mesa ${esc(last)}</button>` : ""}
    </div>
    <div class="msg ${S.homeErr ? "err" : ""}" role="status">${esc(S.homeMsg)}</div>
  </div></div>`;
  on("#create", "click", createGame);
  on("#join", "click", () => joinGame(document.getElementById("joincode").value));
  on("#joincode", "keydown", e => { if (e.key === "Enter") joinGame(e.target.value); });
  on("#rejoin", "click", () => joinGame(last));
}
function renderLobby(){
  const g = S.game, isHost = g.host === me();
  const inList = S.players.some(p => p.id === me());
  const list = S.players.map((p, i) => `<li><span>${esc(p.nick)}${p.id === me() ? " (tú)" : ""}</span>${p.id === g.host ? '<span class="tag">Anfitrión</span>' : i >= 4 ? '<span class="tag">En espera</span>' : ""}</li>`).join("");
  $app.innerHTML = `<div class="screen"><div class="home">
    <div class="brand"><h1>Mesa abierta</h1><p>Comparte este código. Tus amigos abren esta misma página, ponen su nombre y entran.</p></div>
    <div class="panel">
      <h2>Código de la mesa</h2>
      <div class="row" style="align-items:center">
        <span class="bigcode">${esc(S.code)}</span>
        <button class="btn ghost small" id="copy" style="flex:0 0 auto">Copiar</button>
      </div>
    </div>
    <div class="panel">
      <h2>Jugadores (${S.players.length}/4)</h2>
      <ul class="plist">${list || '<li><span class="muted">Esperando jugadores…</span></li>'}</ul>
      ${isHost
        ? `<button class="btn primary" id="start" ${S.players.length < 2 || S.busy ? "disabled" : ""}>${S.players.length < 2 ? "Faltan jugadores (mín. 2)" : "Empezar partida"}</button>`
        : `<p class="muted">El anfitrión empezará la partida cuando estéis todos.</p>`}
      ${!inList ? `<button class="btn" id="sit">Sentarme en la mesa</button>` : ""}
    </div>
    <button class="btn ghost" id="leave">Salir de la mesa</button>
  </div></div>`;
  on("#copy", "click", e => {
    navigator.clipboard?.writeText(S.code).then(() => { e.target.textContent = "Copiado"; }, () => {});
  });
  on("#start", "click", () => startGame());
  on("#sit", "click", () => joinGame(S.code));
  on("#leave", "click", leaveLobby);
}
function renderGame(){
  const g = S.game, d = S.draft, mine = myTurn(), player = amPlayer();
  const cur = g.order[g.turn];
  const seats = g.order.map((id, i) => `<span class="seat ${i === g.turn && g.status === "playing" ? "turn" : ""}">${esc(g.names[id])}${id === me() ? " (tú)" : ""} <b>${(id === me() && d ? d.hand.length : (g.hands[id] || []).length)}</b></span>`).join("");
  const table = d ? d.table : (g.table || []).map(s => s.t);
  const selOn = mine && S.sel.size > 0;

  // última jugada de otro jugador
  const last = g.last && g.last.by !== me() ? g.last : null;
  const rivalTiles = new Set(last ? last.placed : []);
  const rivalSets = new Set(last ? last.changed : []);

  const setsHTML = table.map((s, idx) => {
    const a = analyze(s);
    const ord = a.valid ? a.ordered : s;
    const allPick = mine && s.every(canPick);
    const allSel = s.every(i => S.sel.has(i));
    const tiles = ord.map(id => {
      const cls = [S.sel.has(id) ? "sel" : "", d && d.origHand.has(id) ? "fresh" : "", rivalTiles.has(id) ? "rival" : "", mine ? (canPick(id) ? "pick" : "") : "locked"].join(" ");
      return tileHTML(id, cls);
    }).join("");
    const cls = [a.valid ? "" : "bad", rivalSets.has(keyOf(s)) ? "changed" : "", selOn ? "target" : ""].join(" ");
    return `<div class="set ${cls}" data-set="${idx}"><button class="grip ${allSel ? "on" : ""}" data-grip="${idx}" ${allPick ? "" : "disabled"} aria-label="Seleccionar o arrastrar el bloque"></button>${tiles}</div>`;
  }).join("");

  let turnLine = "";
  if (g.status === "playing") turnLine = mine ? "Tu turno" : `Turno de ${esc(g.names[cur])}`;
  let meldLine = "";
  if (mine && d && !g.melded[me()]) meldLine = `<span>Primera bajada: <strong>${newMeldValue().sum}</strong> / 30</span>`;
  const lastLine = last ? `<div class="lastmove"><i></i>Lo último que colocó ${esc(g.names[last.by])}${last.placed.length ? ` (${last.placed.length} ficha${last.placed.length > 1 ? "s" : ""})` : ""}</div>` : "";

  // atril: huecos fijos para las fichas sacadas este turno, así no se recoloca nada
  const sorter = S.sort === "color"
    ? (a, b) => (isJ(a) - isJ(b)) || col(a) - col(b) || num(a) - num(b)
    : (a, b) => (isJ(a) - isJ(b)) || num(a) - num(b) || col(a) - col(b);
  let handHTML = "";
  if (d) {
    const inHand = new Set(d.hand);
    const slots = [...new Set([...d.origHand, ...d.hand])].sort(sorter);
    handHTML = slots.map(id => inHand.has(id)
      ? tileHTML(id, [S.sel.has(id) ? "sel" : "", mine ? "pick" : "locked"].join(" "))
      : `<span class="slot" aria-hidden="true"></span>`).join("");
  }
  const canReturn = mine && S.sel.size > 0 && [...S.sel].every(i => d.origHand.has(i) && !d.hand.includes(i));
  const isHost = g.host === me();

  $app.innerHTML = `
  <div class="top">
    <span class="code" title="Código de la mesa">${esc(S.code)}</span>
    <div class="seats">${seats}</div>
    <span class="pool">Pozo: ${(g.pool || []).length}</span>
  </div>
  <div class="table" id="table">
    <div class="banner"><span class="turnline">${turnLine}</span>${meldLine}
      ${isHost && !mine && g.status === "playing" ? `<button class="btn ghost small" id="skip">${S.confirmSkip ? `¿Saltar a ${esc(g.names[cur])}? Toca otra vez` : "Saltar turno"}</button>` : ""}
    </div>
    ${lastLine}
    <div class="sets">
      ${setsHTML || `<div class="empty">La mesa está vacía. ${mine ? "Arrastra fichas aquí o selecciónalas y toca «Nueva jugada»." : "Aquí aparecerán las jugadas."}</div>`}
      ${mine ? `<button class="newset ${selOn ? "on" : ""}" id="newset" ${selOn ? "" : "disabled"}>+ Nueva jugada</button>` : ""}
    </div>
    <ul class="log">${(g.log || []).slice().reverse().map(l => `<li>${esc(l)}</li>`).join("")}</ul>
  </div>
  ${player ? `
  <div class="rack">
    <div class="rackhead">
      <span>Tu atril · ${d ? d.hand.length : 0} fichas · ${handPoints(d ? d.hand : [])} pts</span>
      <span class="sp"></span>
      <div class="seg" role="group" aria-label="Ordenar atril">
        <button data-sort="color" aria-pressed="${S.sort === "color"}">Color</button>
        <button data-sort="num" aria-pressed="${S.sort === "num"}">Número</button>
      </div>
    </div>
    <div class="hand ${canReturn ? "target" : ""}" id="hand">${handHTML}</div>
    <div class="status ${S.statusErr ? "err" : ""}" role="status">${esc(S.status)}</div>
    ${mine ? `<div class="actions">
      <button class="btn" id="back" ${canReturn ? "" : "disabled"}>Al atril</button>
      <button class="btn ghost" id="undo" ${changed() && !S.busy ? "" : "disabled"}>Deshacer</button>
      <button class="btn" id="draw" ${changed() || S.busy ? "disabled" : ""}>${(g.pool || []).length ? "Robar" : "Pasar"}</button>
      <button class="btn primary" id="end" ${dirty() && !S.busy ? "" : "disabled"}>Terminar</button>
    </div>` : ""}
  </div>` : `<div class="rack"><div class="rackhead">Estás mirando la partida. Podrás jugar en la siguiente.</div></div>`}
  ${g.status === "ended" ? endOverlay(g, isHost) : ""}`;

  // eventos
  $app.querySelectorAll(".tile[data-t]").forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      if (S.justDragged) return;
      if (mine) toggle(+b.dataset.t);
    });
    if (mine && b.classList.contains("pick")) b.addEventListener("pointerdown", e => dragStart(e, [+b.dataset.t], b));
  });
  $app.querySelectorAll("[data-grip]").forEach(b => {
    const ids = () => table[+b.dataset.grip];
    b.addEventListener("click", e => {
      e.stopPropagation();
      if (S.justDragged || b.disabled) return;
      const s = ids(), all = s.every(i => S.sel.has(i));
      s.forEach(i => all ? S.sel.delete(i) : S.sel.add(i));
      setStatus(""); render();
    });
    if (!b.disabled) b.addEventListener("pointerdown", e => dragStart(e, [...ids()], b.parentElement));
  });
  $app.querySelectorAll(".set.target").forEach(b => b.addEventListener("click", () => moveSel(+b.dataset.set)));
  on("#newset", "click", () => moveSel("new"));
  on("#back", "click", () => moveSel("hand"));
  on("#hand", "click", e => { if (canReturn && !e.target.closest(".tile")) moveSel("hand"); });
  on("#undo", "click", () => { resetDraft(); setStatus(""); render(); });
  on("#draw", "click", () => drawTile());
  on("#end", "click", endTurn);
  on("#skip", "click", () => {
    if (!S.confirmSkip) { S.confirmSkip = true; render(); setTimeout(() => { S.confirmSkip = false; render(); }, 4000); return; }
    S.confirmSkip = false; drawTile(cur);
  });
  $app.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { S.sort = b.dataset.sort; ls.set("faf.sort", S.sort); render(); }));
  on("#rematch", "click", rematch);
  on("#home", "click", () => { ls.del("faf.last"); leaveToHome(""); });
}

/* ================= arrastrar fichas y bloques ================= */
function dragStart(e, ids, srcEl){
  if (e.button > 0 || !myTurn()) return;
  // si arrastras una ficha que forma parte de la selección, se arrastra toda la selección
  if (ids.length === 1 && S.sel.has(ids[0]) && S.sel.size > 1) ids = [...S.sel];
  DR = { ids, x0:e.clientX, y0:e.clientY, active:false, ghost:null, hover:null, src:srcEl, pid:e.pointerId };
  window.addEventListener("pointermove", dragMove, { passive:false });
  window.addEventListener("pointerup", dragEnd);
  window.addEventListener("pointercancel", dragCancel);
}
function dragMove(e){
  if (!DR || e.pointerId !== DR.pid) return;
  if (!DR.active) {
    if (Math.hypot(e.clientX - DR.x0, e.clientY - DR.y0) < 8) return;
    DR.active = true;
    document.body.classList.add("dragging");
    const g = document.createElement("div");
    g.className = "ghost";
    g.innerHTML = DR.ids.map(id => tileHTML(id, "locked", 'tabindex="-1"')).join("");
    document.body.appendChild(g); DR.ghost = g;
    DR.ids.forEach(id => $app.querySelectorAll(`.tile[data-t="${id}"]`).forEach(t => t.classList.add("dragsrc")));
  }
  e.preventDefault();
  DR.ghost.style.left = e.clientX + "px"; DR.ghost.style.top = e.clientY + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tgt = el && (el.closest("[data-set]") || el.closest("#newset") || el.closest("#hand"));
  if (tgt !== DR.hover) {
    if (DR.hover) DR.hover.classList.remove("hover");
    DR.hover = tgt; if (tgt) tgt.classList.add("hover");
  }
  // autoscroll de la mesa cerca de los bordes
  const tb = document.getElementById("table");
  if (tb) { const r = tb.getBoundingClientRect();
    if (e.clientY < r.top + 40) tb.scrollTop -= 12; else if (e.clientY > r.bottom - 40 && e.clientY < r.bottom) tb.scrollTop += 12; }
}
function dragEnd(e){
  if (!DR || e.pointerId !== DR.pid) return;
  const d = DR; cleanupDrag();
  if (!d.active) return;               // fue un toque: lo gestiona el click
  S.justDragged = true; setTimeout(() => { S.justDragged = false; }, 0);
  const t = d.hover;
  if (!t) { render(); return; }
  S.sel = new Set(d.ids);
  if (t.id === "newset") moveSel("new");
  else if (t.id === "hand") moveSel("hand");
  else moveSel(+t.dataset.set);
  if (S.statusErr) { S.sel.clear(); render(); }
}
function dragCancel(){ cleanupDrag(); render(); }
function cleanupDrag(){
  if (!DR) return;
  if (DR.ghost) DR.ghost.remove();
  if (DR.hover) DR.hover.classList.remove("hover");
  document.body.classList.remove("dragging");
  window.removeEventListener("pointermove", dragMove);
  window.removeEventListener("pointerup", dragEnd);
  window.removeEventListener("pointercancel", dragCancel);
  DR = null;
  if (S.pendingRender) render();
}
function endOverlay(g, isHost){
  const rows = g.order.map(id => ({ id, p: handPoints(g.hands[id]) })).sort((a, b) => a.p - b.p)
    .map(r => `<li><span>${esc(g.names[r.id])}${r.id === g.winner ? " · gana" : ""}</span><span>${r.p} pts en el atril</span></li>`).join("");
  return `<div class="overlay"><div class="card">
    <h2>${g.winner === me() ? "¡Has ganado!" : `Gana ${esc(g.names[g.winner])}`}</h2>
    <ul class="scores">${rows}</ul>
    ${isHost ? `<button class="btn primary" id="rematch" ${S.busy ? "disabled" : ""}>Revancha con los mismos</button>` : `<p class="muted">El anfitrión puede lanzar la revancha.</p>`}
    <button class="btn ghost" id="home">Salir al inicio</button>
  </div></div>`;
}
function on(sel, ev, fn){ const el = $app.querySelector(sel); if (el) el.addEventListener(ev, fn); }
})();
