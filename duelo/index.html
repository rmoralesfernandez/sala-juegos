<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo de Maravillas</title>
<meta name="theme-color" content="#16110D">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manrope:wght@500;700;800&display=swap">
<script>window.APP_KEY="duelo"</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../shared/claude-shim.js"></script>
<script src="../shared/turno.js"></script>
<script src="motor.js"></script>
<style>
/* Layout: mesa de juego a una columna — rival arriba, frente militar y fichas, pirámide de cartas en el centro, tu ciudad abajo; los detalles salen en una hoja inferior */
:root{
  --bg:#16110D; --bg2:#231A13; --panel:#2B2119; --panel2:#3A2C20; --line:#4E3D2C;
  --ink:#F6ECDD; --muted:#C2AE95; --gold:#E9B949; --gold2:#B9852A; --ok:#5BD08A; --bad:#FF6B5E;
  --brown:#8A5A33; --grey:#8C939C; --blue:#2F6FD6; --green:#2E9E5B; --red:#CF3F2E; --yellow:#E2AE22; --purple:#7D4FC1;
  --temple:#2A8C8C; --senator:#8E3558;
  --age1:#A86E35; --age2:#3F72B8; --age3:#A3433F; --parch:#F4E8D2; --parch-ink:#2A1E12;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{appearance:none;border:0;border-radius:14px;min-height:50px;padding:0 18px;background:var(--panel2);color:var(--ink);font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.gold{background:var(--gold);color:#2A1A04}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
input.text{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;font-weight:700}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:22px;text-align:center}
label.lbl{display:grid;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 0 0 1px var(--line)}
.card h2{font-size:19px}
.msg{min-height:1.4em;color:var(--gold);text-align:center;font-weight:700}
.msg.err{color:var(--bad)}
.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:16px 4px}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:.95;color:var(--gold);text-shadow:0 3px 0 #6B4512,0 10px 30px rgba(0,0,0,.5)}
.logo small{display:block;font-size:.42em;letter-spacing:.3em;color:var(--ink);text-shadow:none;margin-bottom:6px}
.fan{display:flex;justify-content:center;height:86px;margin-top:6px}
.fan i{width:52px;height:74px;border-radius:8px;margin:0 -8px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15)}
.how{display:grid;gap:8px;font-size:14.5px}
.how b{color:var(--gold)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}

.top{display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.chip{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;background:var(--panel);padding:6px 11px;border-radius:999px;box-shadow:0 0 0 1px var(--line)}
.big-code{font-family:var(--display);font-weight:900;font-size:52px;letter-spacing:.16em;line-height:1;text-align:center;color:var(--gold)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seat{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:2px;text-align:center;min-width:0}
.seat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.empty{color:var(--muted);border:2px dashed var(--line);background:transparent}
.wait{display:grid;place-items:center;gap:6px;text-align:center;padding:14px;background:var(--panel);border-radius:16px}

/* jugadores */
.pl{background:var(--panel);border-radius:16px;padding:10px 12px;display:grid;gap:7px;box-shadow:0 0 0 1px var(--line);text-align:left;width:100%;appearance:none;border:0;color:inherit}
.pl.turn{box-shadow:0 0 0 2px var(--gold),0 0 22px -6px var(--gold)}
.pl-h{display:flex;align-items:center;gap:8px;min-width:0}
.pl-h .nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl-h .sp{flex:1}
.stat{font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:3px 9px;font-size:14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:0 0 auto;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.pl-r{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:13px}
.res{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:2px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.res.z{opacity:.35}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:6px;font-weight:800;font-size:12px;color:#fff;background:var(--cc)}
.pill.y{color:#2A1A04}
.sym{font-size:15px;line-height:1}
.wons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.won{appearance:none;border:0;border-radius:11px;background:var(--bg);padding:6px 4px;display:grid;gap:1px;justify-items:center;text-align:center;min-width:0;position:relative;color:inherit}
.won .e{font-size:20px;line-height:1.1}
.won .n{font-size:10.5px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.won .p{font-size:11px;font-weight:800;color:var(--muted)}
.won.built{background:linear-gradient(180deg,#6B4C1E,#3F2C12);box-shadow:inset 0 0 0 2px var(--gold)}
.won.built .p{color:var(--gold)}
.won.lost{opacity:.3;text-decoration:line-through}
.won.can .p{color:var(--ok)}

/* frente militar */
.mil{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.cap{font-size:17px}
.trk{display:grid;grid-template-columns:repeat(19,1fr);gap:2px;position:relative;height:34px;align-items:end}
.cell{height:16px;border-radius:3px;background:var(--panel2);position:relative}
.cell.z0{background:#5a4a39}
.cell.z1{background:#6c3b2c}.cell.z2{background:#8b3a2a}.cell.z3{background:#ad3b2a}
.cell.z9{background:#e05a3e}
.cell.mine.z1{background:#2d4b6c}.cell.mine.z2{background:#2f5f8b}.cell.mine.z3{background:#3473ad}.cell.mine.z9{background:#4a90e0}
.cell .loot{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;background:var(--gold);color:#2A1A04;border-radius:999px;padding:0 4px;white-space:nowrap}
.pawn{position:absolute;bottom:0;width:calc(100%/19);height:24px;display:grid;place-items:center;transition:left .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.pawn i{width:16px;height:22px;border-radius:50% 50% 4px 4px;background:var(--gold);box-shadow:0 0 0 2px #2A1A04,0 3px 8px rgba(0,0,0,.6)}
.toks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tok{appearance:none;border:0;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d8f5a,#1d5a35);box-shadow:0 0 0 2px #8fd3a4,0 3px 6px rgba(0,0,0,.5);font-size:19px;display:grid;place-items:center;color:inherit;padding:0}
.tok.sm{width:24px;height:24px;font-size:12px;box-shadow:0 0 0 1.5px #8fd3a4}
.lbl2{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}

/* pirámide */
.pyr-wrap{display:grid;justify-items:center;padding-block:4px}
.pyr{position:relative}
.cd{position:absolute;appearance:none;border:0;padding:0;border-radius:7px;background:var(--cc);box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 0 1.5px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;color:#fff;transition:transform .12s,opacity .3s}
.cd .nm{font-size:8.5px;font-weight:800;line-height:1.1;padding:3px 3px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.cd.yellow .nm{color:#2A1A04;text-shadow:none}
.cd .fx{margin:0 3px;background:var(--parch);color:var(--parch-ink);border-radius:4px;min-height:24px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;font-size:13px;font-weight:800;line-height:1.05;padding:2px 1px;text-align:center}
.cd .co{margin-top:auto;font-size:9.5px;font-weight:800;padding:2px 2px 3px 3px;display:flex;justify-content:flex-start;gap:0;flex-wrap:wrap;line-height:1.1;background:rgba(0,0,0,.25)}
.cd .pr{position:absolute;right:-2px;bottom:-2px;font-size:10px;font-weight:800;background:var(--ink);color:var(--parch-ink);border-radius:7px 0 7px 0;padding:1px 5px}
.cd .pr.no{background:var(--bad);color:#fff}
.cd .pr.free{background:var(--ok);color:#06200f}
.cd.acc{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 2px var(--gold)}
.cd.acc.me:hover{transform:translateY(-3px)}
.cd.off{filter:saturate(.75) brightness(.82)}
.cd.back{background:var(--back);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;color:rgba(255,255,255,.75);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px)}
.cd.back.guild{--back:#4D2C78}
.cd.new{animation:flip .45s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}

.bar{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 1px var(--line);min-height:48px}
.bar .t{flex:1;font-weight:700;min-width:0}
.bar.mine{background:linear-gradient(90deg,#5a3f12,#2B2119);box-shadow:0 0 0 2px var(--gold)}
#turno .st-franja{margin:0}
.bar{min-height:44px;padding:6px 10px}
.bar .last{display:block;font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .2s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{font-size:20px}
.sheet .x,.sheet .x2{margin-left:auto}
.sh-h{display:flex;align-items:center;gap:10px}
.big{border-radius:14px;background:var(--cc);padding:10px;display:grid;gap:8px;color:#fff}
.big.yellow{color:#2A1A04}
.big .ty{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.big .ttl{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.05}
.big .body{background:var(--parch);color:var(--parch-ink);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-weight:600}
.big .body b{font-weight:800}
.costline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800}
.quote{background:var(--panel);border-radius:12px;padding:10px 12px;font-weight:600;display:grid;gap:3px}
.quote.no{box-shadow:inset 0 0 0 2px var(--bad)}
.acts{display:grid;gap:8px}
.wpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wbtn{appearance:none;border:0;border-radius:14px;background:var(--panel2);padding:10px;display:grid;gap:2px;text-align:left;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.wbtn .e{font-size:22px}
.wbtn b{font-size:14px}
.wbtn span{font-size:12.5px;color:var(--muted);font-weight:700}
.wbtn:disabled{opacity:.4}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;min-width:0}
.li .t{flex:1;min-width:0;display:grid;gap:1px}
.li .t b{font-weight:800}
.li .t span{font-size:13px;color:var(--muted)}
.li .sw{width:10px;align-self:stretch;border-radius:4px;background:var(--cc);flex:0 0 auto}
.grp{display:grid;gap:6px}
.grp h4{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--cc);color:#fff;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.chips span.y{color:#2A1A04}
table.sc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sc th,table.sc td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc tr.tot td{font-family:var(--display);font-weight:900;font-size:19px;color:var(--gold);border:0}
table.sc thead th{font-size:13px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* draft */
.draft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dw{background:var(--panel);border-radius:16px;padding:12px;display:grid;gap:6px;box-shadow:0 0 0 1px var(--line);align-content:start}
.dw .e{font-size:30px;line-height:1}
.dw h3{font-size:15px}
.dw ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.dw .btn{margin-top:4px}

.banner{text-align:center;display:grid;gap:6px;padding:18px 12px;border-radius:20px;background:linear-gradient(180deg,#5a3f12,#2B2119);box-shadow:0 0 0 2px var(--gold)}
.banner .w{font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,40px);color:var(--gold);line-height:1}
.pass{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.pass div{display:grid;gap:14px;justify-items:center}
/* expansiones */
.xp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xpb{appearance:none;border:0;border-radius:14px;background:var(--bg);padding:10px 12px;text-align:left;display:grid;gap:2px;box-shadow:inset 0 0 0 2px var(--line);color:inherit}
.xpb b{font-size:15px}
.xpb span{font-size:12.5px;color:var(--muted);font-weight:600}
.xpb[aria-pressed="true"]{background:#3d2c12;box-shadow:inset 0 0 0 2px var(--gold)}
.xpb:disabled{opacity:1;cursor:default}
.pan,.sen{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.gsp,.chm{appearance:none;border:0;border-radius:10px;background:var(--panel);min-height:58px;padding:4px 2px;display:grid;justify-items:center;align-content:center;gap:1px;color:inherit;box-shadow:0 0 0 1px var(--line);min-width:0}
.gsp .e,.chm .d{font-size:18px;line-height:1.1}
.gsp .n{font-size:9.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsp .p{font-size:11px;font-weight:800;color:var(--gold)}
.gsp.down{background:repeating-linear-gradient(45deg,#3a2c20 0 5px,#2b2119 5px 10px)}
.gsp.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.gsp.can{box-shadow:0 0 0 2px var(--ok)}
.chm .vp{font-size:10.5px;font-weight:800;color:var(--muted)}
.chm .cb{display:flex;gap:3px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.cb .a{color:#7fb4ff}.cb .b{color:#ff8f7e}
.chm.me{box-shadow:0 0 0 2px #4a90e0;background:#1c2c40}
.chm.op{box-shadow:0 0 0 2px #e05a3e;background:#3d1f19}
.chm.pk{outline:2px dashed var(--gold);outline-offset:1px}
.chm:disabled,.gsp:disabled{opacity:.45}
.secs{display:grid;grid-template-columns:repeat(3,1fr);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:-4px}
.cell .mnv{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:12px;line-height:1}
.cd .tk{position:absolute;top:5px;left:50%;transform:translateX(-50%);min-width:24px;height:24px;padding:0 3px;border-radius:999px;background:var(--parch);color:var(--parch-ink);display:grid;place-items:center;font-family:var(--body);font-size:12px;font-weight:800;white-space:nowrap;line-height:1;box-shadow:0 0 0 2px var(--gold),0 2px 5px rgba(0,0,0,.5)}
.cd .tk.tp{box-shadow:0 0 0 2px var(--temple),0 0 0 4px var(--gold)}
.cd.back.temple{--back:#1E5E5E}
.cd.back.senator{--back:#5A2238}
.mtrk{display:grid;grid-template-columns:auto repeat(19,minmax(0,1fr)) auto;gap:2px;align-items:center}
.mtrk button{appearance:none;border:0;height:36px;border-radius:5px;background:var(--panel2);color:inherit;font-size:11px;font-weight:800;padding:0}
.mtrk button.mine{background:#2d4b6c}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{appearance:none;border:0;border-radius:999px;padding:7px 12px;background:var(--panel);font-weight:800;font-size:13.5px;color:inherit;white-space:nowrap;box-shadow:0 0 0 1px var(--line)}
.tab[aria-selected="true"]{background:var(--gold);color:#2A1A04}
.rules{display:grid;gap:8px;font-size:14.5px}
.rules h4{margin:6px 0 0;font-family:var(--display);font-size:15px;color:var(--gold)}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rules b{color:var(--ink)}
.tip{background:#1d3626;border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--green);display:grid;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--parch-ink);padding:10px 16px;border-radius:12px;font-weight:800;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:80;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="logo"><small>DUELO DE</small>Maravillas</div><p class="muted">Preparando la mesa…</p></div></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const M = window.Motor;
const { CARDS, WONDERS, TOKENS, SCI, SCI_N, MYTHS, GODS, GATE, DECREES, CONSPS, SEC_N } = M;
const RI = { W: "🪵", C: "🧱", S: "🪨", G: "🧪", P: "📜" };
const RN = { W: "madera", C: "arcilla", S: "piedra", G: "vidrio", P: "papiro" };
const COLN = { brown: "Materia prima", grey: "Manufactura", blue: "Edificio civil", green: "Edificio científico", red: "Edificio militar", yellow: "Edificio comercial", purple: "Gremio", temple: "Gran Templo", senator: "Senador" };
const COLP = { brown: "marrones", grey: "grises", blue: "azules", green: "verdes", red: "rojas", yellow: "amarillas", purple: "moradas", temple: "templos", senator: "senadores", wonder: "maravillas", coins: "monedas" };
const COL1 = { brown: "marrón", grey: "gris", blue: "azul", green: "verde", red: "roja", yellow: "amarilla", purple: "morada", temple: "de templo", senator: "de senador" };
const COLS = ["brown", "grey", "blue", "green", "red", "yellow", "purple", "temple", "senator"];
const ROMAN = ["", "I", "II", "III"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const $app = document.getElementById("app"), $sheet = document.getElementById("sheet");
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }
function on(sel, ev, fn, root) { (root || $app).querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }

/* ================= estado ================= */
const S = {
  db: null, uid: null, ready: false, offline: false,
  name: (localStorage.getItem("sala.nick") || "").slice(0, 16),
  code: null, g: null, unsub: null, sel: null, homeMsg: "", homeErr: false, busy: false,
  lastKey: "", pick: {}, peekSeq: null,
  opt: Object.assign({ pan: false, ag: false }, ls.get("duelo.opt") || {})
};
const XP = [["pan", "⚡ Panteón", "Dioses, ofrendas y Grandes Templos"], ["ag", "🏛️ Ágora", "Senado, senadores y conspiraciones"]];
const optText = o => [o && o.pan && "Panteón", o && o.ag && "Ágora"].filter(Boolean).join(" + ") || "Sin expansiones";
const xpToggles = (o, can) => `<div class="xp">${XP.map(([k, n, d]) => `<button class="xpb" data-xp="${k}" aria-pressed="${!!(o && o[k])}"${can ? "" : " disabled"}><b>${o && o[k] ? "✓ " : ""}${n}</b><span>${d}</span></button>`).join("")}</div>`;
const me = () => S.uid;
if (window.FIREBASE_EMULATORS) window.__S = S;

async function boot() {
  try {
    const [db, user] = await Promise.all(["db", "user"].map(n => window.claude ? claude.use(n).catch(() => null) : null));
    S.db = db; if (user) S.uid = await user.id();
  } catch {}
  if (!S.db || !S.uid) S.offline = true;
  S.ready = true;
  const h = (location.hash || "").replace("#", "").toUpperCase(), last = ls.get("duelo.last");
  if (!S.offline && /^[A-Z]{4}$/.test(h)) S.prefill = h;
  else if (!S.offline && last && last.code && Date.now() - last.t < 12 * 3600e3) S.rejoin = last.code;
  /* Al recargar o reabrir la app con una partida en juego, vuelve sola a ella */
  const auto = !S.offline && window.SalaTurno && SalaTurno.pendiente ? SalaTurno.pendiente() : "";
  if (auto) setTimeout(async () => { await joinGame(auto); if (!S.code) SalaTurno.olvidar(); });
  render();
}

/* ================= partida ================= */
function watch(code) {
  unwatch(); S.code = code; ls.set("duelo.last", { code, t: Date.now() });
  S.unsub = S.db.doc("games/" + code).onSnapshot(snap => {
    if (!snap.exists) { leave("Esa partida ya no existe."); return; }
    const prev = S.g; S.g = snap.data(); if (S.g && S.g.s) M.upgrade(S.g.s); onGame(prev); render();
  }, () => leave("Se ha perdido la conexión con la partida."));
}
function unwatch() { if (S.unsub) try { S.unsub(); } catch {} S.unsub = null; S.g = null; S.sel = null; closeSheet(); }
function leave(msg) { unwatch(); S.code = null; S.homeMsg = msg || ""; S.homeErr = !!msg; history.replaceState(null, "", location.pathname); render(); }
function saveName() {
  const el = document.getElementById("nm"), v = ((el && el.value) || S.name || "").trim().slice(0, 16);
  if (!v) { S.homeMsg = "Escribe tu nombre."; S.homeErr = true; render(); return false; }
  S.name = v; try { localStorage.setItem("sala.nick", v); } catch {} return true;
}
const genCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };
async function freeCode() { let code; for (let i = 0; i < 6; i++) { code = genCode(); if (!(await S.db.doc("games/" + code).get()).exists) break; } return code; }
async function createGame(local) {
  if (!saveName()) return;
  let rival = "";
  if (local) { rival = (document.getElementById("rv").value || "").trim().slice(0, 16); if (!rival) { S.homeMsg = "Escribe el nombre del rival."; S.homeErr = true; render(); return; } }
  S.busy = true; render();
  try {
    const code = await freeCode();
    const seats = { 0: { id: me(), name: S.name } };
    const doc = { v: 2, status: "lobby", host: me(), createdAt: Date.now(), seq: 0, local: !!local, seats, s: null, opt: { pan: !!S.opt.pan, ag: !!S.opt.ag } };
    if (local) { seats[1] = { id: me(), name: rival }; doc.status = "play"; doc.s = M.newGame(Math.random() < .5 ? 0 : 1, null, doc.opt); }
    await S.db.doc("games/" + code).set(doc);
    location.hash = code; watch(code);
  } catch { S.homeMsg = "No se pudo crear la partida. Revisa la conexión."; S.homeErr = true; }
  S.busy = false; render();
}
async function joinGame(code) {
  if (!saveName()) return;
  code = String(code || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { S.homeMsg = "El código tiene 4 letras."; S.homeErr = true; render(); return; }
  S.busy = true; render();
  try {
    const snap = await S.db.doc("games/" + code).get();
    if (!snap.exists) { S.homeMsg = "No hay ninguna partida con ese código."; S.homeErr = true; }
    else {
      const g = snap.data(), seats = g.seats || {};
      const mine = [0, 1].find(i => seats[i] && seats[i].id === me());
      if (mine !== undefined && !g.local) { if (seats[mine].name !== S.name) await S.db.doc("games/" + code).update({ seats: { [mine]: { id: me(), name: S.name } } }); }
      else if (!seats[1] && g.status === "lobby") await S.db.doc("games/" + code).update({ seats: { 1: { id: me(), name: S.name } } });
      else if (mine === undefined) toast("La partida está completa: entras como público.");
      location.hash = code; watch(code);
    }
  } catch { S.homeMsg = "No se pudo entrar. Revisa la conexión."; S.homeErr = true; }
  S.busy = false; render();
}
async function put(patch) {
  const g = { ...S.g, ...patch, seq: (S.g.seq || 0) + 1 };
  S.g = g; render();
  try { await S.db.doc("games/" + S.code).set(g); }
  catch { toast("No se pudo guardar. Reintentando…"); setTimeout(() => S.db.doc("games/" + S.code).set(S.g).catch(() => toast("Sin conexión con la partida.")), 1500); }
}
async function startGame() {
  if (!S.g.seats[1]) return;
  await put({ status: "play", s: M.newGame(Math.random() < .5 ? 0 : 1, null, S.g.opt || {}) });
}
async function rematch() {
  S.ackActor = undefined;
  await put({ status: "play", s: M.newGame(Math.random() < .5 ? 0 : 1, null, (S.g.s && S.g.s.x) || S.g.opt || {}) });
}

/* ================= quién soy en la mesa ================= */
const G = () => S.g && S.g.s;
const seatOf = id => { const st = S.g.seats || {}; return [0, 1].find(i => st[i] && st[i].id === id); };
const nameOf = i => ((S.g.seats || {})[i] || {}).name || (i === 0 ? "Jugador 1" : "Jugador 2");
/* índice desde el que miro la mesa y con el que actúo */
function myIdx() {
  if (!S.g) return null;
  if (S.g.local) { const s = G(); const a = s ? M.actor(s) : null; return a !== null && a !== undefined ? a : (S.view ?? 0); }
  const i = seatOf(me()); return i === undefined ? null : i;
}
const viewIdx = () => { const i = myIdx(); return i === null ? 0 : i; };
const isMyTurn = () => { const s = G(); if (!s) return false; const a = M.actor(s); return a !== null && a === myIdx(); };
const who = i => S.g.local ? nameOf(i) : i === myIdx() ? "Tú" : nameOf(i);

async function play(a) {
  const s = G(), pi = myIdx();
  let ns;
  try { ns = M.act(s, pi, a); } catch (e) { toast(e.rule ? e.message : "No se puede hacer eso."); return; }
  S.sel = null; closeSheet();
  await put({ s: ns });
}

function onGame(prev) {
  const s = G(); if (!s) return;
  if (S.g.local) S.view = M.actor(s) ?? S.view;
  const ps = prev && prev.s;
  if (ps && !S.g.local && JSON.stringify(ps.log) !== JSON.stringify(s.log)) {
    /* aviso de lo que acaba de hacer el rival */
    const lastOld = JSON.stringify(ps.log[ps.log.length - 1]);
    let j = -1; for (let x = s.log.length - 1; x >= 0; x--) if (JSON.stringify(s.log[x]) === lastOld) { j = x; break; }
    const other = s.log.slice(j + 1).filter(e => e.p !== null && e.p !== myIdx());
    if (other.length) toast(other.slice(-2).map(e => `${nameOf(e.p)} ${e.m}`).join(" · "));
  }
  if (!S.g.local && ps && M.actor(ps) !== myIdx() && isMyTurn() && navigator.vibrate) try { navigator.vibrate(40); } catch {}
  if (S.sel && S.sel.kind === "slot" && (!s.slots[S.sel.i] || s.slots[S.sel.i].gone)) { S.sel = null; closeSheet(); }
}

/* ================= piezas de interfaz ================= */
function costHTML(cost, small) {
  const out = [];
  if (cost.c) out.push(`${cost.c}🪙`);
  M.RES.forEach(r => { for (let i = 0; i < (cost[r] || 0); i++) out.push(RI[r]); });
  return out.length ? out.join(small ? "" : " ") : (small ? "" : "Gratis");
}
const sq = col => `<span class="pill${col === "yellow" ? " y" : ""}" style="--cc:var(--${col});min-width:12px;height:12px;padding:0"></span>`;
/* resumen corto del efecto para la carta pequeña */
function fxShort(c) {
  if (c.col === "temple") return `${MYTHS[c.templeOf].e}<small>★</small>`;
  if (c.col === "senator") return c.kind === "pol" ? `🎗️<small>${{ L: "izq", M: "cen", R: "der" }[c.sec]}</small>` : "🗝️";
  if (c.prod) return Object.entries(c.prod).map(([r, n]) => RI[r].repeat(n)).join("");
  if (c.choice) return c.choice.map(r => RI[r]).join("/");
  if (c.trade) return `${c.trade.map(r => RI[r]).join("")}<small>=1</small>`;
  if (c.sci) return `${SCI[c.sci]}${c.vp ? `<small>${c.vp}★</small>` : ""}`;
  if (c.sh) return "🛡️".repeat(c.sh);
  if (c.gain) return `+${c.gain}🪙`;
  if (c.per) return `${c.vp}★<small>${c.per.c}🪙/</small>${c.per.of === "wonder" ? "🏛️" : sq(c.per.of)}`;
  if (c.guild) return `<small>${c.guild.of[0] === "coins" ? "🪙" : c.guild.of[0] === "wonder" ? "🏛️" : c.guild.of.map(sq).join("")}</small>★`;
  if (c.vp) return `${c.vp}★`;
  return "";
}
function fxLong(c) {
  const L = [];
  if (c.col === "temple") {
    L.push(`Gran Templo de la mitología <b>${MYTHS[c.templeOf].e} ${MYTHS[c.templeOf].n}</b>.`);
    L.push(`Gratis si tienes su ficha de mitología <b>con templo</b> ⛩.`);
    L.push(`Al final: 1 templo <b>5★</b>, 2 templos <b>12★</b>, 3 templos <b>21★</b>.`);
    return L;
  }
  if (c.col === "senator") {
    if (c.kind === "pol") L.push(`<b>Político</b> (sección ${SEC_N[c.sec]}): al reclutarlo haces 1, 2 o 3 acciones en el Senado según tus cartas azules (0-1 → 1, 2-3 → 2, 4 o más → 3). Cada acción: colocar 1 influencia en una cámara de su sección o mover 1 tuya a una cámara vecina.`);
    else L.push(`<b>Conspirador</b>: al reclutarlo eliges entre colocar 1 influencia en cualquier cámara o conspirar (robas 2 conspiraciones y te quedas 1 en secreto).`);
    L.push(`Reclutarlo cuesta 1 🪙 por cada senador que ya tengas.`);
    return L;
  }
  if (c.prod) L.push(`Produce ${Object.entries(c.prod).map(([r, n]) => `<b>${n} ${RI[r]} ${RN[r]}</b>`).join(" y ")} cada turno.`);
  if (c.choice) L.push(`Produce cada turno <b>uno</b> de estos: ${c.choice.map(r => `${RI[r]} ${RN[r]}`).join(", ")}. No sube el precio al rival.`);
  if (c.trade) L.push(`Compras ${c.trade.map(r => `${RI[r]} ${RN[r]}`).join(" y ")} a <b>1 moneda</b> fija.`);
  if (c.sci) L.push(`Símbolo científico: <b>${SCI[c.sci]} ${SCI_N[c.sci]}</b>. Con dos iguales eliges una ficha de progreso; con 6 distintos ganas.`);
  if (c.sh) L.push(`<b>${c.sh} ${c.sh > 1 ? "escudos" : "escudo"}</b>: el ejército avanza ${c.sh} ${c.sh > 1 ? "casillas" : "casilla"} hacia la capital rival.`);
  if (c.gain) L.push(`Ganas <b>${c.gain} monedas</b> al construirla.`);
  if (c.per) L.push(`Ganas <b>${c.per.c} ${c.per.c > 1 ? "monedas" : "moneda"}</b> por cada ${c.per.of === "wonder" ? "maravilla construida" : `carta ${COL1[c.per.of]}`} de tu ciudad al construirla.`);
  if (c.guild) {
    const g = c.guild, what = g.of[0] === "coins" ? "monedas" : g.of[0] === "wonder" ? "maravillas" : `cartas ${g.of.map(x => COLP[x]).join(" y ")}`;
    if (g.c) L.push(`Al construirla ganas <b>1 moneda</b> por cada una de las ${what} de la ciudad que más tenga.`);
    L.push(g.of[0] === "coins" ? `Al final, <b>1 punto por cada 3 monedas</b> de la ciudad más rica.` : `Al final, <b>${g.vp} ${g.vp > 1 ? "puntos" : "punto"}</b> por cada una de las ${what} de la ciudad que más tenga.`);
  }
  if (c.vp && c.col !== "purple") L.push(`<b>${c.vp} puntos</b> de victoria.`);
  if (c.free) L.push(`🔗 Gratis si ya tienes <b>${esc(CARDS[c.free].n)}</b>.`);
  if (c.chainTo) L.push(`🔗 Después te deja construir gratis <b>${esc(CARDS[c.chainTo].n)}</b>.`);
  return L;
}
function wonderFx(W) {
  const L = [];
  if (W.vp) L.push(`<b>${W.vp} puntos</b> de victoria.`);
  if (W.gain) L.push(`Ganas <b>${W.gain} monedas</b>.`);
  if (W.steal) L.push(`El rival pierde <b>${W.steal} monedas</b>.`);
  if (W.sh) L.push(`<b>${W.sh} ${W.sh > 1 ? "escudos" : "escudo"}</b> para tu ejército.`);
  if (W.destroy) L.push(`Destruyes una carta <b>${W.destroy === "grey" ? "gris" : "marrón"}</b> del rival.`);
  if (W.library) L.push(`Robas 3 fichas de progreso de las que no están en juego y te quedas <b>una</b>.`);
  if (W.mausoleo) L.push(`Construyes <b>gratis</b> una carta del descarte.`);
  if (W.choice) L.push(`Produce cada turno uno de: ${W.choice.map(r => `${RI[r]} ${RN[r]}`).join(", ")}.`);
  if (W.sanct) L.push(`Los dioses te cuestan <b>2 monedas menos</b>.`);
  if (W.theater) L.push(`Eliges un dios de cualquier mitología (aunque no esté en el Panteón) y lo <b>invocas gratis</b>.`);
  if (W.curia) L.push(`Desvelas gratis una de tus conspiraciones <b>sin preparar</b>.`);
  if (W.knossos) L.push(`Colocas <b>1 influencia</b> en el Senado y después puedes mover 1.`);
  if (W.onPick === "conspire") L.push(`Al elegirla en la selección de maravillas, <b>conspiras</b>.`);
  if (W.onPick === "place") L.push(`Al elegirla en la selección de maravillas, colocas <b>1 influencia</b>.`);
  if (W.replay) L.push(`🔁 <b>Juegas otro turno</b> justo después.`);
  return L;
}
function quoteHTML(q, pi, c) {
  const p = G().P[pi], av = M.avail(p);
  const noMoney = q.ok ? "" : `<span style="color:var(--bad)">No te llega: tienes ${av} 🪙.</span>`;
  if (q.senator) return `<div class="quote${q.ok ? "" : " no"}"><b>${q.total ? `Reclutarlo te cuesta ${q.total} 🪙` : "Reclutarlo es gratis"}</b><span class="muted small">1 🪙 por cada senador que ya tienes.</span>${noMoney}</div>`;
  if (q.eng) return `<div class="quote${q.ok ? "" : " no"}"><b>Te cuesta 1 🪙 gracias a Ingeniería ⚙️</b>${noMoney}</div>`;
  if (q.chain && c && c.templeOf) return `<div class="quote"><b style="color:var(--ok)">Gratis por tu ficha de mitología con templo ⛩</b></div>`;
  if (q.chain) return `<div class="quote"><b style="color:var(--ok)">Gratis por encadenamiento 🔗</b></div>`;
  if (!q.total) return `<div class="quote"><b style="color:var(--ok)">Gratis:</b> produces todo lo que pide.</div>`;
  const buy = {}; q.buy.forEach(r => { buy[r] = (buy[r] || 0) + 1; });
  const parts = Object.entries(buy).map(([r, n]) => `${n}×${RI[r]} a ${q.price[r]}🪙`);
  return `<div class="quote${q.ok ? "" : " no"}"><b>Te cuesta ${q.total} 🪙</b>
    <span class="muted small">${q.coins ? `${q.coins}🪙 de la carta` : ""}${q.coins && parts.length ? " + " : ""}${parts.length ? `compras ${parts.join(", ")}` : ""}</span>
    ${noMoney}</div>`;
}

/* ================= vistas ================= */
function render() {
  if (!S.ready) return;
  if (window.SalaTurno && (!S.code || !S.g || S.g.status === "lobby" || !G())) SalaTurno.limpiar();
  if (S.offline) return view(`<div class="hero"><div class="logo"><small>DUELO DE</small>Maravillas</div><p class="muted">No hay conexión con el servidor de partidas. Revisa internet y recarga.</p></div>`, "off");
  if (!S.code) return renderHome();
  if (!S.g) return view(`<div class="hero"><div class="logo"><small>DUELO DE</small>Maravillas</div><p class="muted">Entrando en la partida…</p></div>`, "load");
  if (S.g.status === "lobby" || !G()) return renderLobby();
  renderGame();
}
function view(html, key) { if (key && key === S.lastKey) return false; S.lastKey = key; $app.innerHTML = html; return true; }

function renderHome() {
  const fan = ["var(--age1)", "var(--blue)", "var(--green)", "var(--red)", "var(--age3)"].map((c, i) => `<i style="background:${c};transform:rotate(${(i - 2) * 9}deg) translateY(${Math.abs(i - 2) * 6}px)"></i>`).join("");
  const html = `
  <div class="hero"><div class="fan" aria-hidden="true">${fan}</div><div class="logo"><small>DUELO DE</small>Maravillas</div>
    <p class="muted">Tres eras, siete maravillas y una sola civilización en pie. Para dos, cada uno desde su móvil.</p></div>
  <label class="lbl" for="nm">Tu nombre<input id="nm" class="text" maxlength="16" autocomplete="nickname" value="${esc(S.name)}" placeholder="Tu nombre"></label>
  <div class="card"><h2>Expansiones</h2><p class="muted small">Marca una, las dos o ninguna. Vale para la partida online y para jugar en este móvil.</p>${xpToggles(S.opt, true)}
    <button class="btn ghost sm" id="rulesh">📖 Reglas y guía de primera partida</button></div>
  <div class="card"><h2>Nueva partida</h2><button class="btn gold wide" id="create"${S.busy ? " disabled" : ""}>Crear partida</button></div>
  <div class="card"><h2>Unirse</h2>
    <div class="row"><input id="jc" class="text code" maxlength="4" autocomplete="off" placeholder="ABCD" value="${esc(S.prefill || "")}" aria-label="Código de la partida"><button class="btn" id="join"${S.busy ? " disabled" : ""}>Entrar</button></div>
    ${S.rejoin ? `<button class="btn ghost" id="rejoin">Volver a la partida ${esc(S.rejoin)}</button>` : ""}</div>
  <details class="card"><summary><b>Jugar los dos en este móvil</b></summary>
    <div class="row" style="margin-top:10px"><input id="rv" class="text" maxlength="16" placeholder="Nombre del rival" aria-label="Nombre del rival"><button class="btn" id="local"${S.busy ? " disabled" : ""}>Empezar</button></div></details>
  <p class="msg ${S.homeErr ? "err" : ""}" role="status">${esc(S.homeMsg)}</p>
  <details class="card"><summary><b>Cómo se juega</b></summary><div class="how">
    <p>Cada uno elige <b>4 maravillas</b> por turnos. Después se juegan <b>3 eras</b>, cada una con 20 cartas colocadas en una figura; solo puedes coger cartas que no tengan otra encima.</p>
    <p>En tu turno coges una carta y haces una de tres cosas: <b>construirla</b> pagando su coste, <b>descartarla</b> por 2 monedas (+1 por cada carta amarilla tuya) o usarla para <b>construir una maravilla</b>.</p>

    case "mau": return head("Carta del descarte", "Elige una carta del descarte y constrúyela gratis.") + list(uniq(s.discard).filter(id => CARDS[id].col !== "senator").map(id => cardRow(id, actA({ t: "mau", card: id }), "Construir")));
    case "traicion": return head("🗡️ Traición", "Construye gratis una de las cartas que se apartaron al preparar las eras.") + list(uniq(s.removed).map(id => cardRow(id, actA({ t: "traicion", card: id }), "Construir")));
    case "start": {
      const next = ROMAN[s.age + 1], why = s.pawn === 0 ? "El frente está igualado y fuiste quien cogió la última carta." : "Vas por detrás en lo militar.";
      return head(`¿Quién empieza la Era ${next}?`, `${why} Tú decides.`) + `
        <div class="acts"><button class="btn gold" ${actA({ t: "start", who: pen.who })}>Empiezo ${S.g.local ? esc(nameOf(pen.who)) : "yo"}</button><button class="btn" ${actA({ t: "start", who: 1 - pen.who })}>Que empiece ${esc(nameOf(1 - pen.who))}</button></div>`;
    }
    case "myth": {
      const m = MYTHS[pen.m];
      if (!k.g) return head(`${m.e} Mitología ${esc(m.n)}`, "Has destapado una ficha de mitología. Elige cuál de estos dioses pones en el Panteón (boca abajo hasta la Era II).") + list(pen.opts.map(g => godRow(g, pickA({ g }), "Este")));
      const cells = s.pan.sp.map((x, sp) => x ? `<div class="gsp empty"><span class="n">ocupada</span></div>` : `<button class="gsp can" ${actA({ t: "myth", g: k.g, sp })}><span class="e">${GODS[k.g].e}</span><span class="p">${pi === 0 ? M.PAN_COST[sp] : M.PAN_COST[5 - sp]}🪙</span><span class="n">rival ${pi === 0 ? M.PAN_COST[5 - sp] : M.PAN_COST[sp]}</span></button>`).join("");
      return head(`${GODS[k.g].e} ${esc(GODS[k.g].n)}`, "Elige casilla. El número grande es lo que te costará a ti invocarlo; debajo, lo que le costará al rival.") + `<div class="pan">${cells}</div><button class="btn ghost sm" ${pickA({ g: null })}>Cambiar de dios</button>`;
    }
    case "nisaba": return head("🐍 Nisaba", "Elige una carta verde del rival: copias su símbolo científico.") + list(o.cards.filter(id => CARDS[id].col === "green").map(id => cardRow(id, actA({ t: "nisaba", card: id }), "Copiar")));
    case "zeus": {
      const rows = s.slots.map((t, i) => t.gone ? "" : `<div class="li"><span class="sw" style="--cc:${t.up ? `var(--${CARDS[t.c].col})` : "var(--panel2)"}"></span><div class="t"><b>${t.up ? esc(CARDS[t.c].n) : "Carta boca abajo"}</b><span>Fila ${t.r + 1}${M.accessible(s, i) ? " · libre" : ""}${t.tok ? (t.tok.k === "myth" ? ` · con ficha ${MYTHS[t.tok.m].e}` : ` · con ofrenda -${t.tok.v}`) : ""}</span></div><button class="btn gold sm" ${actA({ t: "zeus", slot: i })}>Descartar</button></div>`);
      return head("🌩️ Zeus", "Manda al descarte una carta de la pirámide, aunque esté tapada.") + list(rows);
    }
    case "anubis": { const rows = []; [0, 1].forEach(w => s.P[w].wonders.forEach(x => { if (x.built) rows.push(wonRow(x.id, actA({ t: "anubis", who: w, w: x.id }), "Deshacer", `de ${who(w)}`)); })); return head("🐺 Anubis", "La maravilla vuelve a estar sin construir; sus efectos ya aplicados se quedan.") + list(rows); }
    case "isis": {
      if (!k.w) return head("🪽 Isis", "Elige qué maravilla tuya vas a construir gratis.") + list(p.wonders.filter(w => !w.built && !w.lost).map(w => wonRow(w.id, pickA({ w: w.id }), "Esta")));
      return head(`🪽 Isis · ${esc(WONDERS[k.w].n)}`, "Ahora elige la carta del descarte que usas para construirla.") + list(uniq(s.discard).filter(id => CARDS[id].col !== "senator").map(id => cardRow(id, actA({ t: "isis", card: id, w: k.w }), "Usar"))) + `<button class="btn ghost sm" ${pickA({ w: null })}>Cambiar de maravilla</button>`;
    }
    case "ra": return head("Maravilla del rival", "Elige una maravilla sin construir del rival: pasa a ser tuya.") + list(o.wonders.filter(w => !w.built && !w.lost).map(w => wonRow(w.id, actA({ t: "ra", w: w.id }), "Quitar")));
    case "sabotaje": return head("💣 Sabotaje", "La maravilla vuelve a la caja: el rival pierde sus puntos.") + list(o.wonders.filter(w => w.built).map(w => wonRow(w.id, actA({ t: "sabotaje", w: w.id }), "Sabotear")));
    case "minerva": {
      let cells = `<span>🏰</span>`;
      for (let x = -9; x <= 9; x++) { const pos = pi === 0 ? x : -x; cells += pos === s.pawn ? `<button disabled>⚑</button>` : `<button class="${x < 0 ? "mine" : ""}" ${actA({ t: "minerva", pos })} aria-label="Casilla ${x}">${Math.abs(x)}</button>`; }
      return head("🪖 Minerva", "Elige casilla del frente (⚑ es el ejército). El primer ejército que vaya a pisarla se para antes y Minerva se retira.") + `<div class="mtrk">${cells}<span>🏯</span></div>`;
    }
    case "neptuno": {
      const ks = Object.keys(s.loot).filter(q => s.loot[q]);
      if (!k.off) return head("🔱 Neptuno", "Primero elige la ficha de botín que retiras sin aplicarla.") + list(ks.map(q => `<div class="li"><div class="t"><b>Ficha ${lootName(q, pi)}</b></div><button class="btn gold sm" ${pickA({ off: q })}>Retirar</button></div>`));
      return head("🔱 Neptuno", `Retiras la ficha ${lootName(k.off, pi)}. ¿Aplicas otra? Quien está en ese lado pierde las monedas.`) + list(ks.filter(q => q !== k.off).map(q => `<div class="li"><div class="t"><b>Aplicar ficha ${lootName(q, pi)}</b></div><button class="btn gold sm" ${actA({ t: "neptuno", off: k.off, apply: q })}>Aplicar</button></div>`)) + `<div class="acts"><button class="btn" ${actA({ t: "neptuno", off: k.off, apply: null })}>No aplicar ninguna</button><button class="btn ghost sm" ${pickA({ off: null })}>Cambiar</button></div>`;
    }
    case "gate": return head("🚪 La Puerta", "Elige uno de estos dioses y lo invocas gratis.") + list(pen.opts.map(g => godRow(g, actA({ t: "gate", g }), "Invocar")));
    case "theater": return head("🎭 Teatro Divino", "Elige cualquier dios que quede en los mazos y lo invocas gratis.") + list([].concat(...Object.values(s.pan.decks)).map(g => godRow(g, actA({ t: "theater", g }), "Invocar")));
    case "senate": {
      const n = pen.n, what = pen.allow === "place" ? "coloca 1 influencia" : pen.allow === "move" ? "mueve 1 influencia tuya a una cámara vecina" : "coloca influencia o mueve una tuya a una cámara vecina";
      const sub = `${n > 1 ? `Te quedan ${n} acciones: ` : ""}${what}${pen.sec && pen.allow !== "move" ? ` (colocar solo en la sección ${SEC_N[pen.sec]})` : ""}.`;
      const endB = `<button class="btn ghost" ${actA({ t: "senate", op: "end" })}>${pen.opt ? "No mover" : "Terminar aquí"}</button>`;
      if (k.from !== undefined && k.from !== null) return head("🏛️ Senado", `Mueves desde la cámara ${k.from + 1}: elige a qué cámara vecina.`) + chamberGrid(s, pi, i => Math.abs(i - k.from) === 1 ? actA({ t: "senate", op: "move", from: k.from, to: i }) : null) + `<button class="btn ghost sm" ${pickA({ from: null })}>Cancelar</button>`;
      let h = head("🏛️ Senado", sub[0].toUpperCase() + sub.slice(1));
      if (pen.allow !== "move" && p.cubes > 0) h += `<p class="lbl2" style="text-align:left">Colocar en…</p>` + chamberGrid(s, pi, i => !pen.sec || M.SECTIONS[pen.sec].includes(i) ? actA({ t: "senate", op: "place", ch: i }) : null);
      if (pen.allow !== "place" && M.cubesOn(s, pi) > 0) h += `<p class="lbl2" style="text-align:left">O mover desde…</p>` + chamberGrid(s, pi, i => s.ag.ch[i].c[pi] > 0 ? pickA({ from: i }) : null);
      return h + `<div class="acts">${endB}</div>`;
    }
    case "purga": return head("🧹 Quitar influencia", `Elige una cámara con influencia de ${esc(nameOf(1 - pen.who))}: le quitas 1.`) + chamberGrid(s, pi, i => s.ag.ch[i].c[1 - pi] > 0 ? actA({ t: "purga", ch: i }) : null);
    case "cons": return head("🗝️ Conspirador", "Elige: colocar 1 influencia en cualquier cámara o conspirar.") + (p.cubes > 0 ? chamberGrid(s, pi, i => actA({ t: "cons", op: "place", ch: i })) : "") + `<div class="acts"><button class="btn gold" ${actA({ t: "cons", op: "conspire" })}${s.ag.deck.length ? "" : " disabled"}>Conspirar${s.ag.deck.length ? "" : " (no quedan)"}</button></div>`;
    case "drawc": {
      const crimen = p.tokens.includes("crimen"), bottom = !!k.bottom;
      const rows = pen.opts.map(id => { const C = CONSPS[id]; return `<div class="li"><span style="font-size:24px">${C.e}</span><div class="t"><b>${esc(C.n)}</b><span>${esc(C.d)}</span></div><button class="btn gold sm" ${actA({ t: "drawc", keep: id, bottom })}>Quedármela</button></div>`; });
      return head("🗝️ Conspirar", "Te quedas una en secreto. Para usarla tendrás que prepararla con una carta de la pirámide.") + list(rows) + `<div class="acts">${crimen ? `<button class="btn gold" ${actA({ t: "drawc", keep: "both" })}>Me quedo las dos (Crimen organizado)</button>` : ""}${pen.opts.length > 1 ? `<button class="btn ghost sm" ${pickA({ bottom: !bottom })}>La otra vuelve ${bottom ? "al fondo" : "arriba"} del mazo · cambiar</button>` : ""}</div>`;
    }
    case "curia": return head("🏛️ Curia Julia", "Desvela gratis una conspiración sin preparar.") + list(p.consp.filter(x => !x.prep && !x.used).map(x => { const C = CONSPS[x.id]; return `<div class="li"><span style="font-size:24px">${C.e}</span><div class="t"><b>${esc(C.n)}</b><span>${esc(C.d)}</span></div><button class="btn gold sm" ${actA({ t: "curia", id: x.id })}>Desvelar</button></div>`; }));
    case "coaccion": {
      const ok = id => ["blue", "green"].includes(CARDS[id].col) && o.cards.some(t => CARDS[t].col === CARDS[id].col);
      if (!k.mine) return head("🔄 Coacción", "Elige la carta tuya (azul o verde) que vas a entregar.") + list(p.cards.filter(ok).map(id => cardRow(id, pickA({ mine: id }), "Entregar")));
      return head("🔄 Coacción", `Entregas ${esc(CARDS[k.mine].n)}. ¿Qué carta del mismo color te llevas?`) + list(o.cards.filter(t => CARDS[t].col === CARDS[k.mine].col).map(id => cardRow(id, actA({ t: "coaccion", mine: k.mine, theirs: id }), "Llevármela"))) + `<button class="btn ghost sm" ${pickA({ mine: null })}>Cambiar</button>`;
    }
    case "oscuro": return head("🌑 Oscurantismo", "Saca del juego una ficha de progreso de la mesa o del rival.") + (s.tokens.length ? `<p class="lbl2" style="text-align:left">En la mesa</p>` + list(s.tokens.map(t => tokRow(t, actA({ t: "oscuro", id: t }), "Sacar"))) : "") + (o.tokens.length ? `<p class="lbl2" style="text-align:left">Del rival</p>` + list(o.tokens.map(t => tokRow(t, actA({ t: "oscuro", id: t }), "Sacar"))) : "");
    case "vuelco": return head("🌀 Vuelco", `Manda al descarte una carta libre de la pirámide${pen.left < 2 ? " más, si quieres" : " (luego puedes otra)"}.`) + list(s.slots.map((t, i) => M.accessible(s, i) ? cardRow(t.c, actA({ t: "vuelco", slot: i }), "Descartar") : "")) + `<div class="acts"><button class="btn ghost" ${actA({ t: "vuelco", skip: true })}>No descartar ${pen.left < 2 ? "más" : "nada"}</button></div>`;
    case "reforma": {
      if (k.from === undefined || k.from === null) return head("📜 Reforma", "Elige la cámara de la que sale el decreto.") + chamberGrid(s, pi, i => s.ag.ch[i].dec.length ? pickA({ from: i }) : null);
      return head("📜 Reforma", `Mueves ${esc(DECREES[s.ag.ch[k.from].dec[0].id].n)}: elige la cámara de destino.`) + chamberGrid(s, pi, i => i !== k.from ? actA({ t: "reforma", from: k.from, to: i }) : null) + `<button class="btn ghost sm" ${pickA({ from: null })}>Cambiar</button>`;
    }
  }
  return "";
}

/* ---------- reglas ---------- */
const RULE_TABS = [["base", "Básico"], ["pan", "Panteón"], ["ag", "Ágora"], ["both", "Las dos"], ["tips", "Primera partida"]];
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>`;
function rulesBody(tab) {
  if (tab === "base") return `
    <p>Cada uno elige <b>4 maravillas</b> por turnos. Después se juegan <b>3 eras</b>, cada una con 20 cartas colocadas en una figura; solo puedes coger cartas que no tengan otra encima.</p>
    <p>En tu turno coges una carta libre y: la <b>construyes</b> pagando su coste, la <b>descartas</b> por 2 monedas (+1 por cada carta amarilla tuya) o la usas para <b>construir una maravilla</b>.</p>
    <p>Lo que no produces lo compras al banco a <b>2 monedas + 1 por cada unidad que produzca tu rival</b>. Algunas cartas son <b>gratis por encadenamiento</b> 🔗.</p>
    <p>Dos símbolos científicos iguales te dan una <b>ficha de progreso</b>. Los escudos 🛡️ mueven el ejército; al pasar las fichas de botín el rival pierde monedas.</p>
    <h4>Cómo se gana</h4>${ul(["<b>Militar</b>: tu ejército llega a la capital rival.", "<b>Científica</b>: reúnes 6 símbolos científicos distintos.", "<b>Civil</b>: más puntos al acabar la Era III (empate: más puntos azules)."])}
    <p class="muted small">Solo se construyen 7 de las 8 maravillas: la última se queda sin hacer.</p>`;
  if (tab === "pan") {
    const gods = Object.keys(MYTHS).map(m => `<li><b>${MYTHS[m].e} ${MYTHS[m].n}</b>: ${Object.values(GODS).filter(g => g.m === m).map(g => `${g.e} ${g.n} (${g.d.replace(/\.$/, "")})`).join(" · ")}</li>`).join("");
    return `
    <p>Añade <b>dioses</b> de 5 mitologías que se invocan desde el tablero del <b>Panteón</b>, ofrendas para abaratarlos, <b>Grandes Templos</b> en la Era III, 2 maravillas y 3 fichas de progreso nuevas.</p>
    <h4>Era I · colocar dioses</h4>
    <p>Hay 5 <b>fichas de mitología</b> encima de cartas boca abajo. Si al coger una carta destapas una que tiene ficha, te la quedas: miras los 2 primeros dioses de esa mitología y pones <b>uno</b> boca abajo en una casilla libre del Panteón.</p>
    <h4>Era II · ofrendas e invocar</h4>
    <p>Al empezar la Era II se revelan todos los dioses y la casilla vacía se llena con <b>La Puerta</b> 🚪. Hay 3 <b>ofrendas</b> (descuentos de 2, 3 y 4 monedas) sobre cartas boca abajo: se consiguen igual que las fichas de mitología.</p>
    <p>Desde ahora, en tu turno puedes <b>invocar un dios en vez de coger una carta</b>: pagas el precio de su casilla (de 3 a 8 monedas; lo barato para uno es caro para el otro) menos las ofrendas que quieras gastar, y aplicas su efecto.</p>
    <p><b>La Puerta</b> cuesta el doble: se revela el primer dios de cada mitología y eliges uno, que invocas gratis.</p>
    <h4>Era III · Grandes Templos</h4>
    <p>Los gremios se cambian por 3 <b>Grandes Templos</b> ⛩️. Son gratis si tienes la ficha de esa mitología <b>con templo</b> (la que lleva ⛩); si no, se pagan con recursos. Al final: 1 templo <b>5★</b>, 2 templos <b>12★</b>, 3 templos <b>21★</b>.</p>
    <h4>Los dioses</h4><ul>${gods}</ul>
    <h4>Novedades</h4>${ul([`${WONDERS.santuario.e} <b>${WONDERS.santuario.n}</b>: los dioses te cuestan 2 monedas menos y juegas otro turno.`, `${WONDERS.teatro_divino.e} <b>${WONDERS.teatro_divino.n}</b>: invocas gratis cualquier dios que quede en los mazos.`, ...["misticismo", "poliorcetica", "ingenieria"].map(t => `${TOKENS[t].e} <b>${TOKENS[t].n}</b>: ${TOKENS[t].d}`)])}`;
  }
  if (tab === "ag") return `
    <p>Añade el <b>Senado</b>, 13 <b>senadores</b> repartidos por las eras, <b>decretos</b>, <b>conspiraciones</b>, 2 maravillas, 2 fichas de progreso y una victoria nueva: la <b>política</b>.</p>
    <h4>El Senado</h4>
    <p>Tiene 6 cámaras con un decreto cada una (algunos empiezan boca abajo y se revelan al poner influencia ahí). <b>Controlas</b> una cámara si tienes más influencia que el rival: su decreto te beneficia mientras la controles y al final da <b>1, 2, 3, 3, 2, 1★</b> de izquierda a derecha. Cada uno tiene 12 influencias.</p>
    <h4>Senadores</h4>
    <p>Salen en la pirámide con reverso propio (5 en la Era I, 5 en la II y 3 en la III). Reclutar uno cuesta <b>1 moneda por cada senador que ya tengas</b> (el primero es gratis).</p>
    ${ul(["<b>Políticos</b> 🎗️: haces 1, 2 o 3 acciones según tus cartas azules (0-1, 2-3, 4+). Cada acción: colocar 1 influencia en la sección del senador o mover 1 tuya a una cámara vecina.", "<b>Conspiradores</b> 🗝️: colocas 1 influencia en cualquier cámara o <b>conspiras</b>."])}
    <h4>Conspiraciones</h4>
    <p>Al conspirar robas 2 conspiraciones y te quedas 1 en secreto (la otra vuelve arriba o al fondo del mazo). Para usarla, primero la <b>preparas</b>: en tu turno coges una carta de la pirámide y la pones debajo, en vez de construirla o descartarla. En un turno posterior, <b>al principio de tu turno</b>, puedes desvelarla (una por turno) y después juegas normal.</p>
    <h4>Botín militar</h4>
    <p>Las fichas de botín siguen quitando monedas y además: la pequeña te deja <b>colocar 1 influencia</b> y la grande <b>quitar 1 influencia</b> del rival.</p>
    <h4>Victoria política</h4><p>Si controlas <b>las 6 cámaras a la vez</b>, ganas al instante.</p>
    <h4>Decretos</h4>${ul(Object.values(DECREES).map(d => `${d.e} <b>${d.n}</b>: ${d.d}`))}
    <h4>Conspiraciones</h4>${ul(Object.values(CONSPS).map(d => `${d.e} <b>${d.n}</b>: ${d.d}`))}
    <h4>Novedades</h4>${ul([`${WONDERS.curia_julia.e} <b>${WONDERS.curia_julia.n}</b>: al elegirla conspiras; al construirla ganas 6 monedas, desvelas gratis una conspiración sin preparar y juegas otro turno.`, `${WONDERS.knossos.e} <b>${WONDERS.knossos.n}</b>: al elegirla colocas 1 influencia; al construirla colocas otra, puedes mover 1 y da 3★.`, ...["corrupcion", "crimen"].map(t => `${TOKENS[t].e} <b>${TOKENS[t].n}</b>: ${TOKENS[t].d}`)])}`;
  if (tab === "both") return `
    <p>Las dos expansiones se juntan sin reglas extra:</p>
    ${ul(["Las 8 maravillas se sortean entre las 16 y las fichas de progreso entre las 15.", "En la Era III no hay gremios (se cambian por los Grandes Templos) y además salen los 3 senadores.", "Las monedas de Astarté 🌙 sirven también para reclutar senadores.", "Se puede ganar por supremacía militar, científica, política o por puntos."])}
    <p>Es la partida más larga y con más interacción. Recomendable cuando ya hayáis jugado cada una por separado.</p>`;
  return `
    <div class="tip"><b>Para empezar</b><p>Probad primero una sola expansión. <b>Panteón</b> es la más fácil de aprender; <b>Ágora</b> cambia más la forma de jugar.</p></div>
    <h4>Panteón</h4>${ul(["En la Era I, coger cartas que destapan fichas de mitología casi siempre compensa: eliges dioses y puedes ganar un templo gratis.", "Fíjate en la casilla donde pones cada dios: el precio cambia para cada jugador.", "Guarda las ofrendas para un dios caro o para La Puerta.", "Invocar ocupa el turno entero, pero no coges carta: úsalo cuando la pirámide no te dé nada bueno."])}
    <h4>Ágora</h4>${ul(["Las cartas azules ahora valen doble: dan más acciones en el Senado.", "Prepara conspiraciones con cartas que no te sirvan o que no quieras dejarle al rival.", "Vigila el Senado: si el rival controla 5 cámaras está a una de ganar.", "Desvelar una conspiración no gasta tu turno: se hace al principio y luego juegas."])}
    <h4>En la app</h4>${ul(["Toca cualquier dios, cámara, carta o maravilla para ver qué hace.", "Durante una elección puedes pulsar «Ver la mesa» y volver con «Elegir».", "El botón 📖 abre estas reglas en cualquier momento."])}
    <p class="muted small">Adaptación propia: algunos valores (precios del Panteón, Grandes Templos, decretos y conspiraciones) son aproximados al juego original.</p>`;
}
function rulesHTML(sel) {
  const tab = sel.tab || "base";
  const intro = sel.intro ? `<div class="tip"><b>Primera partida con ${tab === "pan" ? "Panteón" : "Ágora"}</b><p>Un repaso rápido antes de jugar. Lo puedes volver a ver con el botón 📖.</p></div>` : "";
  return `<div class="sh-h"><h3>📖 Reglas</h3>${sel.intro ? "" : xBtn}</div>${intro}
    <div class="tabs" role="tablist">${RULE_TABS.map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k === tab}">${n}</button>`).join("")}</div>
    <div class="rules">${rulesBody(tab)}</div>${sel.intro ? `<button class="btn gold wide" id="introok">¡A jugar!</button>` : ""}`;
}
