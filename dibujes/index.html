<style>
/* Layout: una columna; carta de 3 partes arriba, lienzo cuadrado blanco, herramientas debajo */
:root{
  --bg:#151A2E; --bg-2:#1D2340; --panel:#232A4A; --panel-2:#2D355C; --line:#3B4470;
  --ink:#F4F6FF; --muted:#A9B0D3; --pink:#FF4F8B; --yellow:#FFD23F; --cyan:#3EC6FF; --ok:#4BE3A0; --bad:#FF6B6B;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(110% 60% at 50% -10%,#3B2353,var(--bg) 65%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:14px 36px;display:flex;flex-direction:column;gap:12px}
#app>.st-franja{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}

.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 18px;background:var(--panel-2);color:var(--ink);font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.pink{background:var(--pink);color:#fff}
.btn.yel{background:var(--yellow);color:#2B2100}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px}
input.text{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg-2);padding:0 14px;font-size:18px;font-weight:600}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:24px;text-align:center}
label.lbl,.lbl{display:grid;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:14px 4px}
.logo{font-family:var(--display);font-size:clamp(40px,12vw,64px);line-height:.92;letter-spacing:-.01em}
.logo span{color:var(--pink)}
.logo small{display:block;font-family:var(--hand);font-size:.5em;letter-spacing:0;color:var(--yellow);margin-top:4px;transform:rotate(-3deg)}
.brush{width:110px;height:70px}
.card{background:var(--panel);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.card h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.how{display:grid;gap:8px;font-size:15px}
.how b{color:var(--yellow)}
.how ol{margin:0;padding-left:20px;display:grid;gap:6px}
summary{cursor:pointer;font-weight:800;min-height:28px}
.msg{min-height:1.4em;color:var(--yellow);text-align:center;font-weight:700}
.msg.err{color:var(--bad)}
.modes{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.mode{appearance:none;border:0;border-radius:18px;padding:16px 14px;background:var(--panel);text-align:left;display:grid;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.mode b{font-family:var(--display);font-weight:400;font-size:17px;text-transform:uppercase}
.mode span{color:var(--muted);font-size:13.5px}
.mode[aria-pressed="true"]{background:var(--pink)}
.mode[aria-pressed="true"] span{color:#FFE3EC}
@media (max-width:360px){.modes{grid-template-columns:1fr}}

.top{display:flex;align-items:center;gap:8px}
.chip{font-family:var(--display);font-size:14px;letter-spacing:.12em;background:var(--panel);padding:6px 12px;border-radius:999px;white-space:nowrap}
.top .sp{flex:1}
.big-code{font-family:var(--display);font-size:56px;letter-spacing:.18em;line-height:1;text-align:center;color:var(--yellow)}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:12px;padding:8px 10px;font-weight:700;min-width:0}
.plist li span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.plist li.turn{box-shadow:inset 0 0 0 2px var(--yellow)}
.av{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:14px;color:#151A2E;background:var(--c,#fff)}
.tick{color:var(--ok);font-weight:900}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:0;border-radius:10px;min-height:42px;min-width:46px;padding:0 12px;background:var(--bg-2);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--yellow);color:#2B2100}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;min-height:40px}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}
.names{display:grid;gap:8px}
.names .nrow{display:flex;gap:8px;align-items:center}
.names .nrow input{flex:1}
.names .nrow button{flex:0 0 44px;min-height:44px;border-radius:12px;border:0;background:var(--bg-2);font-weight:900}

/* carta: personaje + acción + lugar */
.combo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;background:#FFF8E7;color:#1C1C28;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.combo .part{display:contents}
.combo .part i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A7F66}
.combo .part b{font-family:var(--hand);font-size:28px;line-height:1.05}
.combo.mini{transform:none;padding:10px 12px;gap:0 10px}
.combo.mini .part b{font-size:22px}
.cover{border-radius:18px;min-height:150px;display:grid;place-items:center;text-align:center;padding:20px;background:repeating-linear-gradient(135deg,#2A3157 0 14px,#262C50 14px 28px);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;gap:6px}

/* lienzo */
.padwrap{position:relative;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);aspect-ratio:1/1;width:100%;max-width:min(100%,50vh);margin-inline:auto}
#pad{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padwrap.locked::after{content:"";position:absolute;inset:0;background:rgba(21,26,46,.18)}
.tools{display:grid;gap:8px}
.colors{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.colors button{appearance:none;width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.colors button[aria-pressed="true"]{border-color:var(--yellow);transform:scale(1.12)}
.trow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.trow button{appearance:none;border:0;border-radius:10px;min-height:42px;min-width:44px;padding:0 10px;background:var(--bg-2);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.trow button[aria-pressed="true"]{background:var(--yellow);color:#2B2100}
.dot{display:inline-block;border-radius:50%;background:currentColor}
.timer{font-family:var(--display);font-size:22px;color:var(--yellow);font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--bad)}
.drawing{width:100%;max-width:min(100%,50vh);margin-inline:auto;aspect-ratio:1/1;border-radius:16px;background:#fff;object-fit:contain;display:block;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.drawing.empty{display:grid;place-items:center;color:#777;font-weight:700}

/* adivinar */
.opts{display:grid;gap:6px}
.opts .og{display:grid;gap:6px}
.opts .og>span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opts .ob{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts .ob button{appearance:none;border:0;border-radius:12px;min-height:50px;padding:6px 10px;background:var(--bg-2);font-weight:700;text-align:left;line-height:1.2}
.opts .ob button[aria-pressed="true"]{background:var(--cyan);color:#06263A}
.opts .ob button.right{background:var(--ok);color:#06301E}
.opts .ob button.wrong{background:var(--bad);color:#300}

/* resultados */
.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res li{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--bg-2);border-radius:12px;padding:8px 12px}
.res li .pts{font-family:var(--display);color:var(--yellow)}
.res li .marks{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.res li .marks span{padding:2px 8px;border-radius:8px;background:rgba(255,107,107,.18);color:#FFC2C2}
.res li .marks span.ok{background:rgba(75,227,160,.18);color:#B8F5D9}
.drinks{display:grid;gap:6px;background:linear-gradient(135deg,#3A2A10,#2B2240);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2px #6B5320}
.drinks p{font-weight:700}
.drinks b{color:var(--yellow)}
.scores{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.scores li{display:flex;gap:10px;align-items:center;background:var(--bg-2);border-radius:12px;padding:8px 12px;font-weight:700}
.scores li .p{margin-left:auto;font-family:var(--display);color:var(--yellow)}
.scores li .t{color:var(--muted);font-size:13px;font-weight:600}
.scores li.last{box-shadow:inset 0 0 0 2px var(--bad)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;display:grid;gap:6px}
.gallery figcaption{font-size:13px;line-height:1.25}
.gallery figcaption b{display:block}
.verdict{text-align:center;display:grid;gap:8px;padding:6px 0}
.verdict .big{font-family:var(--display);font-size:32px;line-height:1.05}
.menu{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>

<body>
<div id="app"><div class="hero"><div class="logo">TRAZOS <span>Y</span> TRAGOS</div><p class="muted">Cargando…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const CARDS = window.DIBUJES_CARTAS || { p: [], a: [], l: [], pp: [], ap: [], lp: [] };
const PCOL = ["#FF6B8A", "#5AB8FF", "#FFD166", "#4BE3A0", "#C59BFF", "#FF9F5A", "#7EE8E0", "#F2A7D8", "#B8E86B", "#FFFFFF", "#E8C07E", "#9AA8FF"];
const MAX_PLAYERS = 12, MAX_LOCAL = 10;
const PARTS = [["p", "Personaje"], ["a", "Acción"], ["l", "Lugar"]];
const BRUSH_SVG = `<svg class="brush" viewBox="0 0 110 70" aria-hidden="true"><path d="M8 52c14-30 30-36 40-22s22 10 30-8" fill="none" stroke="#FF4F8B" stroke-width="7" stroke-linecap="round"/><path d="M70 10l26 26-8 8-26-26z" fill="#FFD23F"/><path d="M62 18l8-8 4 4-8 8z" fill="#F4F6FF"/><path d="M88 44c6 6 8 14 2 18s-14 0-14-8z" fill="#3EC6FF"/></svg>`;
const DEF_CFG = { time: 90, gtime: 60, rounds: 2, spicy: false, drinks: true };

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const $app = document.getElementById("app");
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }
const clock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

/* ================= cartas, reparto y puntuación (común a los dos modos) ================= */
function decks(cfg) {
  const d = { p: [...CARDS.p], a: [...CARDS.a], l: [...CARDS.l] };
  if (cfg.spicy) { d.p.push(...CARDS.pp); d.a.push(...CARDS.ap); d.l.push(...CARDS.lp); }
  return d;
}
/* una carta por jugador sin repetir en la ronda (y evitando las ya usadas), con 3 opciones trampa por parte */
function deal(n, cfg, used) {
  const d = decks(cfg), taken = new Set(used || []), out = [];
  const draw = key => {
    let pool = d[key].filter(x => !taken.has(x));
    if (!pool.length) pool = d[key].filter(x => !out.some(c => c[key] === x));
    if (!pool.length) pool = d[key];
    const x = pick(pool); taken.add(x); return x;
  };
  for (let i = 0; i < n; i++) {
    const c = { p: draw("p"), a: draw("a"), l: draw("l") };
    c.o = {};
    PARTS.forEach(([k]) => { c.o[k] = shuffle([c[k], ...shuffle(d[k].filter(x => x !== c[k])).slice(0, 3)]); });
    out.push(c);
  }
  return out;
}
function usedFrom(list, prev) { return [...(prev || []), ...list.flatMap(c => [c.p, c.a, c.l])].slice(-240); }
/* guesses: [{u, g:{p,a,l}|null}] -> resultados, puntos del dibujante y tragos */
function judge(drawer, ans, guesses, cfg) {
  const res = guesses.map(x => {
    const ok = {}; PARTS.forEach(([k]) => { ok[k] = !!(x.g && x.g[k] === ans[k]); });
    return { u: x.u, g: x.g || null, ok, n: PARTS.filter(([k]) => ok[k]).length };
  });
  const avg = res.length ? res.reduce((s, r) => s + r.n, 0) / res.length : 0;
  const dp = res.filter(r => r.n >= 2).length;
  const drinks = [];
  if (cfg.drinks) {
    res.forEach(r => {
      if (r.n === 0) drinks.push({ u: r.u, t: "bebe 1 trago: no ha acertado nada", sip: 1 });
      if (r.n === 3) drinks.push({ u: r.u, t: "reparte 1 trago: ¡pleno!", give: 1 });
    });
    if (res.length && avg < 1) drinks.push({ u: drawer, t: "bebe 1 trago: su dibujo no lo entiende nadie", sip: 1 });
  }
  return { res, dp, drinks };
}
function applyScores(scores, sips, drawer, j) {
  scores[drawer] = (scores[drawer] || 0) + j.dp;
  j.res.forEach(r => { scores[r.u] = (scores[r.u] || 0) + r.n; });
  j.drinks.forEach(d => { if (d.sip) sips[d.u] = (sips[d.u] || 0) + d.sip; });
}

/* ================= lienzo ================= */
const INK = ["#1C1C28", "#E53935", "#1E88E5", "#43A047", "#FDD835", "#FB8C00", "#8E24AA", "#F48FB1", "#8D6E63", "#9E9E9E"];
const SIZES = [[5, 6], [12, 11], [26, 18]];
const PAD = { strokes: [], color: INK[0], w: 12, erase: false, cur: null, cv: null, ctx: null, locked: false, key: "" };
function padReset(key) { PAD.strokes = []; PAD.cur = null; PAD.key = key; PAD.locked = false; }
function padAttach() {
  const cv = document.getElementById("pad");
  if (!cv) { PAD.cv = null; return; }
  if (PAD.cv === cv) return;
  PAD.cv = cv; PAD.ctx = cv.getContext("2d");
  padSize();
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; };
  cv.addEventListener("pointerdown", e => {
    if (PAD.locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    PAD.cur = { c: PAD.erase ? "#FFFFFF" : PAD.color, w: PAD.erase ? 40 : PAD.w, pts: [pos(e)] };
    PAD.strokes.push(PAD.cur); strokeDraw(PAD.ctx, PAD.cur, cv.width / 1000, PAD.cur.pts.length - 1);
  });
  cv.addEventListener("pointermove", e => {
    if (!PAD.cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach(ev => {
      const p = pos(ev), last = PAD.cur.pts[PAD.cur.pts.length - 1];
      if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 3) return;
      PAD.cur.pts.push(p); strokeDraw(PAD.ctx, PAD.cur, cv.width / 1000, PAD.cur.pts.length - 2);
    });
  });
  const end = () => { PAD.cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("lostpointercapture", end);
}
function padSize() {
  const cv = PAD.cv; if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const px = Math.max(200, Math.round(r.width * dpr));
  if (cv.width !== px) { cv.width = px; cv.height = px; }
  padRedraw();
}
function padRedraw() {
  const cv = PAD.cv; if (!cv) return;
  const ctx = PAD.ctx; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  PAD.strokes.forEach(s => strokeDraw(ctx, s, cv.width / 1000, -1));
}
/* from = -1 dibuja el trazo entero; si no, solo el tramo desde ese punto */
function strokeDraw(ctx, s, k, from) {
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineWidth = s.w * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const P = s.pts;
  if (P.length === 1 || (from >= 0 && from === 0 && P.length === 1)) { ctx.beginPath(); ctx.arc(P[0][0] * k, P[0][1] * k, s.w * k / 2, 0, Math.PI * 2); ctx.fill(); return; }
  const a = from < 0 ? 0 : from;
  ctx.beginPath(); ctx.moveTo(P[a][0] * k, P[a][1] * k);
  for (let i = a + 1; i < P.length; i++) ctx.lineTo(P[i][0] * k, P[i][1] * k);
  ctx.stroke();
}
function padExport() {
  const c = document.createElement("canvas"); c.width = 480; c.height = 480;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 480, 480);
  PAD.strokes.forEach(s => strokeDraw(ctx, s, .48, -1));
  return PAD.strokes.length ? c.toDataURL("image/jpeg", .75) : "";
}
window.addEventListener("resize", () => padSize());
function padHTML() {
  return `<div class="padwrap"><canvas id="pad" aria-label="Lienzo para dibujar"></canvas></div>
  <div class="tools">
    <div class="colors">${INK.map(c => `<button type="button" style="--c:${c}" aria-label="Color" aria-pressed="false" data-on="click:ink:${c}"></button>`).join("")}</div>

/* ---------- anfitrión ---------- */
async function dealRound(g) {

  const map = {}, opts = {};
  g.order.forEach((u, i) => { const c = combos[i]; map[u] = { p: c.p, a: c.a, l: c.l }; opts[u] = c.o; });
  await Promise.all(g.order.map(u => S.db.doc(secPath(u, g.gid, g.round)).set(map[u])));
  await S.db.doc(allPath(g.gid, g.round)).set(map);

  g.opts = opts; g.used = usedFrom(combos, g.used);

  S.busy = true; render();

  try { await dealRound(g); } catch { S.busy = false; toast("No se pudo repartir. Revisa la conexión."); render(); return; }
  S.busy = false;

}

}

  if (g.round >= g.cfg.rounds) { g.status = "end"; g.phase = "end"; }
  else g.phase = "round";
}
function drive() {
  if (!isHost() || !S.g || S.g.status !== "play" || !S.all) return;
  const g0 = S.g, now = sNow(), A = u => actOf(g0, u);
  if (S.driving === g0.k) return;
  const g = clone(g0);
  switch (g0.phase) {
    case "draw":
      if (g0.order.every(A) || now >= g0.until + 8000) { S.driving = g0.k; toGuess(g, 0); return commit(g).finally(() => { S.driving = ""; }); }
      return;
    case "guess": {
      const d = g0.order[g0.i], gs = g0.order.filter(u => u !== d);
      if (!(gs.every(A) || now >= g0.until + GRACE)) return;

      g.phase = "show"; g.k = `${g.gid}|s${g.round}-${g.i}`; g.until = null;
      g.ans = ans; g.res = j.res; g.drinks = j.drinks; g.dp = j.dp;

async function hostNext() {

    try { await dealRound(g); } catch { S.busy = false; toast("No se pudo repartir."); render(); return; }
    S.busy = false;
  } else if (g.phase === "draw") { if (g.until - 3000 <= sNow()) toGuess(g, 0); else g.until = sNow() + 3000; }
  else if (g.phase === "guess") { g.until = sNow() - 1 - GRACE; S.g = g; return drive(); }

  else if (L.step === "draw") body = `${lt(d, "Dibuja tu carta antes de que se acabe el tiempo", `d${L.r}-${L.i}`)}<div class="top"><span class="timer" data-until="${L.until}"></span></div>
      ${comboHTML(L.cur, true)}${padHTML()}<button class="btn pink wide" data-on="click:done">He terminado</button>`;
  else if (L.step === "gpass") { const u = lGuessers()[L.gi]; lt(u, "Coge el móvil para adivinar", `g${L.r}-${L.i}-${L.gi}`); body = `<div class="card center pop"><p class="muted">Ha dibujado ${esc(lName(d))}</p><h2 style="font-size:26px">Pasa el móvil a ${esc(lName(u))}</h2>
      <p class="muted">${L.gi ? "Que no vea lo que han elegido los demás." : `${esc(lName(d))}, no digas nada.`}</p></div>
      <button class="btn pink wide" data-on="click:lgsee">Soy ${esc(lName(u))}: adivinar</button>`; }
  else if (L.step === "guess") { const u = lGuessers()[L.gi]; body = `${lt(u, `Adivina el dibujo de ${lName(d)}`, `g${L.r}-${L.i}-${L.gi}`)}
      ${imgHTML(L.img)}${optsHTML(L.cur.o, S.sel)}<button class="btn pink wide" data-on="click:guess">Confirmar</button>`; }
  else if (L.step === "show") body = showHTML({ src: L.img, drawer: d, ans: L.cur, res: L.j.res, drinks: L.j.drinks, dp: L.j.dp, nameOf: lName, av: lAv })
      + `<button class="btn pink wide" data-on="click:lnext">${L.i + 1 < L.order.length ? "Siguiente dibujo" : L.r >= L.cfg.rounds ? "Ver el final" : "Fin de la ronda"}</button>`;
  else if (L.step === "round") body = `<div class="card verdict pop"><div class="big">Fin de la ronda ${L.r}</div></div>
      ${scoresHTML(ids, L.scores, L.sips, lName, lAv, false, L.cfg)}${galleryHTML(L.gallery, u => (L.gallery.find(x => x.u === u) || {}).img || "", lName)}
      <button class="btn pink wide" data-on="click:lnext">Siguiente ronda</button>`;
  else if (L.step === "end") body = `${endHTML(ids, L.scores, L.sips, lName, lAv, L.cfg)}${galleryHTML(L.gallery, u => (L.gallery.find(x => x.u === u) || {}).img || "", lName)}
      <div class="row"><button class="btn pink" data-on="click:lagain">Otra partida</button><button class="btn ghost" data-on="click:lquit">Salir</button></div>`;
  view(top + body);
}

window.__dib = { S, PAD, deal, judge, drive, decks };
boot();
})();
