/* juez en modo local */
function localJudgeCtx() {
  const L = S.L, answers = {};
  L.players.forEach((p) => { answers[p.id] = L.answers[p.id] || []; });
  return { letter: L.round.letter, cats: L.round.cats, cfg: L.cfg, ids: L.players.map((p) => p.id), answers, votes: {} };
}
async function localJudge(appeal) {
  const L = S.L; if (!L || !judgeReady()) return;
  const n = L.n;
  S.judgeL = { busy: true, appeal: !!appeal }; refresh();
  try {
    const ctx = localJudgeCtx();
    if (appeal) { ctx.keys = [appeal.k]; ctx.appeal = appeal; }
    const got = await askJudge(ctx);
    if (!S.L || S.L.n !== n) return;
    L.rulings = Object.assign({}, L.rulings || {}, got);
    if (appeal) { delete L.decisions[appeal.k]; toast(got[appeal.k] ? (got[appeal.k].v === "v" ? "El juez acepta la apelación: vale." : "El juez mantiene que no vale.") : "El juez no ha respondido a la apelación."); }
    saveLocal(); S.judgeL = null;
  } catch (e) { S.judgeL = { err: judgeErrText(e) }; }
  refresh();
}

/* juez online: el veredicto se guarda en la sala para que todos lo vean */
function onlineJudgeCtx() {
  const R = S.R, ids = playersOf(R).map((p) => p.id), answers = {}, votes = {};
  ids.forEach((id) => { answers[id] = (S.ans[id] && S.ans[id].t) || []; votes[id] = id === S.uid ? S.myVotes : (S.vot[id] || {}); });
  return { letter: R.round.letter, cats: R.round.cats, cfg: R.cfg, ids, answers, votes };
}
async function onlineJudge(appeal) {
  const R = S.R; if (!R || !judgeReady() || S.judgeBusy) return;
  const n = R.n, gen = R.gen;
  S.judgeBusy = true; S.judgeErr = "";
  roomUpdate({ judging: { n, gen, appeal: !!appeal, by: S.uid, at: sNow() } }).catch(() => {});
  refresh();
  try {
    const ctx = onlineJudgeCtx();
    if (appeal) { ctx.keys = [appeal.k]; ctx.appeal = appeal; }
    const got = await askJudge(ctx);
    if (!S.R || S.R.n !== n || S.R.gen !== gen) return;
    const patch = { rulings: { [n]: got }, judging: null };
    if (appeal && got[appeal.k]) patch.appeals = { [n]: { [appeal.k]: { by: S.uid, arg: G.clean(appeal.arg, G.LIMITS.reason), v: got[appeal.k].v } } };
    await roomUpdate(patch, "guardar el veredicto");
    if (appeal) toast(got[appeal.k] ? (got[appeal.k].v === "v" ? "El juez acepta la apelación: vale." : "El juez mantiene que no vale.") : "El juez no ha respondido a la apelación.");
  } catch (e) {
    S.judgeErr = judgeErrText(e);
    roomUpdate({ judging: null }).catch(() => {});
  }
  S.judgeBusy = false; refresh();
}
function onlineJudgeState() {
  const R = S.R, j = R.judging;
  const busy = S.judgeBusy || (j && j.n === R.n && j.gen === R.gen && sNow() - (j.at || 0) < 90000);
  return { busy, appeal: !!(j && j.appeal), err: S.judgeErr };
}
// El anfitrión pide el veredicto automáticamente cuando ya han llegado todas las respuestas.
function maybeAutoJudge() {
  const R = S.R;
  if (!isHost() || !judgeOn(R.cfg) || !judgeReady() || S.judgeBusy) return;
  if (S.autoJudgedRk === S.subRk) return;
  const ps = playersOf(R);
  if (ps.some((p) => !S.ans[p.id])) return;
  if (((R.rulings || {})[R.n]) && Object.keys(R.rulings[R.n]).length) { S.autoJudgedRk = S.subRk; return; }
  S.autoJudgedRk = S.subRk;
  onlineJudge(null);
}

  newOnline() { startSetup("online"); },
  newLocal() { startSetup("local"); },
  resumeLocal() { show("local"); },
  openRoom(el) { openRoom(el.dataset.code); },

  // configuración
  setupNext() { S.setup.step++; S.sig = ""; render(); window.scrollTo(0, 0); },
  setupPrev() { S.setup.step--; S.sig = ""; render(); },
  setupCancel() { S.setup = null; S.screen = "room"; S.sig = ""; render(); },
  setupFinish: finishSetup,
  step(el) {
    const c = S.setup.cfg, k = el.dataset.k, [lo, hi] = LIMIT[k];
    cfgSet(c, k, Math.max(lo, Math.min(hi, cfgGet(c, k) + Number(el.dataset.d)))); refresh();
  },
  setopt(el) { const k = el.dataset.k, v = el.dataset.v; cfgSet(S.setup.cfg, k, /^\d+$/.test(v) ? Number(v) : v); refresh(); },
  customSecs() { const b = $("#customSecsBox"); if (b) { b.hidden = false; const i = $("#csecs"); i.value = S.setup.cfg.secs; i.focus(); } },
  applySecs() { const v = Math.round(Number(($("#csecs") || {}).value)); if (!(v >= 10 && v <= 600)) return toast("Pon entre 10 y 600 segundos."); S.setup.cfg.secs = v; refresh(); },
  toggleStyle(el) { const s = S.setup.cfg.styles, v = el.dataset.v, i = s.indexOf(v); if (i >= 0) { if (s.length > 1) s.splice(i, 1); } else s.push(v); refresh(); },
  toggleLetter(el) {
    const ex = S.setup.cfg.excluded, v = el.dataset.v, i = ex.indexOf(v);
    if (i >= 0) ex.splice(i, 1); else if (G.ALPHABET.length - ex.length > 3) ex.push(v); else return toast("Deja al menos 3 letras.");
    refresh();
  },
  addName() { S.setup.names.push(""); refresh(); setTimeout(() => { const f = $("#pn-" + (S.setup.names.length - 1)); if (f) f.focus(); }, 0); },
  delName(el) { S.setup.names.splice(+el.dataset.i, 1); refresh(); },

  // catálogo
  catFav(el) { const c = S.cats.find((x) => x.id === el.dataset.id); c.fav = !c.fav; saveCats(); refresh(); },
  catEdit(el) { openCatEdit(el.dataset.id); },
  catDel(el) { arm(el, () => { S.cats = S.cats.filter((x) => x.id !== el.dataset.id); saveCats(); closeSheet(); refresh(); toast("Categoría eliminada."); }, "Toca otra vez para eliminar"); },
  catReset(el) { arm(el, () => { S.cats = G.seedCatalog(); saveCats(); refresh(); toast("Catálogo restaurado."); }); },

  // local
  localBegin: localBeginTurn,
  localStop() {
    const L = S.L; if (L.cfg.stopNeedsAll && L.cur.some((t) => !G.clean(t))) return toast("Rellena todas las categorías para cantar STOP.");
    localEndTurn("stop");
  },
  localNextTurn() {
    const L = S.L;
    if (L.turn < L.players.length - 1) { L.turn++; L.phase = "handoff"; }
    else { L.phase = "review"; if (judgeOn(L.cfg) && judgeReady() && !(L.rulings && Object.keys(L.rulings).length)) localJudge(null); }
    saveLocal(); render(); window.scrollTo(0, 0);
  },
  judgeAll() { if (S.screen === "local") localJudge(null); else onlineJudge(null); },
  appeal(el) { openAppeal(el.dataset.k, el.dataset.mode); },
  lverdict(el) { const d = S.L.decisions, k = el.dataset.k, v = el.dataset.v; if (d[k] === v) delete d[k]; else d[k] = v; saveLocal(); refresh(); },
  localScore() { const L = S.L; L.results[L.n] = G.packResult(localResolve(), L.round); L.phase = "scores"; L.scoresAt = Date.now(); saveLocal(); render(); window.scrollTo(0, 0); },
  localBackReview() { const L = S.L; delete L.results[L.n]; L.phase = "review"; saveLocal(); render(); },
  localAfterScores() { const L = S.L; if (L.n >= L.cfg.rounds) L.phase = "final"; else localNextRound(); saveLocal(); render(); window.scrollTo(0, 0); },
  localRematch() { const L = S.L; startLocal(L.cfg, L.players.map((p) => p.name)); },
  localMenu() {
    const L = S.L;
    openSheet(`<h2>Partida local</h2>
      <button type="button" class="mitem" data-a="home">Salir al inicio<small>La partida queda guardada en este móvil</small></button>
      ${L.phase !== "final" ? `<button type="button" class="mitem danger" data-a="localEnd">Terminar la partida ahora<small>Se muestra la clasificación con las rondas jugadas</small></button>` : ""}
      <button type="button" class="mitem danger" data-a="localDiscard">Abandonar y borrar la partida</button>
      <button type="button" class="mitem" data-a="settings">Ajustes</button>
      <button type="button" class="btn ghost wide" data-a="closeSheet">Cerrar</button>`);
  },
  localEnd(el) { arm(el, () => { S.L.phase = "final"; saveLocal(); closeSheet(); render(); }); },
  localDiscard(el) { arm(el, () => { S.L = null; store.del("stop.local"); closeSheet(); show("home"); }); },
  sortFinal(el) { S.sortBy = el.dataset.k; refresh(); },

  // online
  copyCode() { copyText(S.code, "Código copiado."); },
  copyLink() { copyText(shareLink(), "Enlace copiado."); },
  ready() { const me = S.R.players[S.uid]; roomUpdate({ players: { [S.uid]: { ready: !me.ready } } }).catch(() => {}); },
  kick(el) { const id = el.dataset.id; arm(el, () => roomUpdate({ players: { [id]: { kicked: true } } }, "expulsar").then(() => toast(nameOf(id) + " ya no está en la sala."), () => {}), "¿Seguro?"); },
  editRules() { startSetup("edit", S.R.cfg); },
  hostStart() { hostNextRound(); },
  hostNext() { hostNextRound(); },
  stop() { pressStop(false); },
  vote(el) { castVote(el.dataset.k, el.dataset.v); },
  debate(el) { openDebate(el.dataset.k); },
  pickVote(el) { const f = el.closest("form"); f.querySelectorAll('[data-a="pickVote"]').forEach((b) => b.setAttribute("aria-pressed", String(b === el))); $("#vv").value = el.dataset.v; },
  decide(el) { setDecision(el.dataset.k, el.dataset.v || null); closeSheet(); },
  debateTimer() {
    clearInterval(S.dT); const end = Date.now() + 30000;
    S.dT = setInterval(() => { const el = $("#dtimer"); const l = end - Date.now(); if (!el) { clearInterval(S.dT); return; } el.textContent = l > 0 ? "Quedan " + fmtTime(l) + " s" : "Tiempo de votar"; if (l <= 0) { clearInterval(S.dT); beep(330, 0.3); } }, 250);
  },
  closeReview(el) { if (el.dataset.confirm) arm(el, hostCloseReview, "Toca otra vez: faltan respuestas"); else hostCloseReview(); },
  reopen() { roomUpdate({ status: "play" }, "reabrir la revisión").catch(() => {}); },
  rematch() { hostRematch(); },
  takeControl() { roomUpdate({ host: S.uid }, "tomar el control").catch(() => {}); closeSheet(); },
  leave(el) { goHome(); },
  roomMenu() {
    const R = S.R, host = isHost(), ph = onlinePhase();
    openSheet(`<h2>Sala ${esc(S.code)}</h2>
      ${R && ph !== "guest" ? `<button type="button" class="mitem" data-a="copyLink">Copiar enlace de invitación<small>Código ${esc(S.code)}</small></button>` : ""}
      ${R && !host && ph !== "guest" ? `<button type="button" class="mitem" data-a="takeControl">Tomar el control de la sala<small>Úsalo si el anfitrión se ha ido: pasarás a dirigir la partida</small></button>` : ""}
      ${host && ph === "play" ? `<button type="button" class="mitem" data-a="forceClose">Cerrar la ronda ahora<small>Bloquea las respuestas de todos</small></button>` : ""}
      ${host && ph !== "final" && ph !== "lobby" ? `<button type="button" class="mitem danger" data-a="endGame">Terminar la partida<small>Se muestra la clasificación con las rondas puntuadas</small></button>` : ""}
      <button type="button" class="mitem" data-a="settings">Ajustes</button>
      <button type="button" class="mitem danger" data-a="leaveConfirm">Abandonar la sala<small>Puedes volver desde el inicio mientras siga abierta</small></button>
      <button type="button" class="btn ghost wide" data-a="closeSheet">Cerrar</button>`);
  },
  forceClose() { closeSheet(); pressStop(true); },
  endGame(el) { arm(el, () => { closeSheet(); hostFinish(); }); },
  leaveConfirm(el) { arm(el, goHome, "Toca otra vez para salir"); },
};

/* ---------- eventos ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", (e) => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k === "ans") {
    const i = +el.dataset.i, v = el.value.slice(0, G.LIMITS.answer);
    if (S.screen === "local" && S.L && S.L.cur) { S.L.cur[i] = v; letterHint(i, v, S.L.round.letter); saveLocalSoon(); }
    else if (S.screen === "room" && S.myText && onlinePhase() === "play") { S.myText[i] = v; letterHint(i, v, S.R.round.letter); scheduleDraft(); }
    updateLive();
  } else if (k === "pname") S.setup.names[+el.dataset.i] = el.value;
  else if (k === "hostname") S.name = el.value;
});
let lsT = 0;
function saveLocalSoon() { clearTimeout(lsT); lsT = setTimeout(saveLocal, 400); }
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.pref) { S.prefs[el.dataset.pref] = el.checked; savePrefs(); }
  else if (el.dataset.cfg) { S.setup.cfg[el.dataset.cfg] = el.checked; refresh(); }
  else if (el.dataset.pick) {
    const p = S.setup.cfg.pick, id = el.dataset.pick;
    if (el.checked && !p.includes(id)) p.push(id); else if (!el.checked) p.splice(p.indexOf(id), 1);
    const c = $("#pickCount"); if (c) c.textContent = p.length;
  } else if (el.dataset.cat === "active") {
    const c = S.cats.find((x) => x.id === el.dataset.id); c.active = el.checked; saveCats(); refresh();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) { closeSheet(); return; }
  const el = e.target;
  if (e.key === "Enter" && el.dataset && el.dataset.in === "ans") {
    e.preventDefault();
    const nx = $("#a-" + (+el.dataset.i + 1)); if (nx) nx.focus(); else el.blur();
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target, k = f.dataset.form; if (!k) return;
  e.preventDefault();
  if (k === "join") joinRoom($("#jcode").value, $("#jname").value);
  else if (k === "joinhere") joinRoom(S.code, $("#hn").value);
  else if (k === "addcat") {
    const n = G.clean($("#ncat").value, G.LIMITS.catName); if (!n) return toast("Escribe el nombre de la categoría.");
    S.cats.push({ id: "u" + Date.now().toString(36), name: n, style: $("#nstyle").value, flex: $("#nflex").checked, active: true, fav: false });
    saveCats(); refresh(); toast("Categoría añadida.");
  } else if (k === "editcat") {
    const c = S.cats.find((x) => x.id === f.dataset.id); const n = G.clean($("#ecat").value, G.LIMITS.catName);
    if (!n) return toast("El nombre no puede estar vacío.");
    Object.assign(c, { name: n, style: $("#estyle").value, flex: $("#eflex").checked }); saveCats(); closeSheet(); refresh();
  } else if (k === "appeal") {
    const arg = G.clean($("#arg").value, G.LIMITS.reason);
    if (!arg) return toast("Escribe tu argumento para el juez.");
    const ap = { k: f.dataset.k, arg, v: $("#vv").value || "v" };
    closeSheet();
    if (f.dataset.mode === "local") localJudge(ap); else onlineJudge(ap);
  } else if (k === "vote") {
    const v = $("#vv").value; if (!v) return toast("Elige Válida, No vale o Repetida.");
    castVote(f.dataset.k, v, $("#vr").value); closeSheet(); toast("Voto guardado.");
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && (S.screen === "room" || S.screen === "local")) keepAwake(); });

/* ---------- arranque ---------- */
function start(data) {
  loadCats(); applyPrefs();
  const h = (location.hash || "").replace("#", "").toUpperCase();
  if (/^[A-Z]{4}$/.test(h)) S.joinCode = h;
  if (data && data.screen === "room" && data.code) { S.code = data.code; S.screen = "room"; }
  else if (data && data.screen === "local" && S.L) S.screen = "local";
  else if (data && data.screen === "setup" && data.setup) { S.setup = data.setup; S.screen = "setup"; }
  else if (!S.joinCode && store.get("stop.cur", null)) S.resumeCode = store.get("stop.cur", null);
  render();
  initCaps();
  setInterval(tick, 250);
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ screen: S.screen, code: S.code, setup: S.screen === "setup" ? S.setup : null }));
if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
