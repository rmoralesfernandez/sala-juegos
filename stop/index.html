<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#141821">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<script>window.APP_KEY="stop"</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head><body>
<title>Stop Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kalam:wght@400;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: hoja de cuadros de libreta — letra en rotulador fosforito arriba, columna de respuestas a boli, señal STOP octogonal anclada abajo */
:root{
  --paper:#FAFBFE; --grid:rgba(47,91,234,.09); --margin:rgba(215,38,46,.22);
  --card:#FFFFFF; --ink:#1A2752; --muted:#5B6789; --line:#D3DAEA;
  --pen:#2F5BEA; --pen-ink:#FFFFFF;
  --hi:#FFE94D; --hi-ink:#1A2752;
  --stop:#D7262E; --stop-ink:#FFFFFF;
  --ok:#1C8550; --ok-soft:#DDF2E5; --bad:#C2372F; --bad-soft:#FBE2DF; --dup:#9A6512; --dup-soft:#FAEED3;
  --scrim:rgba(18,26,56,.45);
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10152A; --grid:rgba(140,170,255,.07); --margin:rgba(232,66,74,.25);
    --card:#171E37; --ink:#E7EBFA; --muted:#9BA6C8; --line:#2A3358;
    --pen:#7C9BFF; --pen-ink:#0E1430;
    --hi:#FFE94D; --hi-ink:#141A33;
    --stop:#E8424A; --stop-ink:#FFFFFF;
    --ok:#4CC787; --ok-soft:#14331F; --bad:#F27168; --bad-soft:#3A1C1E; --dup:#E8B04A; --dup-soft:#382B12;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10152A; --grid:rgba(140,170,255,.07); --margin:rgba(232,66,74,.25);
  --card:#171E37; --ink:#E7EBFA; --muted:#9BA6C8; --line:#2A3358;
  --pen:#7C9BFF; --pen-ink:#0E1430;
  --hi:#FFE94D; --hi-ink:#141A33;
  --stop:#E8424A; --stop-ink:#FFFFFF;
  --ok:#4CC787; --ok-soft:#14331F; --bad:#F27168; --bad-soft:#3A1C1E; --dup:#E8B04A; --dup-soft:#382B12;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root.hc{--muted:var(--ink);--line:var(--ink);--grid:transparent}
:root.lgtext{--fs:19px}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:grid;gap:16px}
#app>.st-franja{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82em}
.lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* botones */
.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 20px;font-family:var(--f-body);font-weight:700;font-size:1.02em;background:var(--ink);color:var(--paper);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn.pen{background:var(--pen);color:var(--pen-ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88em;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:default}
.btn[data-armed]{background:var(--bad);color:#fff;box-shadow:none}
.link{appearance:none;border:0;background:none;padding:6px 2px;color:var(--pen);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.icon{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon:hover{background:var(--card)}
.icon svg{width:22px;height:22px}

/* tarjeta de papel */
.sheetcard{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--line),inset 0 0 0 1px var(--line);display:grid;gap:12px;min-width:0}
.sheetcard h2{font-family:var(--f-display);font-weight:400;font-size:1.25em;letter-spacing:.01em}

/* cabecera */
.top{display:flex;align-items:center;gap:6px;margin-inline:-8px}
.top .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1}
.wordmark.sm{font-size:1.25em}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;padding:4px 9px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.hi{background:var(--hi);color:var(--hi-ink);box-shadow:none}
.chip.ok{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.chip.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.chip.dup{background:var(--dup-soft);color:var(--dup);box-shadow:none}

/* home */
.hero{display:grid;gap:14px;padding-top:10px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(3rem,15vw,4.6rem);line-height:.88;letter-spacing:-.01em}
.hero h1 .mark{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%);padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--hi-ink)}
.hero p{max-width:40ch;color:var(--muted)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo .letter-s{width:54px;height:54px;font-size:2rem}
.demo .ans{font-family:var(--f-hand);font-size:1.15em;line-height:1.2}
.demo .ans s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .btn{min-height:84px;flex-direction:column;gap:2px;font-size:1.08em}
.menu .btn small{font-weight:400;font-size:.76em;opacity:.8}
.menu .btn.first{grid-column:1/-1}
.note{font-size:.88em;color:var(--muted)}
.note.warn{color:var(--bad)}
.rooms{display:grid;gap:6px}
.roomrow{appearance:none;border:0;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.roomrow .code{font-family:var(--f-mono);font-size:1.05em;letter-spacing:.16em;font-weight:700}
.roomrow .meta{min-width:0;display:grid}
.roomrow .meta span{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomrow .go{color:var(--pen);font-weight:700;font-size:.9em}

/* formularios */
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92em}
.input{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0 14px;font-size:1.05em}
.input:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 25%,transparent)}
.input.code{font-family:var(--f-mono);letter-spacing:.4em;text-transform:uppercase;font-size:1.4em;font-weight:700;text-align:center}
.input::placeholder{color:var(--muted);opacity:.8;letter-spacing:0;font-size:.9em;font-weight:400}
select.input{appearance:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{appearance:none;border:0;border-radius:12px;min-height:46px;padding:8px 14px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-weight:600;text-align:left;display:grid;gap:1px}
.opt small{font-weight:400;font-size:.78em;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.opt[aria-pressed="true"] small{color:inherit;opacity:.75}
.seg.fill{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{width:48px;padding:0;font-size:1.4em}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-display);font-size:1.7em;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.switch:first-child{border-top:0}
.switch span{min-width:0}
.switch small{display:block;color:var(--muted);font-size:.8em}
.switch input{appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.ptsgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.ptsgrid .stepper output{font-size:1.2em;min-width:44px}
.ptsgrid .stepper .btn{width:40px;min-height:40px}
.letters{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.lt{appearance:none;border:0;aspect-ratio:1;max-width:100%;border-radius:8px;font-family:var(--f-display);font-size:1.1em;background:var(--hi);color:var(--hi-ink);cursor:pointer}
.lt[aria-pressed="false"]{background:var(--paper);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:line-through}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--pen)}
.catpick{display:grid;gap:4px;max-height:340px;overflow:auto;padding-right:4px}
.cbx{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.cbx input{width:22px;height:22px;flex:none;accent-color:var(--pen)}
.cbx span{min-width:0}
.namelist{display:grid;gap:8px}
.namelist .row .input{flex:1}

/* juego: barra superior y letra */
.gamebar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;margin-inline:-8px}
.roundtag{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.letterbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.letter-s{display:grid;place-items:center;width:112px;height:112px;background:var(--hi);color:var(--hi-ink);font-family:var(--f-display);font-size:5.2rem;line-height:1;border-radius:10px 22px 12px 24px;transform:rotate(-3deg);box-shadow:4px 5px 0 var(--ink)}
.timer{display:grid;gap:6px;min-width:0}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:2.6em;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);border-radius:10px;transition:width .25s linear}
.timer.warn .t{color:var(--stop)}
.timer.warn .bar i{background:var(--stop)}
.banner{border-radius:14px;padding:12px 14px;background:var(--stop);color:var(--stop-ink);font-weight:700;display:flex;align-items:center;gap:10px}
.banner.info{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:500}
.banner .grow{min-width:0}

/* respuestas a boli */
.answers{display:grid;gap:4px;background:var(--card);border-radius:16px;padding:6px 14px 10px 26px;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.answers::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--margin)}
.ansrow{display:grid;gap:0;padding-top:8px}
.ansrow label{font-size:.8em;font-weight:600;color:var(--muted)}
.ansrow input{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-family:var(--f-hand);font-size:1.5em;line-height:1.3;padding:2px 0 3px;color:var(--pen);border-radius:0}
.ansrow input:focus{outline:none;border-bottom-color:var(--pen)}
.ansrow input:disabled{color:var(--ink);opacity:.85}
.ansrow .hint{font-size:.76em;color:var(--bad);min-height:1.1em}
.flexchip{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dup);margin-left:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px;background:linear-gradient(transparent,var(--paper) 35%)}
.dock .meta{font-size:.82em;color:var(--muted);max-width:14ch}
.stopbtn{appearance:none;border:0;cursor:pointer;width:96px;height:96px;background:var(--stop-ink);clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);display:grid;place-items:center;padding:0;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.stopbtn span{width:88px;height:88px;background:var(--stop);color:var(--stop-ink);clip-path:inherit;display:grid;place-items:center;font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em}
.stopbtn:active span{transform:scale(.95)}
.stopbtn:disabled{opacity:.4;cursor:default}
.stopbtn:focus-visible{outline:none}
.stopbtn:focus-visible span{box-shadow:inset 0 0 0 4px var(--hi)}

/* cuenta atrás y pantallas grandes */
.big{display:grid;place-items:center;text-align:center;gap:14px;min-height:60vh;align-content:center}
.big .num{font-family:var(--f-display);font-size:clamp(6rem,40vw,11rem);line-height:.9}
.big .num.go{color:var(--stop)}
.big h2{font-family:var(--f-display);font-weight:400;font-size:2em}

/* lobby */
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.code-l{font-family:var(--f-mono);font-weight:700;font-size:2.4em;letter-spacing:.24em;line-height:1}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);min-height:52px}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.on{background:var(--ok)}
.tag{font-size:.74em;color:var(--muted);white-space:nowrap}
.cfgchips{display:flex;flex-wrap:wrap;gap:6px}

/* revisión */
.catblock{display:grid;gap:8px}
.catblock h3{font-size:1em;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cell{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);align-items:center}
.cell.v{box-shadow:inset 3px 0 0 var(--ok),inset 0 0 0 1px var(--line)}
.cell.i{box-shadow:inset 3px 0 0 var(--bad),inset 0 0 0 1px var(--line)}
.cell.d{box-shadow:inset 3px 0 0 var(--dup),inset 0 0 0 1px var(--line)}
.cell .who{font-size:.78em;color:var(--muted);font-weight:600}
.cell .txt{font-family:var(--f-hand);font-size:1.35em;line-height:1.2;color:var(--pen);overflow-wrap:anywhere}
.cell .txt.empty{color:var(--muted);font-family:var(--f-body);font-size:.95em}
.cell .pts{font-family:var(--f-display);font-size:1.3em;text-align:right;font-variant-numeric:tabular-nums}
.cell .why{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8em;color:var(--muted)}
.votes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
.vb{appearance:none;border:0;min-height:42px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.84em;cursor:pointer;padding:0 6px}
.vb[aria-pressed="true"].v{background:var(--ok);color:#fff;box-shadow:none}
.vb[aria-pressed="true"].i{background:var(--bad);color:#fff;box-shadow:none}
.vb[aria-pressed="true"].d{background:var(--dup);color:#fff;box-shadow:none}
.vb.more{padding:0 12px}
.vb:disabled{opacity:.4;cursor:default}
.disclaimer{font-size:.82em;color:var(--muted);border-left:3px solid var(--hi);padding-left:10px}

/* resultados */
.rank{display:grid;gap:6px}
.rank details{border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.rank summary{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;cursor:pointer}
.rank summary::-webkit-details-marker{display:none}
.rank .pos{font-family:var(--f-display);font-size:1.1em;color:var(--muted)}
.rank .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .plus{font-family:var(--f-mono);font-size:.85em;color:var(--ok);font-variant-numeric:tabular-nums}
.rank .tot{font-family:var(--f-display);font-size:1.3em;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.rank .detail{padding:0 12px 12px;display:grid;gap:4px}
.rank .detail div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:.88em;border-top:1px dashed var(--line);padding-top:4px}
.rank .detail b{font-family:var(--f-hand);font-weight:400;font-size:1.15em;color:var(--pen)}
.winner{display:grid;gap:6px;text-align:center;padding:10px 0}
.winner .crown{font-family:var(--f-display);font-size:clamp(2.2rem,11vw,3.4rem);line-height:1}
.winner .crown .mark{background:linear-gradient(transparent 14%,var(--hi) 14%,var(--hi) 86%,transparent 86%);color:var(--hi-ink);padding:0 .1em}
.tablewrap{overflow-x:auto}
table.final{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.final th,table.final td{padding:9px 5px;text-align:right;border-bottom:1px dashed var(--line);white-space:nowrap}
table.final th:first-child,table.final td:first-child{text-align:left;white-space:normal}
table.final th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.final th button{appearance:none;border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
table.final th[aria-sort] button{color:var(--ink);text-decoration:underline}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}

<script>
/* Stop Party — lógica pura del juego (sin DOM). Se usa en el navegador y en los tests de Node. */
(function (root) {
  "use strict";

  const ALPHABET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
  const DEFAULT_EXCLUDED = ["K", "Ñ", "W", "X", "Y"];
  const LIMITS = { name: 20, answer: 40, reason: 80, catName: 70 };

  const STYLES = {
    clasico: "Clásico",
    familiar: "Familiar",
    pop: "Cultura pop",
    fiesta: "Fiesta",
    absurdo: "Absurdo",
    custom: "Personalizado",
  };

  // [nombre, estilo, validación flexible]
  const SEED = [
    ["Nombre de persona", "clasico", 0], ["Apellido", "clasico", 0], ["Animal", "clasico", 0],
    ["País o ciudad", "clasico", 0], ["Comida o bebida", "clasico", 0], ["Profesión", "clasico", 0],
    ["Color", "clasico", 0], ["Fruta o verdura", "clasico", 0], ["Parte del cuerpo", "clasico", 0],
    ["Deporte", "clasico", 0], ["Objeto de una casa", "clasico", 0], ["Instrumento musical", "clasico", 0],
    ["Prenda de ropa", "clasico", 0], ["Medio de transporte", "clasico", 0], ["Planta o flor", "clasico", 0],
    ["Marca comercial", "pop", 0], ["Película o serie", "pop", 0], ["Famoso o personaje ficticio", "pop", 0],
    ["Cantante o grupo", "pop", 0], ["Videojuego", "pop", 0], ["Canción", "pop", 0],
    ["Personaje de dibujos animados", "pop", 0], ["Deportista", "pop", 0], ["App o página web", "pop", 0],
    ["Algo que encuentras en un supermercado", "familiar", 0], ["Algo que hay en un baño", "familiar", 0],
    ["Algo que llevarías a la playa", "familiar", 0], ["Algo que encuentras en un hospital", "familiar", 0],
    ["Algo que encuentras en un colegio", "familiar", 0], ["Algo que hay en una cocina", "familiar", 0],
    ["Juguete", "familiar", 0], ["Algo que llevas en la mochila", "familiar", 0],
    ["Algo de color rojo", "familiar", 0], ["Algo que hay en un parque", "familiar", 0],
    ["Algo que encuentras en una discoteca", "fiesta", 1], ["Algo que comprarías con 1.000 €", "fiesta", 1],
    ["Algo que comprarías si te tocaran 10 millones de euros", "fiesta", 1],
    ["Algo que harías si fueras millonario", "fiesta", 1], ["Excusa para llegar tarde", "fiesta", 1],
    ["Excusa para no ir a trabajar o a clase", "fiesta", 1], ["Motivo para discutir con tu pareja", "fiesta", 1],
    ["Algo que harías para ligar", "fiesta", 1], ["Algo que te llevarías a una cita", "fiesta", 1],
    ["Algo que te da vergüenza", "fiesta", 1], ["Lo que dirías en una primera cita", "fiesta", 1],
    ["Lo que pedirías en un bar", "fiesta", 1],
    ["Algo que llevarías a una isla desierta", "absurdo", 1], ["Algo que harías si fueras invisible", "absurdo", 1],
    ["Algo que da miedo", "absurdo", 1], ["Algo que harías para gastar una broma", "absurdo", 1],
    ["Personaje que no querrías como vecino", "absurdo", 1], ["Nombre para un perro con mucha personalidad", "absurdo", 1],
    ["Superpoder inútil", "absurdo", 1], ["Algo que no dirías en un funeral", "absurdo", 1],
    ["Algo que esconderías de tu madre", "absurdo", 1], ["Lo primero que harías en un apocalipsis zombi", "absurdo", 1],
  ];

  function seedCatalog() {
    return SEED.map(([name, style, flex], i) => ({
      id: "c" + String(i + 1).padStart(2, "0"), name, style, flex: !!flex, active: true, fav: false,
    }));
  }

  function defaultCfg() {
    return {
      rounds: 10, perRound: 6, secs: 60,
      end: "both", grace: 3, stopNeedsAll: true,
      catMode: "random", styles: ["clasico", "familiar", "pop", "fiesta"], pick: [],
      excluded: DEFAULT_EXCLUDED.slice(), noRepeatLetters: true,
      pts: { unique: 10, repeat: 5, alone: 10, empty: 0, stopBonus: 0 },
      dup: "flex", selfVote: false, judge: "ai", flexAll: false, autoNext: false, privacy: true,
      pool: [],
    };
  }

  /* ---------- texto ---------- */
  function clean(s, max) {
    return String(s == null ? "" : s).replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || LIMITS.answer);
  }
  // Clave de comparación: minúsculas, sin tildes (conservando la Ñ), espacios colapsados.
  function key(s, mode) {
    let t = clean(s, 200).toLowerCase();
    t = t.replace(/ñ/g, "\u0001").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\u0001/g, "ñ");
    if (mode === "flex") {
      t = t.replace(/[^\p{L}\p{N} ]/gu, " ").replace(/\s+/g, " ").trim();
      t = t.replace(/^(el|la|los|las|un|una|unos|unas|lo)\s+/, "");
    }
    return t;
  }
  function firstLetter(s) {
    const k = key(s, "exact").replace(/^[^\p{L}\p{N}]+/u, "");
    return k ? k[0] : "";
  }
  // "empty" | "letter" (no empieza por la letra) | "ok"
  function autoCheck(text, letter) {
    const t = clean(text);
    if (!t) return "empty";
    return firstLetter(t) === String(letter).toLowerCase() ? "ok" : "letter";
  }

  /* ---------- letras y categorías ---------- */
  function availableLetters(cfg) {
    const ex = new Set(cfg.excluded || []);
    const list = ALPHABET.filter((l) => !ex.has(l));
    return list.length ? list : ALPHABET.filter((l) => l !== "Ñ");
  }
  function pickLetter(cfg, used, rng) {
    rng = rng || Math.random;
    const avail = availableLetters(cfg);
    let pool = avail;
    if (cfg.noRepeatLetters !== false) {
      // Las menos usadas primero: no se repite ninguna hasta agotar el conjunto.
      const n = {}; used.forEach((l) => { n[l] = (n[l] || 0) + 1; });
      const min = Math.min.apply(null, avail.map((l) => n[l] || 0));
      pool = avail.filter((l) => (n[l] || 0) === min);
      const last = used[used.length - 1];
      if (pool.length > 1 && last) pool = pool.filter((l) => l !== last);
    }
    return pool[Math.floor(rng() * pool.length)];
  }

  function buildPool(cfg, catalog) {
    const active = catalog.filter((c) => c.active && c.name);
    let pool;
    if (cfg.catMode === "fav") pool = active.filter((c) => c.fav);
    else if (cfg.catMode === "manual") { const s = new Set(cfg.pick || []); pool = catalog.filter((c) => s.has(c.id) && c.name); }
    else { const s = new Set(cfg.styles || []); pool = active.filter((c) => s.has(c.style)); }
    if (pool.length < cfg.perRound) {
      const have = new Set(pool.map((c) => c.id));
      pool = pool.concat(active.filter((c) => !have.has(c.id)).slice(0, cfg.perRound - pool.length));
    }
    return pool.map((c) => ({ id: c.id, name: clean(c.name, LIMITS.catName), flex: !!c.flex }));
  }

  // Elige las categorías menos usadas en la partida; desempata al azar.
  function pickCategories(pool, count, catUse, rng) {
    rng = rng || Math.random;
    const shuffled = pool.map((c) => ({ c, r: rng() }));
    shuffled.sort((a, b) => ((catUse[a.c.id] || 0) - (catUse[b.c.id] || 0)) || (a.r - b.r));
    return shuffled.slice(0, Math.min(count, pool.length)).map((x) => x.c);
  }

  /* ---------- resolución y puntuación ---------- */
  const VLABEL = { v: "Válida", i: "No vale", d: "Repetida" };

  /**
   * players: [id]; cats: [{name, flex}]; answers: {id: [texto]}
   * votes: {votante: {"id:i": {v:"v"|"i"|"d", r?}}}; decisions: {"id:i": "v"|"i"|"d"}
   * opts.decider: texto de la regla cuando hay decisión ("Anfitrión" / "Grupo")
   */
  function resolveRound(o) {
    const { players, cats, letter, cfg } = o;
    const answers = o.answers || {}, votes = o.votes || {}, decisions = o.decisions || {}, rulings = o.rulings || {};
    const decider = o.decider || "Anfitrión";
    const P = cfg.pts;
    const cells = {};
    players.forEach((id) => { cells[id] = []; });

    cats.forEach((cat, i) => {
      const flex = !!(cfg.flexAll || cat.flex);
      players.forEach((id) => {
        const t = clean((answers[id] || [])[i]);
        const auto = autoCheck(t, letter);
        const k = id + ":" + i;
        const tally = { v: 0, i: 0, d: 0 };
        const reasons = [];
        if (auto !== "empty") {
          players.forEach((voter) => {
            if (voter === id && !cfg.selfVote) return;
            const vv = votes[voter] && votes[voter][k];
            if (vv && tally[vv.v] !== undefined) { tally[vv.v]++; if (vv.r) reasons.push({ by: voter, v: vv.v, r: clean(vv.r, LIMITS.reason) }); }
          });
        }
        let verdict, rule, tie = false;
        const total = tally.v + tally.i + tally.d;
        if (auto === "empty") { verdict = "i"; rule = "Vacía"; }
        else if (decisions[k]) { verdict = decisions[k]; rule = decider; }
        else if (rulings[k] && (rulings[k].v === "v" || rulings[k].v === "i")) { verdict = rulings[k].v; rule = "Juez"; }
        else if (!total) { verdict = auto === "ok" ? "v" : "i"; rule = "Automática"; }
        else {
          const max = Math.max(tally.v, tally.i, tally.d);
          const top = ["v", "i", "d"].filter((x) => tally[x] === max);
          if (top.length === 1) { verdict = top[0]; rule = "Votos " + tally.v + "-" + tally.i + (tally.d ? "-" + tally.d : ""); }
          else {
            tie = true;
            if (flex) verdict = top.includes("v") ? "v" : "d";
            else verdict = top.includes("i") ? "i" : "d";
            rule = "Empate · " + (flex ? "categoría flexible" : "categoría estricta");
          }
        }
        const judge = auto !== "empty" && rulings[k] ? { v: rulings[k].v, w: clean(rulings[k].w, 160) } : null;
        cells[id][i] = { t, auto, verdict, rule, tally, tie, reasons, judge, pts: 0, why: "" };
      });

      // Puntos de la categoría
      const valid = players.filter((id) => cells[id][i].verdict !== "i");
      const groups = {};
      valid.forEach((id) => { const g = key(cells[id][i].t, cfg.dup); (groups[g] = groups[g] || []).push(id); });
      players.forEach((id) => {
        const c = cells[id][i];
        if (c.verdict === "i") {
          if (c.auto === "empty") { c.pts = -Math.abs(P.empty || 0); c.why = "Vacía"; }
          else { c.pts = 0; c.why = c.auto === "letter" && c.rule === "Automática" ? "No empieza por " + letter : c.rule === "Juez" ? "El juez dice que no vale" : "No vale"; }
          return;
        }
        const mates = groups[key(c.t, cfg.dup)].filter((x) => x !== id);
        if (c.verdict === "d" || mates.length) { c.pts = P.repeat; c.why = mates.length ? "Repetida" : "Marcada como repetida"; c.mates = mates; }
        else if (valid.length === 1 && players.length > 1) { c.pts = P.alone; c.why = "Solo tú respondiste"; }
        else { c.pts = P.unique; c.why = "Única"; }
      });
    });

    const pts = {};
    players.forEach((id) => { pts[id] = cells[id].reduce((s, c) => s + c.pts, 0); });
    const stopBy = o.stopBy && players.includes(o.stopBy) ? o.stopBy : null;
    if (stopBy && P.stopBonus) pts[stopBy] += P.stopBonus;
    return { cells, pts, stopBy };
  }

  // Paquete congelado de una ronda: lo que se guarda y se suma. Clave = número de ronda (evita sumar dos veces).
  function packResult(res, round) {
    const cells = {};
    Object.keys(res.cells).forEach((id) => {
      cells[id] = res.cells[id].map((c) => ({ t: c.t, p: c.pts, w: c.verdict, y: c.why }));
    });
    return { letter: round.letter, cats: round.cats.map((c) => c.name), stopBy: res.stopBy || null, pts: res.pts, cells };
  }

  /* ---------- juez IA ---------- */
  // items: [{id, cat, flex, t, args:[{v, r}]}] — solo respuestas no vacías. Los ids son cortos y anónimos.
  function judgePrompt(items, letter, opts) {
    opts = opts || {};
    const lines = items.map((x) => {
      const a = (x.args || []).filter((g) => g && g.r).map((g) => `    · Un jugador dice que ${g.v === "v" ? "SÍ vale" : g.v === "i" ? "NO vale" : "está repetida"}: "${clean(g.r, LIMITS.reason)}"`);
      return `- id ${x.id} | categoría: "${clean(x.cat, LIMITS.catName)}"${x.flex || opts.flexAll ? " (categoría flexible)" : ""} | respuesta: "${clean(x.t)}"${a.length ? "\n" + a.join("\n") : ""}`;
    });
    return `Eres el juez imparcial de una partida de STOP (Basta / Tutti Frutti) entre amigos en España. Letra de la ronda: "${letter}".
Decide si cada respuesta VALE ("v") o NO VALE ("i") para su categoría.

Criterios:
- Debe empezar por la letra "${letter}" (ignora mayúsculas, tildes, artículos iniciales y signos). Si no empieza por la letra, no vale.
- Debe encajar razonablemente en la categoría. Acepta nombres propios, marcas, palabras compuestas, extranjerismos de uso común y faltas de ortografía leves.
- No exijas que la palabra esté en el diccionario.
- Categorías flexibles (subjetivas o de humor): acepta respuestas creativas, exageradas o memes si se puede defender que encajan. Rechaza las que no tienen ninguna relación con la categoría (p. ej. "Rinoceronte" como algo que comprarías con 1.000 € no vale salvo que haya un buen argumento).
- Categorías normales: sé justo pero estricto; una respuesta inventada o que no es de esa categoría no vale.
- Si hay argumentos de los jugadores, tenlos en cuenta, pero decide tú.
${opts.appeal ? "- Es una APELACIÓN: revisa con cuidado el argumento antes de decidir.\n" : ""}
Respuestas:
${lines.join("\n")}

Responde SOLO con JSON: {"r":[{"id":"x0","v":"v","w":"motivo breve"}]}
"w" es el motivo en español, máximo 14 palabras, tono de juez simpático y directo. Incluye todas las ids.`;
  }
  function parseRulings(data, ids) {
    const out = {}, ok = new Set(ids);
    const arr = Array.isArray(data) ? data : data && Array.isArray(data.r) ? data.r : [];
    arr.forEach((x) => {
      if (!x || !ok.has(String(x.id))) return;
      const v = String(x.v || "").toLowerCase();
      const vv = v === "v" || v === "vale" || v === "true" ? "v" : v === "i" || v === "no vale" || v === "false" ? "i" : null;
      if (vv) out[String(x.id)] = { v: vv, w: clean(x.w, 160) };
    });
    return out;
  }

  function totals(results, ids) {
    const t = {}; ids.forEach((id) => { t[id] = 0; });
    Object.values(results || {}).forEach((r) => { ids.forEach((id) => { t[id] += (r.pts && r.pts[id]) || 0; }); });
    return t;
  }

  function stats(results, ids) {
    const s = {}; ids.forEach((id) => { s[id] = { total: 0, valid: 0, unique: 0, stops: 0, best: 0 }; });
    Object.values(results || {}).forEach((r) => {
      ids.forEach((id) => {
        const p = (r.pts && r.pts[id]) || 0; s[id].total += p; if (p > s[id].best) s[id].best = p;
        ((r.cells && r.cells[id]) || []).forEach((c) => { if (c.w !== "i") s[id].valid++; if (c.y === "Única" || c.y === "Solo tú respondiste") s[id].unique++; });
      });
      if (r.stopBy && s[r.stopBy]) s[r.stopBy].stops++;
    });
    return s;
  }

  const api = {
    ALPHABET, DEFAULT_EXCLUDED, LIMITS, STYLES, VLABEL,
    seedCatalog, defaultCfg, clean, key, firstLetter, autoCheck,
    availableLetters, pickLetter, buildPool, pickCategories,
    resolveRound, packResult, totals, stats, judgePrompt, parseRulings,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.StopLogic = api;
})(this);

</script>
<script>
(function () {
"use strict";
/* ---------- núcleo: estado, utilidades, preferencias ---------- */
const G = window.StopLogic;
const APP_NAME = "Stop Party"; // nombre visible: cámbialo aquí
const ARTIFACT_URL = location.origin + location.pathname;
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const S = {
  screen: "home", sig: "", ver: 0,
  prefs: Object.assign({ sound: true, vib: true, hc: false, lg: false, anim: true }, store.get("stop.prefs", {})),
  cats: null, name: store.get("stop.name", ""),
  setup: null, sheet: null,
  // online
  capState: "wait", db: null, user: null, roomCap: null, uid: null, canWrite: null, offset: 0, clockOk: false,
  rooms: [], roomsLoaded: false, code: null, R: null, unsubRoom: null, nroom: null, peers: [], presenceSince: 0,
  subs: {}, subRk: null, ans: {}, vot: {}, myText: null, myVotes: {}, pubRk: null, savedAt: 0, draftBusy: false, draftAgain: false,
  hostGoneSince: 0, joinCode: "", sortBy: "total",
  // local
  L: store.get("stop.local", null),
};

function loadCats() {
  const c = store.get("stop.cats", null);
  S.cats = Array.isArray(c) && c.length ? c : G.seedCatalog();
}
function saveCats() { store.set("stop.cats", S.cats); }
function savePrefs() { store.set("stop.prefs", S.prefs); applyPrefs(); }

/* sonido y vibración */
let actx = null;
function beep(freq, dur, type) {
  if (!S.prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq; g.gain.value = 0.0001;
    o.connect(g); g.connect(actx.destination); const t = actx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function buzz(p) { if (S.prefs.vib) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} } }
function warnCue() { beep(880, 0.15); buzz(60); }
function endCue() { beep(220, 0.5, "square"); buzz([120, 60, 120]); }
function goCue() { beep(660, 0.12); }
let wake = null;
async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) {} }

  opts = opts || {};
  return `<header class="top">
    ${opts.back ? `<button type="button" class="icon" data-a="${opts.back}" aria-label="Volver">${ICON.back}</button>` : ""}

  </header>`;
}

function show(screen) { S.screen = screen; S.sig = ""; render(); window.scrollTo(0, 0); }

/* ---------- render principal ---------- */
function sigOf() {
  if (S.screen === "room") {
    const p = S.R ? onlinePhase() : "load";
    const live = p === "play" || p === "countdown";
    return "room|" + (S.R ? S.R.gen + "|" + S.R.n : "") + "|" + p + "|" + (S.myText ? 1 : 0) + (live ? "" : "|" + S.ver);
  }
  if (S.screen === "local" && S.L) {
    const L = S.L;
    return "local|" + L.phase + "|" + L.n + "|" + L.turn + (L.phase === "play" || L.phase === "countdown" ? "" : "|" + S.ver);
  }
  return S.screen + "|" + S.ver;
}
function refresh() { S.ver++; tick(); }
function tick() {
  const sig = sigOf();
  if (sig !== S.sig) render(); else updateLive();
}
function render() {
  S.sig = sigOf();
  const app = $("#app");
  let html = "";
  switch (S.screen) {
    case "home": html = renderHome(); break;
    case "join": html = renderJoin(); break;
    case "setup": html = renderSetup(); break;
    case "cats": html = renderCats(); break;
    case "rules": html = topBar("Reglas", { back: "home" }) + `<section class="sheetcard rules">${rulesHTML()}</section>`; break;
    case "local": html = renderLocal(); break;
    case "room": html = renderRoom(); break;
  }
  app.innerHTML = html;
  turnoMarca();
  afterRender();
  updateLive();
}
function afterRender() {
  const f = $("[data-autofocus]"); if (f && !("ontouchstart" in window)) { try { f.focus(); } catch (e) {} }
}
function updateLive() {
  if (S.screen === "local") localLive();
  else if (S.screen === "room") roomLive();
}

/* ---------- inicio ---------- */
function renderHome() {
  const online = S.capState === "ok";
  const ro = online && S.canWrite === false;
  let note = "";
  if (S.capState === "wait") note = `<p class="note">Conectando el modo online…</p>`;
  else if (!online) note = `<p class="note">El modo online necesita conexión a internet. El modo local funciona siempre.</p>`;
  else if (ro) note = `<p class="note warn">Tu acceso es de solo lectura: recarga la página e inténtalo otra vez.</p>`;
  const mine = (S.rooms || []).filter((r) => r.players && r.players[S.uid] && !r.players[S.uid].kicked && r.status !== "final");
  const open = (S.rooms || []).filter((r) => r.status === "lobby" && !(r.players && r.players[S.uid]) && Date.now() - (r.updatedAt || 0) < 3 * 3600e3);
  const roomRows = (list, verb) => list.slice(0, 5).map((r) => {
    const ps = Object.values(r.players || {}).filter((p) => !p.kicked);
    const host = (r.players && r.players[r.host] && r.players[r.host].name) || "—";
    const st = r.status === "lobby" ? "En la sala de espera" : r.status === "final" ? "Terminada" : `Ronda ${r.n} de ${r.cfg ? r.cfg.rounds : "?"}`;
    return `<button type="button" class="roomrow" data-a="openRoom" data-code="${esc(r.code)}"><span class="code">${esc(r.code)}</span><span class="meta"><b>${esc(host)} · ${ps.length} ${ps.length === 1 ? "jugador" : "jugadores"}</b><span>${esc(st)}</span></span><span class="go">${verb}</span></button>`;
  }).join("");
  const resume = S.L && S.L.phase !== "final" ? `<button type="button" class="btn ghost wide" data-a="resumeLocal">Seguir partida local · ronda ${S.L.n} de ${S.L.cfg.rounds}</button>` : "";
  return `${topBar(APP_NAME)}
  <section class="hero">
    <h1>Stop <span class="mark">Party</span></h1>
    <p>Sale una letra, rellenas las categorías y el primero que termina canta STOP. Luego el grupo decide qué vale.</p>
    <div class="demo" aria-hidden="true"><span class="letter-s">L</span><span class="ans">León · Lima · <s>Perro</s> · Lunes de resaca</span></div>
  </section>
  <nav class="menu" aria-label="Menú principal">
    <button type="button" class="btn pen first" data-a="newOnline" ${online && !ro ? "" : "disabled"}>Crear partida<small>Sala online con código para tus amigos</small></button>
    <button type="button" class="btn" data-a="join" ${online && !ro ? "" : "disabled"}>Unirme<small>Con código o enlace</small></button>
    <button type="button" class="btn hi" data-a="newLocal">Jugar en local<small>Un móvil, por turnos</small></button>
    <button type="button" class="btn ghost" data-a="rules">Reglas</button>
    <button type="button" class="btn ghost" data-a="cats">Categorías</button>
  </nav>
  ${note}${resume}
  ${mine.length ? `<section class="sheetcard"><h2>Tus salas</h2><div class="rooms">${roomRows(mine, "Volver")}</div></section>` : ""}
  ${open.length && !ro ? `<section class="sheetcard"><h2>Salas abiertas</h2><div class="rooms">${roomRows(open, "Entrar")}</div></section>` : ""}`;
}

function rulesHTML() {
  const p = G.defaultCfg().pts;
  return `<h2>Cómo se juega</h2>
  <ol>
    <li>Cada ronda sale una letra y varias categorías.</li>
    <li>Escribe una respuesta por categoría que empiece por esa letra.</li>

}

/* ---------- ajustes (hoja inferior) ---------- */
function openSheet(html) {
  closeSheet();
  const o = document.createElement("div"); o.className = "overlay"; o.id = "sheet";
  o.innerHTML = `<div class="drawer" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener("click", (e) => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o); S.sheet = o;
  const f = o.querySelector("input,button"); if (f) { try { f.focus(); } catch (e) {} }
}
function closeSheet() { if (S.sheet) { S.sheet.remove(); S.sheet = null; } }
function sw(id, label, on, hint) {
  return `<label class="switch" for="${id}"><span>${label}${hint ? `<small>${hint}</small>` : ""}</span><input type="checkbox" id="${id}" data-pref="${id}" ${on ? "checked" : ""}></label>`;
}
function openSettings() {
  const p = S.prefs;
  openSheet(`<h2>Ajustes</h2>
    <div>${sw("sound", "Sonidos", p.sound, "Aviso a 10 segundos y al acabar")}${sw("vib", "Vibración", p.vib, "Si tu móvil lo permite")}
    ${sw("hc", "Alto contraste", p.hc)}${sw("lg", "Texto grande", p.lg)}${sw("anim", "Animaciones", p.anim !== false, "Se desactivan solas si tu sistema pide menos movimiento")}</div>

}

/* ---------- configuración por pasos ---------- */
function startSetup(mode, cfg) {
  const base = cfg ? clone(cfg) : Object.assign(G.defaultCfg(), store.get("stop.lastcfg", {}));
  base.pts = Object.assign(G.defaultCfg().pts, base.pts || {});
  const names = store.get("stop.localnames", ["", ""]);
  S.setup = { mode, step: 0, cfg: base, names: names.length >= 2 ? names : ["", ""] };
  show("setup");
}
function setupSteps() {
  const s = ["Partida", "Final de ronda", "Categorías", "Letras y puntos"];
  return S.setup.mode === "local" ? ["Jugadores"].concat(s) : S.setup.mode === "online" ? ["Tu nombre"].concat(s) : s;
}
function stepper(id, val, unit) {
  return `<div class="stepper"><button type="button" class="btn ghost" data-a="step" data-k="${id}" data-d="-1" aria-label="Menos">−</button><output aria-live="polite">${val}${unit || ""}</output><button type="button" class="btn ghost" data-a="step" data-k="${id}" data-d="1" aria-label="Más">+</button></div>`;
}
function opt(k, v, label, cur, small) {
  return `<button type="button" class="opt" data-a="setopt" data-k="${k}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${label}${small ? `<small>${small}</small>` : ""}</button>`;
}
function cfgSwitch(k, label, hint) {
  return `<label class="switch" for="cf-${k}"><span>${label}${hint ? `<small>${hint}</small>` : ""}</span><input type="checkbox" id="cf-${k}" data-cfg="${k}" ${S.setup.cfg[k] ? "checked" : ""}></label>`;
}

  const st = S.setup, c = st.cfg, steps = setupSteps(), name = steps[st.step];

  if (name === "Tu nombre") {
    body = `<div class="field"><label for="hname">Tu nombre</label><input id="hname" class="input" maxlength="${G.LIMITS.name}" data-in="hostname" value="${esc(S.name)}" placeholder="Cómo te verán los demás" data-autofocus></div>

  } else if (name === "Jugadores") {
    body = `<div class="namelist">${st.names.map((n, i) => `<div class="row"><input class="input" id="pn-${i}" data-in="pname" data-i="${i}" maxlength="${G.LIMITS.name}" value="${esc(n)}" placeholder="Jugador ${i + 1}" aria-label="Nombre del jugador ${i + 1}">${st.names.length > 2 ? `<button type="button" class="icon" data-a="delName" data-i="${i}" aria-label="Quitar jugador ${i + 1}">✕</button>` : ""}</div>`).join("")}</div>
    ${st.names.length < 12 ? `<button type="button" class="btn ghost" data-a="addName">Añadir jugador</button>` : ""}
    <div>${cfgSwitch("privacy", "Ocultar respuestas al pasar el móvil", "Pantalla de privacidad entre turnos")}</div>`;
  } else if (name === "Partida") {

  } else if (name === "Categorías") {
    const pool = G.buildPool(c, S.cats);
    let extra = "";
    if (c.catMode === "random") extra = `<div class="field"><span class="lbl">Estilos que entran en el sorteo</span><div class="seg">${Object.entries(G.STYLES).map(([k, v]) => `<button type="button" class="opt" data-a="toggleStyle" data-v="${k}" aria-pressed="${c.styles.includes(k)}">${v}</button>`).join("")}</div></div>`;

    body = `<div class="field"><span class="lbl">Cómo se eligen</span><div class="seg fill">

    ${extra}

    <div class="field"><span class="lbl">Quién decide qué vale</span><div class="seg fill">
      ${opt("judge", "ai", "Juez IA", c.judge, "Gemini revisa cada respuesta; se puede apelar")}${opt("judge", "group", "El grupo", c.judge, "Votáis entre vosotros")}</div>
      ${c.judge === "ai" && S.capState !== "wait" && !judgeReady() ? `<p class="note warn">El juez IA no está activado en esta app. Sin él, decidiréis votando.</p>` : c.judge === "ai" ? `<p class="note">Ideal si sois dos. Lo decide Gemini; si se satura, esperad unos segundos y pedidlo otra vez.</p>` : ""}</div>
    <div>${cfgSwitch("flexAll", "Modo flexible", "Se aceptan respuestas creativas y memes: los empates cuentan como válidos en todas las categorías")}</div>`;
  } else {
    const ex = new Set(c.excluded);
    body = `<div class="field"><span class="lbl">Letras en juego (toca para quitar o poner)</span>
      <div class="letters">${G.ALPHABET.map((l) => `<button type="button" class="lt" data-a="toggleLetter" data-v="${l}" aria-pressed="${!ex.has(l)}" aria-label="Letra ${l}">${l}</button>`).join("")}</div>
      <p class="note">${G.availableLetters(c).length} letras. No se repite ninguna hasta agotarlas.</p></div>
    <div class="field"><span class="lbl">Puntos</span><div class="ptsgrid">
      <span>Válida y única</span>${stepper("pts.unique", c.pts.unique)}
      <span>Válida repetida</span>${stepper("pts.repeat", c.pts.repeat)}
      <span>Solo tú respondiste la categoría</span>${stepper("pts.alone", c.pts.alone)}
      <span>Vacía resta</span>${stepper("pts.empty", c.pts.empty)}
      <span>Bonus a quien canta STOP</span>${stepper("pts.stopBonus", c.pts.stopBonus)}
    </div></div>
    <div class="field"><span class="lbl">Respuestas repetidas</span><div class="seg fill">
      ${opt("dup", "flex", "Flexible", c.dup, "Ignora tildes, signos y artículos")}${opt("dup", "exact", "Estricta", c.dup, "Solo ignora mayúsculas y tildes")}</div></div>
    ${st.mode !== "local" ? `<div>${cfgSwitch("selfVote", "Permitir votar tu propia respuesta")}</div>` : ""}`;
  }
  const last = st.step === steps.length - 1;
  const cta = st.mode === "edit" ? "Guardar reglas" : st.mode === "local" ? "Empezar partida" : "Crear sala";
  const back = st.mode === "edit" ? "setupCancel" : "home";
  return `${topBar(st.mode === "local" ? "Partida local" : st.mode === "edit" ? "Reglas de la sala" : "Nueva sala", { back: st.step ? "setupPrev" : back })}
  <div class="steps" aria-hidden="true">${steps.map((_, i) => `<i class="${i <= st.step ? "on" : ""}"></i>`).join("")}</div>
  <section class="sheetcard"><span class="lbl">Paso ${st.step + 1} de ${steps.length}</span><h2>${esc(name)}</h2>${body}</section>
  <div class="row">
    ${last ? "" : `<button type="button" class="btn ghost grow" data-a="setupFinish">${cta} ya</button>`}
    <button type="button" class="btn pen grow" data-a="${last ? "setupFinish" : "setupNext"}">${last ? cta : "Siguiente"}</button>
  </div>`;
}
const LIMIT = { rounds: [1, 20], perRound: [3, 10], "pts.unique": [0, 50], "pts.repeat": [0, 50], "pts.alone": [0, 50], "pts.empty": [0, 20], "pts.stopBonus": [0, 20] };
function cfgGet(c, k) { return k.startsWith("pts.") ? c.pts[k.slice(4)] : c[k]; }
function cfgSet(c, k, v) { if (k.startsWith("pts.")) c.pts[k.slice(4)] = v; else c[k] = v; }
function finishSetup() {
  const st = S.setup, c = st.cfg;
  if (st.mode === "online" || st.mode === "edit") {
    if (st.mode === "online") { const n = G.clean(S.name, G.LIMITS.name); if (!n) { st.step = 0; render(); toast("Escribe tu nombre para crear la sala."); return; } }
  }
  if (st.mode === "local") {
    const names = st.names.map((n) => G.clean(n, G.LIMITS.name)).filter(Boolean);
    if (names.length < 2) { st.step = 0; render(); toast("Hacen falta al menos dos jugadores."); return; }
    st.names = names;
  }
  if (c.catMode === "manual" && c.pick.length < 1) { st.step = setupSteps().indexOf("Categorías"); render(); toast("Elige al menos una categoría."); return; }
  c.pool = G.buildPool(c, S.cats);
  if (c.perRound > c.pool.length) c.perRound = Math.max(1, c.pool.length);
  const saved = clone(c); delete saved.pool; store.set("stop.lastcfg", saved);
  if (st.mode === "local") { store.set("stop.localnames", st.names); startLocal(c, st.names); }
  else if (st.mode === "online") createRoom(c);
  else saveRoomCfg(c);
}

/* ---------- vistas compartidas de partida ---------- */
function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : String(s);
}
function viewPlay(o) {
  const filled = o.texts.filter((t) => G.clean(t)).length;
  return `<div class="letterbox">
      <div class="letter-s fresh" aria-label="Letra ${esc(o.letter)}">${esc(o.letter)}</div>
      <div class="timer" id="timer" aria-live="off"><span class="lbl">${o.end === "stop" ? "Tiempo jugado" : "Quedan"}</span><span class="t" id="tnum">–</span>${o.end === "stop" ? "" : `<div class="bar"><i id="tbar" style="width:100%"></i></div>`}</div>
    </div>
    <div id="banner"></div>
    <form class="answers" data-form="answers" autocomplete="off" novalidate>
      ${o.cats.map((c, i) => `<div class="ansrow">
        <label for="a-${i}">${esc(c.name)}${o.flexAll || c.flex ? '<span class="flexchip">flexible</span>' : ""}</label>
        <input id="a-${i}" data-in="ans" data-i="${i}" maxlength="${G.LIMITS.answer}" value="${esc(o.texts[i] || "")}" placeholder="Empieza por ${esc(o.letter)}…" autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="${i === o.cats.length - 1 ? "done" : "next"}" ${o.locked ? "disabled" : ""} ${i === 0 ? "data-autofocus" : ""}>
        <span class="hint" id="h-${i}"></span>
      </div>`).join("")}
    </form>
    <div class="dock">
      <p class="meta" id="dockmeta">${filled}/${o.cats.length} escritas</p>
      ${o.end === "timer" ? "" : `<button type="button" class="stopbtn" id="stopbtn" data-a="${o.stopAction}" aria-label="Cantar STOP"><span>STOP</span></button>`}
    </div>`;
}
function updatePlay(o) {
  const tn = $("#tnum"); if (!tn) return;
  const tm = $("#timer");
  if (o.remain != null) {
    tn.textContent = fmtTime(o.remain);
    const b = $("#tbar"); if (b) b.style.width = Math.max(0, Math.min(100, (o.remain / o.totalMs) * 100)) + "%";
    tm.classList.toggle("warn", o.remain <= 10000);
  } else if (o.elapsed != null) tn.textContent = fmtTime(o.elapsed);
  const ban = $("#banner"); if (ban && ban.dataset.h !== (o.banner || "")) { ban.dataset.h = o.banner || ""; ban.innerHTML = o.banner || ""; }
  const texts = o.texts || [];
  const filled = texts.filter((t) => G.clean(t)).length;
  const dm = $("#dockmeta");
  if (dm) dm.textContent = o.locked ? "Respuestas cerradas" : (o.needAll && filled < texts.length ? `${filled}/${texts.length} · rellena todo para el STOP` : `${filled}/${texts.length} escritas`) + (o.saved ? " · guardado" : "");
  const sb = $("#stopbtn"); if (sb) sb.disabled = !!o.locked || !!o.stopped || (o.needAll && filled < texts.length);
  if (o.locked) document.querySelectorAll('[data-in="ans"]').forEach((el) => { el.disabled = true; });
}
function letterHint(i, text, letter) {
  const h = $("#h-" + i); if (!h) return;
  h.textContent = G.autoCheck(text, letter) === "letter" ? "No empieza por " + letter : "";
}

function scoreRows(players, res, totalsMap, cats) {
  const sorted = players.slice().sort((a, b) => (totalsMap[b.id] - totalsMap[a.id]) || ((res.pts[b.id] || 0) - (res.pts[a.id] || 0)));
  let pos = 0, prev = null;
  return `<div class="rank">${sorted.map((p, k) => {
    if (totalsMap[p.id] !== prev) { pos = k + 1; prev = totalsMap[p.id]; }
    const cells = (res.cells && res.cells[p.id]) || [];
    const rp = res.pts[p.id] || 0;
    return `<details><summary><span class="pos">${pos}</span><span class="nm">${esc(p.name)}</span><span class="plus">${rp >= 0 ? "+" : ""}${rp}</span><span class="tot">${totalsMap[p.id]}</span></summary>
      <div class="detail">${cats.map((cn, i) => { const c = cells[i] || { t: "", p: 0, y: "Sin respuesta" }; return `<div><span>${esc(cn)}: ${c.t ? `<b>${esc(c.t)}</b>` : "<i>vacía</i>"}</span><span>${c.p} · ${esc(c.y)}</span></div>`; }).join("")}
      ${res.stopBy === p.id ? `<div><span>Cantó STOP</span><span>${rp - cells.reduce((s, c) => s + c.p, 0) ? "+" + (rp - cells.reduce((s, c) => s + c.p, 0)) : "sin bonus"}</span></div>` : ""}</div></details>`;
  }).join("")}</div>`;
}
function viewScores(o) {
  const res = o.res;
  const stopName = res.stopBy ? (o.players.find((p) => p.id === res.stopBy) || {}).name : null;
  return `<section class="sheetcard">
    <div class="row"><span class="letter-s" style="width:56px;height:56px;font-size:2.2rem;box-shadow:3px 3px 0 var(--ink)">${esc(res.letter)}</span>
    <div class="grow"><span class="lbl">Ronda ${o.n} de ${o.total}</span><h2>Puntos de la ronda</h2>${stopName ? `<p class="small muted">STOP de ${esc(stopName)}</p>` : ""}</div></div>
    <p class="note">Toca un nombre para ver sus puntos por categoría.</p>
    ${scoreRows(o.players, res, o.totals, res.cats)}
  </section>`;
}
function viewFinal(o) {
  const ids = o.players.map((p) => p.id);
  const st = G.stats(o.results, ids);
  const max = Math.max.apply(null, ids.map((id) => st[id].total));
  const winners = o.players.filter((p) => st[p.id].total === max);
  const keyf = { total: (p) => -st[p.id].total, valid: (p) => -st[p.id].valid, unique: (p) => -st[p.id].unique, stops: (p) => -st[p.id].stops, best: (p) => -st[p.id].best, name: (p) => p.name.toLowerCase() };
  const sk = keyf[S.sortBy] ? S.sortBy : "total";
  const rows = o.players.slice().sort((a, b) => { const x = keyf[sk](a), y = keyf[sk](b); return x < y ? -1 : x > y ? 1 : st[b.id].total - st[a.id].total; });
  const th = (k, label) => `<th scope="col" ${sk === k ? 'aria-sort="descending"' : ""}><button type="button" data-a="sortFinal" data-k="${k}">${label}</button></th>`;
  const rounds = Object.keys(o.results).map(Number).sort((a, b) => a - b);
  let best = null;
  rounds.forEach((n) => { const r = o.results[n]; ids.forEach((id) => { const p = (r.pts || {})[id] || 0; if (!best || p > best.p) best = { p, id, n, l: r.letter }; }); });
  const nameOf = (id) => (o.players.find((p) => p.id === id) || {}).name || "—";
  const totalValid = ids.reduce((s, id) => s + st[id].valid, 0);
  const topStop = ids.slice().sort((a, b) => st[b].stops - st[a].stops)[0];
  return `<section class="winner">
      <span class="lbl">${winners.length > 1 ? "Empate en cabeza" : "Gana la partida"}</span>
      <div class="crown"><span class="mark">${esc(winners.map((w) => w.name).join(" y "))}</span></div>
      <p class="muted">${max} puntos en ${rounds.length} ${rounds.length === 1 ? "ronda" : "rondas"}</p>
    </section>
    <section class="sheetcard"><h2>Clasificación</h2>
      <div class="tablewrap"><table class="final"><thead><tr>${th("name", "Jugador")}${th("total", "Total")}${th("valid", "Válidas")}${th("unique", "Únicas")}${th("stops", "STOP")}${th("best", "Mejor")}</tr></thead>
      <tbody>${rows.map((p) => `<tr><td>${esc(p.name)}</td><td><b>${st[p.id].total}</b></td><td>${st[p.id].valid}</td><td>${st[p.id].unique}</td><td>${st[p.id].stops}</td><td>${st[p.id].best}</td></tr>`).join("")}</tbody></table></div>
    </section>
    <section class="sheetcard"><h2>Estadísticas</h2>
      <div class="statgrid">
        <div class="stat"><span class="lbl">Mejor ronda</span><b>${best ? best.p : 0}</b><span class="small muted">${best ? esc(nameOf(best.id)) + " · letra " + esc(best.l) : "—"}</span></div>
        <div class="stat"><span class="lbl">Respuestas válidas</span><b>${totalValid}</b><span class="small muted">entre todos</span></div>
        <div class="stat"><span class="lbl">Más STOP</span><b>${topStop && st[topStop].stops ? esc(nameOf(topStop)) : "Nadie"}</b><span class="small muted">${topStop ? st[topStop].stops : 0} veces</span></div>
      </div>
      <span class="lbl">Letras jugadas</span>
      <div class="lettertrail">${rounds.map((n) => `<span title="Ronda ${n}">${esc(o.results[n].letter)}</span>`).join("")}</div>
    </section>`;
}

/* ---------- modo local (un dispositivo, por turnos) ---------- */
function saveLocal() { store.set("stop.local", S.L); }
function startLocal(cfg, names) {
  S.L = { v: 1, cfg, players: names.map((n, i) => ({ id: "p" + (i + 1), name: n })), n: 0, phase: "handoff", turn: 0, round: null,
    answers: {}, stopEl: {}, decisions: {}, results: {}, usedLetters: [], catUse: {}, cur: null, turnStart: 0, turnEnds: 0, endWhy: "", warned: false, scoresAt: 0 };
  localNextRound(); show("local");
}
function localNextRound() {
  const L = S.L;
  L.n++;
  const letter = G.pickLetter(L.cfg, L.usedLetters);
  const cats = G.pickCategories(L.cfg.pool, L.cfg.perRound, L.catUse);
  L.usedLetters.push(letter); cats.forEach((c) => { L.catUse[c.id] = (L.catUse[c.id] || 0) + 1; });
  Object.assign(L, { round: { letter, cats }, answers: {}, stopEl: {}, decisions: {}, rulings: {}, turn: 0, phase: "handoff", cur: null, scoresAt: 0 });
  S.judgeL = null;
  saveLocal();
}
function localBeginTurn() {
  const L = S.L;
  L.cur = L.round.cats.map(() => "");
  L.turnStart = Date.now() + 3000; L.turnEnds = L.turnStart + L.cfg.secs * 1000; L.warned = false;
  L.phase = "countdown"; saveLocal(); keepAwake(); render();
}
function localEndTurn(why) {
  const L = S.L; if (L.phase !== "play") return;
  const pid = L.players[L.turn].id;
  L.answers[pid] = L.cur.map((t) => G.clean(t));
  if (why === "stop") L.stopEl[pid] = Date.now() - L.turnStart;
  L.endWhy = why; L.phase = "turnover"; endCue(); saveLocal(); render();
}
function localStopBy() {
  const e = Object.entries(S.L.stopEl); if (!e.length) return null;
  return e.sort((a, b) => a[1] - b[1])[0][0];
}
function localResolve() {
  const L = S.L;
  return G.resolveRound({ players: L.players.map((p) => p.id), cats: L.round.cats, letter: L.round.letter, answers: L.answers, votes: {}, decisions: L.decisions, rulings: L.rulings || {}, cfg: L.cfg, stopBy: localStopBy(), decider: "Grupo" });
}
/* indicador de turno común (shared/turno.js). Solo el modo local va por turnos: en la sala online
   todos escriben y votan a la vez, así que ahí no se marca turno. */
const TCOL = ["#2F5BEA", "#E8424A", "#1C8550", "#9A3FD6", "#E07B00", "#0F8FA8", "#C2307A", "#6B7F00", "#7A5230", "#4B57C9", "#D14E2B", "#3A8F6E"];
function localTurno() {
  const L = S.L;
  if (S.screen !== "local" || !L || !["handoff", "countdown", "play"].includes(L.phase)) return null;
  const i = Math.min(L.turn, L.players.length - 1), p = L.players[i];
  return { quien: p.name, color: TCOL[i % TCOL.length], tuyo: null, clave: L.n + "-" + L.turn,
    accion: L.phase === "handoff" ? "Coge el móvil y pulsa «empezar»" : "Rellena las categorías con la letra " + L.round.letter };
}
function turnoMarca() {
  if (!window.SalaTurno) return;
  const t = localTurno();
  if (t) SalaTurno.marcar(t); else SalaTurno.limpiar();
  // Partida online en marcha: queda en la lista de partidas de la Sala
  if (S.screen === "room" && S.code && S.R && SalaTurno.enPartida) {
    if (S.R.status === "final") SalaTurno.fin(); else if (S.R.status !== "lobby") SalaTurno.enPartida(S.code);
  }
}
function renderLocal() {
  const L = S.L; if (!L) { S.screen = "home"; return renderHome(); }
  const p = L.players[L.turn] || L.players[0];
  const bar = topBar("Ronda " + L.n + "/" + L.cfg.rounds, { menu: "localMenu" });
  switch (L.phase) {
    case "handoff":
      return `${bar}<section class="big"><span class="lbl">Turno ${L.turn + 1} de ${L.players.length}</span>
        <h2>Pasa el móvil a<br>${esc(p.name)}</h2>
        <p class="muted">Cuando lo tengas, pulsa el botón: verás la letra y empezará a correr el tiempo.</p>
        <button type="button" class="btn pen wide" data-a="localBegin">Soy ${esc(p.name)}, empezar</button></section>`;
    case "countdown":
      return `${bar}<section class="big"><span class="lbl">${esc(p.name)}, prepárate</span><div class="num" id="cd">3</div></section>`;
    case "play":
      return `${bar}${window.SalaTurno ? SalaTurno.html(Object.assign(localTurno(), { compacta: true })) : ""}${viewPlay({ letter: L.round.letter, cats: L.round.cats, texts: L.cur, end: L.cfg.end, flexAll: L.cfg.flexAll, stopAction: "localStop" })}`;
    case "turnover": {
      const last = L.turn === L.players.length - 1, nx = L.players[L.turn + 1];
      const mine = L.answers[p.id] || [];
      return `${bar}<section class="big"><div class="num ${L.endWhy === "stop" ? "go" : ""}" style="font-size:clamp(3.4rem,20vw,6rem)">${L.endWhy === "stop" ? "¡STOP!" : "¡Tiempo!"}</div>
        <p class="muted">${esc(p.name)} ha escrito ${mine.filter(Boolean).length} de ${mine.length}.</p>
        ${L.cfg.privacy ? "" : `<div class="answers" style="text-align:left;width:100%">${L.round.cats.map((c, i) => `<div class="ansrow"><label>${esc(c.name)}</label><input disabled value="${esc(mine[i] || "")}"></div>`).join("")}</div>`}
        <button type="button" class="btn ${last ? "hi" : "pen"} wide" data-a="localNextTurn">${last ? "Revisar respuestas" : "Pasar el móvil a " + esc(nx.name)}</button></section>`;
    }
    case "review": return `${bar}${localReview()}`;
    case "scores": {
      const ids = L.players.map((x) => x.id), res = L.results[L.n];
      const last = L.n >= L.cfg.rounds;
      return `${bar}${viewScores({ players: L.players, res, totals: G.totals(L.results, ids), n: L.n, total: L.cfg.rounds })}
        <div class="row"><button type="button" class="btn ghost" data-a="localBackReview">Corregir</button>
        <button type="button" class="btn ${last ? "hi" : "pen"} grow" data-a="localAfterScores">${last ? "Ver clasificación final" : "Siguiente ronda"}</button></div>
        ${L.cfg.autoNext && !last ? `<p class="note" id="autonext"></p>` : ""}`;
    }
    case "final":
      return `${topBar("Final", { menu: "localMenu" })}${viewFinal({ players: L.players, results: L.results })}
        <div class="row"><button type="button" class="btn ghost grow" data-a="home">Inicio</button><button type="button" class="btn pen grow" data-a="localRematch">Revancha</button></div>`;
  }
  return bar;
}
function localReview() {
  const L = S.L, res = localResolve();
  const head = `<section class="sheetcard"><div class="row"><span class="letter-s" style="width:56px;height:56px;font-size:2.2rem;box-shadow:3px 3px 0 var(--ink)">${esc(L.round.letter)}</span>
    <div class="grow"><span class="lbl">Revisión · ronda ${L.n}</span><h2>¿Qué vale?</h2></div></div>
    ${judgeOn(L.cfg) && judgeReady()
      ? `<p class="disclaimer">El juez (Gemini) decide qué vale. Si no estáis de acuerdo, pulsad “Apelar” con vuestro argumento, o tocad Válida / No vale para imponer la decisión del grupo.</p>${judgeStatusHTML(S.judgeL, !(S.judgeL && S.judgeL.busy), !!(L.rulings && Object.keys(L.rulings).length))}`
      : `<p class="disclaimer">Ya viene marcado lo que la app comprueba sola (vacías, letra y repetidas). Decidid entre todos y tocad para cambiarlo.</p>${judgeOn(L.cfg) ? `<p class="note warn">El juez IA no está activado en esta app.</p>` : ""}`}</section>`;
  const blocks = L.round.cats.map((c, i) => `<section class="sheetcard catblock"><h3>${esc(c.name)}${L.cfg.flexAll || c.flex ? '<span class="flexchip">flexible</span>' : ""}</h3>
    ${L.players.map((p) => {
      const cell = res.cells[p.id][i], k = p.id + ":" + i;
      return `<div class="cell ${cell.verdict}"><div><div class="who">${esc(p.name)}</div><div class="txt ${cell.t ? "" : "empty"}">${cell.t ? esc(cell.t) : "Vacía"}</div></div>
        <div class="pts">${cell.pts}</div>
        <div class="why">${chipFor(cell)}<span>${esc(cell.why)}</span></div>
        ${judgeLine(cell)}
        ${cell.auto === "empty" ? "" : `<div class="votes" role="group" aria-label="Decisión para ${esc(cell.t)}">${["v", "i", "d"].map((v) => `<button type="button" class="vb ${v}" data-a="lverdict" data-k="${k}" data-v="${v}" aria-pressed="${L.decisions[k] === v || (!L.decisions[k] && cell.verdict === v)}">${G.VLABEL[v]}</button>`).join("")}
          ${judgeOn(L.cfg) && judgeReady() ? `<button type="button" class="vb more" data-a="appeal" data-k="${k}" data-mode="local">Apelar</button>` : ""}</div>`}
      </div>`;
    }).join("")}</section>`).join("");
  return head + blocks + `<button type="button" class="btn pen wide" data-a="localScore">Puntuar la ronda</button>`;
}
function chipFor(cell) {
  const cls = { v: "ok", i: "bad", d: "dup" }[cell.verdict];
  return `<span class="chip ${cls}">${G.VLABEL[cell.verdict]}</span>${cell.tie ? '<span class="chip">Empate</span>' : ""}${cell.auto === "letter" ? `<span class="chip bad">Otra letra</span>` : ""}`;

function localLive() {

    if (left <= 0) { L.phase = "play"; saveLocal(); goCue(); render(); return; }
    const el = $("#cd"); const v = String(Math.ceil(left / 1000));
    if (el && el.textContent !== v) { el.textContent = v; el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; beep(440, 0.08); }
  } else if (L.phase === "play") {
    const timed = L.cfg.end !== "stop";
    const remain = L.turnEnds - now;
    if (timed && remain <= 10000 && !L.warned) { L.warned = true; warnCue(); }
    if (timed && remain <= 0) { localEndTurn("time"); return; }
    updatePlay({ remain: timed ? remain : null, totalMs: L.cfg.secs * 1000, elapsed: now - L.turnStart, texts: L.cur, needAll: L.cfg.stopNeedsAll });
  } else if (L.phase === "scores" && L.cfg.autoNext && L.n < L.cfg.rounds && L.scoresAt) {

  }
}

/* ---------- multijugador online (db + user + room de claude.ai) ---------- */
const sNow = () => Date.now() + S.offset;
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const genCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const rkOf = (R) => R.code + "-" + R.gen + "-" + R.n;
const isHost = () => !!(S.R && S.R.host === S.uid);
function playersOf(R) {
  return Object.entries((R && R.players) || {}).filter(([, p]) => p && !p.kicked)
    .sort((a, b) => (a[1].order || 0) - (b[1].order || 0) || (a[1].joinedAt || 0) - (b[1].joinedAt || 0))
    .map(([id, p]) => ({ id, name: G.clean(p.name, G.LIMITS.name) || "Jugador", ready: !!p.ready }));
}
const nameOf = (id) => { const p = S.R && S.R.players && S.R.players[id]; return p ? G.clean(p.name, G.LIMITS.name) || "Jugador" : "Alguien"; };
function lockAt(R) {
  const r = R.round; if (!r) return Infinity;
  let t = R.cfg.end === "stop" ? Infinity : r.endsAt;
  if (r.stopAt) t = Math.min(t, r.stopAt + (R.cfg.end === "timer" ? 0 : (R.cfg.grace || 0) * 1000));
  return t;
}
function onlinePhase() {
  const R = S.R; if (!R) return "load";
  if (!R.players || !R.players[S.uid] || R.players[S.uid].kicked) return "guest";
  if (R.status === "lobby" || R.status === "final" || R.status === "scores") return R.status;
  if (!R.round) return "lobby";
  const now = sNow();
  if (now < R.round.startAt) return "countdown";
  if (now < lockAt(R)) return "play";
  return "review";
}
function validRoom(d) { return d && typeof d === "object" && typeof d.code === "string" && d.cfg && typeof d.cfg === "object" && d.players && typeof d.players === "object"; }
async function withRetry(fn) {

    throw e;

}
function dbErr(e, what) {

  else if (c === "quota_exceeded") toast("No caben más datos en el juego. Borra salas antiguas.");
  else if (c === "revoked") toast("Se ha cerrado tu acceso a la sala.");
  else toast("No se ha podido " + what + ". Revisa la conexión y vuelve a intentarlo.");
}

async function initCaps() {
  let db = null, user = null, room = null, sample = null;
  try {
    if (window.claude && typeof window.claude.use === "function")
      [db, user, room, sample] = await Promise.all(["db", "user", "room", "sample"].map((n) => window.claude.use(n).catch(() => null)));
  } catch (e) {}
  S.db = db; S.user = user; S.roomCap = room; S.sample = sample;
  if (user) {

    try { S.canWrite = await user.can("data.write"); } catch (e) {}
  }
  S.capState = db && S.uid ? "ok" : "none";
  if (S.capState === "ok") {
    syncClock();
    subscribeRooms();
    const resume = S.resumeCode || store.get("stop.cur", null);
    if (S.screen === "room" && S.code) openRoom(S.code);
    else if (S.joinCode && S.screen !== "local") show("join");
    else if (resume && S.screen === "home" && S.resumeCode) openRoom(resume);

}
// Reloj compartido: el plazo de un "lease" del servidor da su hora; se corrige el desfase de cada móvil.
async function syncClock() {
  let best = null;
  for (let k = 0; k < 3; k++) {
    try {
      const ref = S.db.doc("data/users/" + S.uid + "/clock");
      const t0 = Date.now();
      const r = await ref.acquire({ holder: "c" + Math.random().toString(36).slice(2), ttlMs: 1000 });
      const t1 = Date.now();
      if (r && r.acquired && r.expiresAt) {
        const off = Date.parse(r.expiresAt) - 1000 - (t0 + t1) / 2;
        if (isFinite(off) && (!best || t1 - t0 < best.rtt)) { best = { off, rtt: t1 - t0 }; S.offset = off; S.clockOk = true; }
      }
    } catch (e) {}
    await sleep(1200);
  }
  if (best) { S.offset = best.off; S.clockOk = true; }
}
function subscribeRooms() {
  if (S.unsubRooms) return;
  try {
    S.unsubRooms = S.db.collection("rooms").orderBy("updatedAt", "desc").limit(15).onSnapshot((snap) => {
      S.rooms = snap.docs.map((d) => d.data()).filter(validRoom); S.roomsLoaded = true;
      if (S.screen === "home") refresh();
    }, () => { S.roomsLoaded = true; });
  } catch (e) {}
}

async function createRoom(cfg) {
  if (S.busy) return; S.busy = true;
  const name = G.clean(S.name, G.LIMITS.name);
  store.set("stop.name", name);
  try {
    let code = null;
    for (let k = 0; k < 10 && !code; k++) {
      const c = genCode(); const s = await S.db.doc("rooms/" + c).get();
      if (!s.exists || sNow() - ((s.data() || {}).updatedAt || 0) > 86400e3) code = c;
    }
    if (!code) throw { code: "unavailable" };
    const now = sNow();
    const doc = { v: 1, code, gen: 1, createdAt: now, updatedAt: now, host: S.uid, cfg, status: "lobby", n: 0, round: null,
      players: { [S.uid]: { name, joinedAt: now, order: 0, ready: true, kicked: false } }, usedLetters: [], catUse: {}, decisions: {}, rulings: {}, appeals: {}, judging: null, results: {} };
    await withRetry(() => S.db.doc("rooms/" + code).set(doc));
    S.busy = false; S.setup = null;

async function joinRoom(code, name) {

  name = G.clean(name, G.LIMITS.name);
  if (code.length !== 4) return toast("El código tiene 4 letras.");
  if (!name) return toast("Escribe tu nombre.");
  if (S.busy) return; S.busy = true;
  store.set("stop.name", name); S.name = name;
  try {
    const snap = await withRetry(() => S.db.doc("rooms/" + code).get());
    if (!snap.exists || !validRoom(snap.data())) { S.busy = false; return toast("No hay ninguna sala con el código " + code + "."); }
    const d = snap.data(), me = d.players[S.uid];
    if (me && me.kicked) { S.busy = false; return toast("El anfitrión te ha sacado de esta sala."); }
    if (d.status === "final") { S.busy = false; return toast("Esa partida ya ha terminado."); }
    if (!me) {
      const order = Object.keys(d.players).length;
      await withRetry(() => S.db.doc("rooms/" + code).update({ players: { [S.uid]: { name, joinedAt: sNow(), order, ready: false, kicked: false } }, updatedAt: sNow() }));
    } else if (me.name !== name) {

function openRoom(code) {

function onRoom(d) {

  if (rk !== S.subRk) {
    Object.values(S.subs).forEach((u) => { try { u(); } catch (e) {} });
    S.subs = {}; S.ans = {}; S.vot = {}; S.myText = null; S.myVotes = {}; S.pubRk = null; S.warnedRk = null; S.endedRk = null;
    S.subRk = rk;

  if (!rk) return;
  playersOf(R).forEach(({ id }) => {
    if (!S.subs["a" + id]) {

        S.subs["a" + id] = S.db.doc("ans/" + id + "/r/" + rk).onSnapshot((s) => {

/* ---------- juez IA (Claude, vía capacidad "sample") ---------- */
const JUDGE_ERR = {
  not_granted: "Google no deja usar el juez IA con esta app (Firebase AI Logic sin activar o clave restringida). Decidid votando.",
  rate_limited: "Gemini está saturado o se ha gastado la cuota gratis de ahora. Pídelo otra vez en un minuto o decidid votando.",
  session_expired: "Se ha perdido la sesión. Recarga la página y vuelve a pedirlo.",
  sampling_disabled: "El juez IA no está disponible ahora. Decidid votando.",
};
const judgeOn = (cfg) => cfg && cfg.judge === "ai";
const judgeReady = () => !!S.sample;

/**
 * ctx: {letter, cats, cfg, ids, answers:{id:[t]}, votes:{voter:{k:{v,r}}}, keys?:[k], appeal?:{k, arg, by}}
 * Devuelve {k: {v, w}} solo para las claves juzgadas.
 */
async function askJudge(ctx) {
  if (!S.sample) throw { code: "unavailable" };
  const items = [], map = {};
  const only = ctx.keys ? new Set(ctx.keys) : null;
  ctx.cats.forEach((c, i) => ctx.ids.forEach((id) => {
    const k = id + ":" + i, t = G.clean((ctx.answers[id] || [])[i]);
    if (!t || (only && !only.has(k))) return;
    const args = [];
    Object.keys(ctx.votes || {}).forEach((voter) => { const v = ctx.votes[voter] && ctx.votes[voter][k]; if (v && v.r) args.push(v); });
    if (ctx.appeal && ctx.appeal.k === k && G.clean(ctx.appeal.arg)) args.push({ v: ctx.appeal.v || "v", r: ctx.appeal.arg });
    const xid = "x" + items.length; map[xid] = k;
    items.push({ id: xid, cat: c.name, flex: c.flex, t, args });
  }));
  if (!items.length) return {};
  const prompt = G.judgePrompt(items, ctx.letter, { flexAll: ctx.cfg.flexAll, appeal: !!ctx.appeal });
  const data = await S.sample.json(prompt, { modelTier: ctx.appeal ? "default" : "quick", cache: !ctx.appeal });
  const got = G.parseRulings(data, Object.keys(map));
  if (!Object.keys(got).length) throw { code: "invalid_json" };
  const out = {};
  Object.keys(got).forEach((x) => { out[map[x]] = got[x]; });
  return out;
}
function judgeErrText(e) {
  const t = JUDGE_ERR[e && e.code] || "El juez no ha podido responder. Pídelo otra vez o decidid votando.";
  if (!e || !e.status) return t;
  // Detalle de Google sin la URL, para saber qué falla exactamente
  const d = String(e.detail || "").replace(/^.*?\[\d{3}[^\]]*\]\s*/, "").replace(/\s*\(AI\/[^)]*\)\s*$/, "").slice(0, 160);
  return `${t} (código ${e.status}${d ? ": " + d : ""})`;
}

function judgeStatusHTML(st, canAsk, hasRulings) {
  if (st && st.busy) return `<div class="judgebar busy" role="status"><span class="gavel" aria-hidden="true">⚖</span><span class="grow">${st.appeal ? "El juez está estudiando la apelación…" : "El juez está revisando las respuestas…"}</span></div>`;
  let h = "";
  if (st && st.err) h += `<p class="note warn">${esc(st.err)}</p>`;
  if (canAsk) h += `<button type="button" class="btn ghost wide" data-a="judgeAll">${hasRulings ? "Volver a pedir veredicto al juez" : "Pedir veredicto al juez"}</button>`;
  return h;
}
function judgeLine(cell) {
  if (!cell.judge) return "";
  return `<div class="verdict ${cell.judge.v}"><span class="gavel" aria-hidden="true">⚖</span><span><b>Juez:</b> ${cell.judge.v === "v" ? "vale" : "no vale"}${cell.judge.w ? ". " + esc(cell.judge.w) : ""}${cell.rule !== "Juez" ? ` <i>(manda ${cell.rule === "Anfitrión" ? "el anfitrión" : cell.rule === "Grupo" ? "el grupo" : "la regla"})</i>` : ""}</span></div>`;
}
function openAppeal(k, mode) {
  const ctx = mode === "local" ? localJudgeCtx() : onlineJudgeCtx();
  const [uid, iStr] = k.split(":"), i = +iStr;
  const t = G.clean((ctx.answers[uid] || [])[i]);
  const res = mode === "local" ? localResolve() : onlineResolve();
  const cell = res.cells[uid] && res.cells[uid][i]; if (!cell) return;
  openSheet(`<span class="lbl">Apelación · ${esc(ctx.cats[i].name)}</span>
    <h2 style="font-family:var(--f-hand);font-size:1.8em;color:var(--pen)">${esc(t)}</h2>
    ${cell.judge ? judgeLine(cell) : `<p class="note">El juez aún no se ha pronunciado sobre esta respuesta.</p>`}
    <form class="stack" data-form="appeal" data-k="${esc(k)}" data-mode="${mode}" novalidate>
      <div class="seg fill">${["v", "i"].map((v) => `<button type="button" class="opt" data-a="pickVote" data-v="${v}" aria-pressed="${(cell.judge ? cell.judge.v !== v : v === "v")}">${v === "v" ? "Defiendo que vale" : "Defiendo que no vale"}</button>`).join("")}</div>
      <input type="hidden" id="vv" value="${cell.judge && cell.judge.v === "v" ? "i" : "v"}">
      <div class="field"><label for="arg">Tu argumento para el juez</label>
        <textarea id="arg" class="input area" maxlength="${G.LIMITS.reason}" rows="3" placeholder="Ej.: farmear aura es justo lo que harías siendo invisible"></textarea></div>

    </form>
    <button type="button" class="btn ghost wide" data-a="closeSheet">Cancelar</button>`);
